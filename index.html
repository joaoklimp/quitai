<style>
/* Layout: "papel e carimbo" — superfícies claras como papel, tinta azul de carimbo como acento único;
   site público com hero assimétrico, painel com barra lateral fixa + área de trabalho em grade. */
:root {
  /* cor */
  --bg: #F3F4F8;
  --surface: #FFFFFF;
  --surface-2: #F7F8FB;
  --surface-3: #ECEEF4;
  --line: #E1E4EC;
  --line-strong: #CCD1DD;
  --ink: #121521;
  --ink-2: #4B5165;
  --ink-3: #676D82;
  --accent: #2B3FCB;          /* azul carimbo: preenchimentos */
  --accent-hover: #2233B0;
  --accent-text: #2B3FCB;     /* azul carimbo: texto e links */
  --accent-soft: #E9ECFD;
  --accent-ink: #FFFFFF;
  --on-fill: #FFFFFF;
  --band-bg: #18206B;         /* faixa em tinta profunda */
  --band-ink: #FFFFFF;
  --band-ink-2: #C9CEF5;
  --band-line: #2D3690;

  /* estados (semântica, separada do acento) */
  --ok: #0E7843;      --ok-soft: #E4F5EC;   --ok-mark: #1C9A57;
  --warn: #9A5B00;    --warn-soft: #FFF2D9; --warn-mark: #E0A21E;
  --bad: #C42B3A;     --bad-soft: #FDE7EA;  --bad-mark: #D8394A;  --bad-fill: #C42B3A;
  --muted: #676D82;   --muted-soft: #EEF0F4;

  /* gráficos */
  --chart-bar: #2B3FCB;
  --grid: #E8EBF1;
  --axis: #CCD1DD;
  --age-1: #EE8B94; --age-2: #E2616E; --age-3: #CD3B4B; --age-4: #A82536; --age-5: #7A1627;

  --toast-bg: #151A2B;
  --toast-ink: #FFFFFF;
  --backdrop: rgba(12, 15, 24, 0.5);
  --shadow-1: 0 1px 2px rgba(18, 21, 33, 0.05);
  --shadow-pop: 0 18px 40px rgba(18, 21, 33, 0.16), 0 2px 6px rgba(18, 21, 33, 0.08);

  /* tipo */
  --font-display: "Archivo", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --font-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --r-sm: 6px;
  --r: 8px;
  --r-lg: 12px;
  --sidebar-w: 252px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0F16; --surface: #141823; --surface-2: #191E2B; --surface-3: #202636;
    --line: #262D3E; --line-strong: #353E54;
    --ink: #E9ECF4; --ink-2: #A9B0C4; --ink-3: #8A92A8;
    --accent: #4A5DEB; --accent-hover: #5B6CF2; --accent-text: #8E9CFF; --accent-soft: #1F2754; --accent-ink: #FFFFFF;
    --band-bg: #151B52; --band-ink: #FFFFFF; --band-ink-2: #B9BFEF; --band-line: #2A3378;
    --ok: #46D08E; --ok-soft: #12301F; --ok-mark: #3CC983;
    --warn: #F0B44C; --warn-soft: #33280F; --warn-mark: #F0B44C;
    --bad: #FF7A86; --bad-soft: #3A171C; --bad-mark: #FF6B7A; --bad-fill: #D8394A;
    --muted: #8A92A8; --muted-soft: #222839;
    --chart-bar: #6272F0; --grid: #222838; --axis: #353E54;
    --age-1: #8A2A37; --age-2: #B03445; --age-3: #D54657; --age-4: #F06C79; --age-5: #FF9EA7;
    --toast-bg: #E9ECF4; --toast-ink: #121521;
    --backdrop: rgba(0, 0, 0, 0.62);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-pop: 0 18px 44px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0F16; --surface: #141823; --surface-2: #191E2B; --surface-3: #202636;
  --line: #262D3E; --line-strong: #353E54;
  --ink: #E9ECF4; --ink-2: #A9B0C4; --ink-3: #8A92A8;
  --accent: #4A5DEB; --accent-hover: #5B6CF2; --accent-text: #8E9CFF; --accent-soft: #1F2754; --accent-ink: #FFFFFF;
  --band-bg: #151B52; --band-ink: #FFFFFF; --band-ink-2: #B9BFEF; --band-line: #2A3378;
  --ok: #46D08E; --ok-soft: #12301F; --ok-mark: #3CC983;
  --warn: #F0B44C; --warn-soft: #33280F; --warn-mark: #F0B44C;
  --bad: #FF7A86; --bad-soft: #3A171C; --bad-mark: #FF6B7A; --bad-fill: #D8394A;
  --muted: #8A92A8; --muted-soft: #222839;
  --chart-bar: #6272F0; --grid: #222838; --axis: #353E54;
  --age-1: #8A2A37; --age-2: #B03445; --age-3: #D54657; --age-4: #F06C79; --age-5: #FF9EA7;
  --toast-bg: #E9ECF4; --toast-ink: #121521;
  --backdrop: rgba(0, 0, 0, 0.62);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-pop: 0 18px 44px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden]:not([hidden="until-found" i]) { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body.modal-open { overflow: hidden; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
a { color: var(--accent-text); text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
::selection { background: var(--accent-soft); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--ink-3); }
.ink2 { color: var(--ink-2); }
.nowrap { white-space: nowrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.stack-lg { display: grid; gap: 20px; }
.stack > *, .stack-lg > * { min-width: 0; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.i-sm { width: 15px; height: 15px; }
.i-lg { width: 22px; height: 22px; }
.i-xl { width: 28px; height: 28px; }

/* ---------- botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 38px; padding: 0 14px;
  border-radius: var(--r); border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 14px; line-height: 1; white-space: nowrap;
  text-decoration: none; cursor: pointer;
  transition: background-color .15s, border-color .15s, color .15s, box-shadow .15s;
}
.btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-3); border-color: transparent; color: var(--ink); }
.btn-danger { background: var(--bad-fill); border-color: var(--bad-fill); color: var(--on-fill); }
.btn-danger:hover { filter: brightness(1.06); background: var(--bad-fill); border-color: var(--bad-fill); }
.btn-danger-outline { color: var(--bad); border-color: var(--line-strong); }
.btn-danger-outline:hover { background: var(--bad-soft); border-color: var(--bad); }
.btn-wa { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.btn-wa:hover { background: var(--ok-soft); border-color: var(--ok); }
.btn-soft { background: var(--accent-soft); border-color: transparent; color: var(--accent-text); }
.btn-soft:hover { background: var(--accent-soft); border-color: var(--accent-text); }
.btn-sm { height: 32px; padding: 0 11px; font-size: 13px; gap: 6px; }
.btn-xs { height: 28px; padding: 0 9px; font-size: 12.5px; gap: 5px; border-radius: 7px; }
.btn-lg { height: 48px; padding: 0 22px; font-size: 15.5px; }
.btn-icon { width: 38px; padding: 0; }
.btn-sm.btn-icon { width: 32px; }
.btn-xs.btn-icon { width: 28px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; transform: none; }
.btn-block { width: 100%; }
.btn .badge-lock { color: inherit; opacity: .8; }
.link-btn { background: none; border: none; padding: 0; color: var(--accent-text); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.link-btn:hover { text-decoration-thickness: 2px; }

/* ---------- formulários ---------- */
.field { display: grid; gap: 6px; min-width: 0; align-content: start; }
.field > label, .label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.req { color: var(--bad); }
.input, .select, .textarea {
  width: 100%; height: 40px; padding: 0 12px;
  border: 1px solid var(--line-strong); border-radius: var(--r);
  background: var(--surface); color: var(--ink); font-size: 14px;
  transition: border-color .15s, box-shadow .15s;
}
.textarea { height: auto; min-height: 110px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.input::placeholder, .textarea::placeholder { color: var(--ink-3); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent-text); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.is-invalid, .select.is-invalid, .textarea.is-invalid { border-color: var(--bad); }
.input[readonly] { background: var(--surface-2); }
.select-wrap { position: relative; display: block; min-width: 0; }
.select { appearance: none; -webkit-appearance: none; padding-right: 34px; cursor: pointer; }
.select-wrap::after {
  content: ""; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px;
  border: solid var(--ink-3); border-width: 0 1.6px 1.6px 0; transform: translateY(-70%) rotate(45deg); pointer-events: none;
}
.input-affix { position: relative; display: block; }
.input-affix .affix { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-weight: 600; pointer-events: none; font-size: 14px; }
.input-affix .input { padding-left: 38px; }
.input-affix .affix-btn { position: absolute; right: 4px; top: 4px; height: 32px; }
.input-affix.has-btn .input { padding-right: 44px; }
.field-error { color: var(--bad); font-size: 12.5px; font-weight: 500; }
.hint { color: var(--ink-3); font-size: 12.5px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.form-grid .span-2 { grid-column: 1 / -1; }
.form-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 16px; }
.check { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.check input { width: 17px; height: 17px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.fieldset { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; display: grid; gap: 12px; }
.fieldset legend { padding: 0 6px; font-size: 13px; font-weight: 650; color: var(--ink-2); }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface-3); gap: 2px; flex-wrap: wrap; }
.seg button { border: none; background: transparent; height: 32px; padding: 0 12px; border-radius: 7px; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.switch { position: relative; width: 38px; height: 22px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line-strong); transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.switch input:disabled + span { opacity: .5; }
.radio-cards { display: grid; gap: 8px; }
.radio-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 10px; cursor: pointer; background: var(--surface); }
.radio-card:has(input:checked) { border-color: var(--accent-text); box-shadow: 0 0 0 3px var(--accent-soft); }
.radio-card input { accent-color: var(--accent); width: 17px; height: 17px; margin: 0; }
.radio-card .rc-title { font-weight: 650; }
.radio-card .rc-sub { font-size: 12.5px; color: var(--ink-3); }
.radio-card .rc-price { margin-left: auto; font-weight: 700; white-space: nowrap; }

/* ---------- chips e status ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px;
  border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap;
  background: var(--muted-soft); color: var(--ink-2);
}
.chip .i { width: 14px; height: 14px; }
.chip-accent { background: var(--accent-soft); color: var(--accent-text); }
.st-pago { background: var(--ok-soft); color: var(--ok); }
.st-pendente { background: var(--warn-soft); color: var(--warn); }
.st-atrasado { background: var(--bad-soft); color: var(--bad); }
.st-cancelado { background: var(--muted-soft); color: var(--muted); }
.status-pill { position: relative; display: inline-flex; align-items: center; height: 28px; border-radius: 999px; font-size: 12.5px; font-weight: 650; }
.status-pill > .i { position: absolute; left: 9px; width: 14px; height: 14px; pointer-events: none; }
.status-pill > .chev { position: absolute; right: 9px; width: 12px; height: 12px; pointer-events: none; opacity: .8; }
.status-pill select {
  appearance: none; -webkit-appearance: none; border: none; background: transparent; color: inherit;
  height: 28px; padding: 0 28px 0 28px; border-radius: 999px; font-weight: 650; font-size: 12.5px; cursor: pointer;
}
.status-pill select:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.status-pill select option { color: var(--ink); background: var(--surface); }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 5px; font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; background: var(--surface-3); color: var(--ink-2); }
.tag-accent { background: var(--accent-soft); color: var(--accent-text); }
.tag-soon { background: var(--warn-soft); color: var(--warn); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* ---------- cartões ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 18px 0; flex-wrap: wrap; }
.card-head h2, .card-head h3 { font-size: 15px; font-weight: 650; }
.card-sub { color: var(--ink-3); font-size: 13px; margin-top: 2px; }
.card-body { padding: 16px 18px 18px; }
.card-body.flush { padding: 8px 0 0; }
.card-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.divider { height: 1px; background: var(--line); border: 0; margin: 0; }
.callout { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); font-size: 13.5px; }
.callout .i { color: var(--accent-text); margin-top: 1px; }
.callout.warn { background: var(--warn-soft); }
.callout.warn .i { color: var(--warn); }
.callout.bad { background: var(--bad-soft); }
.callout.bad .i { color: var(--bad); }
.callout.ok { background: var(--ok-soft); }
.callout.ok .i { color: var(--ok); }

/* ---------- tabelas ---------- */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.table th {
  text-align: left; font-weight: 600; color: var(--ink-3); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em;
  padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap;
}
.table td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table .td-client { min-width: 150px; }
.table td.nowrap, .table th.nowrap { white-space: nowrap; }
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr.clickable { cursor: pointer; }
.table tbody tr:hover td { background: var(--surface-2); }
.table tr.is-selected td { background: var(--accent-soft); }
.table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.table .actions { text-align: right; white-space: nowrap; width: 1%; }
.table .actions-inner { display: inline-flex; gap: 6px; align-items: center; justify-content: flex-end; }
.table .cb { width: 36px; padding-right: 0; }
.table .cb input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; display: block; }
.table tfoot td { font-weight: 700; background: var(--surface-2); border-top: 1px solid var(--line); border-bottom: 0; }
.cell-main { font-weight: 600; color: var(--ink); }
.desc-cell { min-width: 0; }
.desc-cell .ellipsis { max-width: 260px; }
.cell-sub { font-size: 12.5px; color: var(--ink-3); }
.cell-name { display: flex; align-items: center; gap: 10px; min-width: 0; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; background: var(--accent-soft); color: var(--accent-text); letter-spacing: .02em; }
.avatar.lg { width: 48px; height: 48px; font-size: 16px; }
.num-id { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-3); }
.status-cell { position: relative; }

/* ---------- toolbar / filtros ---------- */
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.toolbar .search { position: relative; flex: 1 1 240px; max-width: 360px; min-width: 0; }
.toolbar .search .i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.toolbar .search .input { padding-left: 36px; }
.toolbar .select-wrap { flex: 0 1 auto; }
.toolbar .select { width: auto; min-width: 150px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  border: none; background: none; padding: 10px 12px; font-weight: 600; font-size: 13.5px; color: var(--ink-3);
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center;
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent-text); }
.tabs .count { font-size: 12px; font-weight: 600; color: var(--ink-3); background: var(--surface-3); border-radius: 999px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
.bulkbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.summary-line { display: flex; gap: 16px; flex-wrap: wrap; color: var(--ink-3); font-size: 13px; }
.summary-line strong { color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- vazio ---------- */
.empty { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 40px 20px; color: var(--ink-2); }
.empty .empty-ico { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); }
.empty h3 { font-size: 16px; color: var(--ink); }
.empty p { max-width: 46ch; font-size: 13.5px; }
.empty-sm { padding: 22px 12px; }

/* ---------- menus, modais, toasts ---------- */
.menu {
  position: fixed; z-index: 150; min-width: 210px; max-width: calc(100vw - 24px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-pop); padding: 6px;
}
.menu button, .menu a {
  display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px;
  background: none; border: none; text-align: left; cursor: pointer; color: var(--ink); font-size: 13.5px; text-decoration: none; white-space: nowrap;
}
.menu button:hover, .menu a:hover, .menu button:focus-visible, .menu a:focus-visible { background: var(--surface-3); outline: none; }
.menu .danger { color: var(--bad); }
.menu button[disabled] { opacity: .45; cursor: not-allowed; }
.menu-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.menu-label { padding: 6px 10px 4px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
.popover { position: fixed; z-index: 150; width: min(380px, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-pop); overflow: hidden; }
.popover-head { padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 650; display: flex; justify-content: space-between; align-items: center; }
.popover-list { max-height: 60vh; overflow-y: auto; }
.pop-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-bottom: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; color: var(--ink); cursor: pointer; font-size: 13.5px; }
.pop-item:last-child { border-bottom: 0; }
.pop-item:hover { background: var(--surface-2); }
.pop-ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.modal-backdrop {
  position: fixed; inset: 0; z-index: 120; background: var(--backdrop);
  display: flex; align-items: flex-start; justify-content: center;
  padding: max(5vh, 16px) 16px 16px; overflow-y: auto; animation: fade-in .15s ease-out;
}
.modal {
  width: 100%; max-width: 580px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: var(--shadow-pop); display: flex; flex-direction: column; animation: pop-in .18s ease-out;
}
.modal.sm { max-width: 440px; }
.modal.lg { max-width: 780px; }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 20px 4px; }
.modal-head h2 { font-size: 18px; font-weight: 700; }
.modal-head .modal-sub { color: var(--ink-3); font-size: 13px; margin-top: 3px; }
.modal-body { padding: 14px 20px 18px; display: grid; gap: 16px; }
.modal-foot { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.modal-foot .left { margin-right: auto; }
.toasts { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 200; justify-items: end; }
.toast {
  display: flex; align-items: center; gap: 12px; width: max-content; max-width: min(440px, calc(100vw - 32px));
  padding: 11px 12px 11px 14px; background: var(--toast-bg); color: var(--toast-ink); border-radius: 10px;
  box-shadow: var(--shadow-pop); font-size: 13.5px; font-weight: 500; animation: toast-in .2s ease-out;
}
.toast .i { flex: none; }
.toast .t-ok { color: var(--ok-mark); }
.toast .t-warn { color: var(--warn-mark); }
.toast .t-bad { color: var(--bad-mark); }
.toast button { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 7px; padding: 5px 10px; font-weight: 650; font-size: 12.5px; white-space: nowrap; opacity: .92; }
.toast button:hover { opacity: 1; }
.toast .toast-x { border: none; padding: 4px; opacity: .6; display: grid; place-items: center; }
.tooltip {
  position: fixed; z-index: 300; pointer-events: none; background: var(--toast-bg); color: var(--toast-ink);
  padding: 8px 10px; border-radius: 8px; font-size: 12.5px; box-shadow: var(--shadow-pop); white-space: nowrap; transform: translate(-50%, calc(-100% - 10px));
}
.tooltip strong { font-size: 13.5px; display: block; font-variant-numeric: tabular-nums; }
.tooltip .tt-sub { opacity: .75; }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop-in { from { transform: translateY(8px) scale(.985); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes toast-in { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- carimbo ---------- */
.stamp {
  display: inline-block; font-family: var(--font-display); font-stretch: 72%; font-weight: 900; text-transform: uppercase;
  letter-spacing: .02em; color: var(--accent-text); border: .075em solid currentColor; border-radius: .14em; padding: .02em .16em 0;
  line-height: 1.02; transform: rotate(-4deg);
}
.paid-stamp {
  position: absolute; left: 50%; top: 50%; z-index: 2; pointer-events: none;
  font-family: var(--font-display); font-stretch: 72%; font-weight: 900; font-size: 20px; letter-spacing: .04em;
  color: var(--ok); border: 3px solid currentColor; border-radius: 5px; padding: 1px 8px 0; background: var(--surface);
  animation: stamp-row 1.6s cubic-bezier(.2, .9, .3, 1.2) both;
}
@keyframes stamp-row {
  0% { transform: translate(-50%, -50%) rotate(-10deg) scale(1.9); opacity: 0; }
  18% { transform: translate(-50%, -50%) rotate(-10deg) scale(.94); opacity: 1; }
  26% { transform: translate(-50%, -50%) rotate(-10deg) scale(1); opacity: 1; }
  80% { transform: translate(-50%, -50%) rotate(-10deg) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -50%) rotate(-10deg) scale(1); opacity: 0; }
}

/* ---------- logo ---------- */
.logo { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); }
.logo svg { width: 30px; height: 30px; flex: none; }
.logo-word { font-family: var(--font-display); font-stretch: 118%; font-weight: 800; font-size: 21px; letter-spacing: -.02em; line-height: 1; }
.logo-mark-bg { fill: var(--accent); }
.logo-mark-fg { fill: none; stroke: var(--accent-ink); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }

/* ================= SITE PÚBLICO ================= */
.lp { background: var(--bg); }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 24px; }
.lp-nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.lp-nav .wrap { display: flex; align-items: center; gap: 20px; height: 66px; }
.lp-links { display: flex; gap: 4px; margin-left: 12px; }
.lp-links button { background: none; border: none; color: var(--ink-2); font-weight: 600; font-size: 14px; padding: 8px 10px; border-radius: 8px; }
.lp-links button:hover { color: var(--ink); background: var(--surface-3); }
.lp-nav-cta { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.lp-burger { display: none; }

.hero { display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(0, 1fr); gap: 56px; align-items: center; padding-block: 64px 80px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-text); }
.display {
  font-family: var(--font-display); font-stretch: 112%; font-weight: 800; font-size: clamp(38px, 5vw, 64px);
  line-height: 1.04; letter-spacing: -.028em; color: var(--ink);
}
.display .quote { color: var(--ink-2); font-weight: 700; }
.display .stamp { font-size: .98em; margin-left: .08em; animation: stamp-in .5s cubic-bezier(.2, .85, .3, 1.25) .3s both; }
@keyframes stamp-in {
  0% { transform: rotate(-4deg) scale(1.16); }
  60% { transform: rotate(-4deg) scale(.97); }
  100% { transform: rotate(-4deg) scale(1); }
}
.hero-copy { display: grid; gap: 22px; align-content: center; min-width: 0; }
.hero-lead { font-size: 18px; line-height: 1.6; color: var(--ink-2); max-width: 54ch; }
.hero-cta { display: flex; gap: 10px; flex-wrap: wrap; }
.hero-note { display: flex; gap: 16px; flex-wrap: wrap; color: var(--ink-3); font-size: 13px; }
.hero-note span { display: inline-flex; align-items: center; gap: 6px; }
.hero-note .i { color: var(--ok); width: 16px; height: 16px; }

.hero-visual { position: relative; min-width: 0; padding-bottom: 56px; }
.mock { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-pop); overflow: hidden; }
.mock-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.mock-title { font-weight: 700; font-size: 14px; }
.mock-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.mock-kpis > div { padding: 14px 18px; display: grid; gap: 4px; min-width: 0; }
.mock-kpis > div + div { border-left: 1px solid var(--line); }
.mk-l { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); font-weight: 600; }
.mock-kpis strong { font-size: 19px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.mock-list { list-style: none; }
.mock-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); font-size: 13px; }
.mock-list li:last-child { border-bottom: 0; }
.ml-name { display: grid; min-width: 0; font-weight: 600; }
.ml-name small { font-weight: 500; color: var(--ink-3); font-size: 12px; }
.ml-val { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.bubble {
  position: absolute; left: -28px; bottom: 0; width: min(330px, 86%);
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; box-shadow: var(--shadow-pop);
  padding: 12px 14px; display: grid; gap: 6px; font-size: 13px; color: var(--ink-2);
}
.bubble-head { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ok); }
.bubble p strong { color: var(--ink); }
.mock-note { position: absolute; right: 4px; bottom: 16px; font-size: 11.5px; color: var(--ink-3); }

.section { padding-block: 84px; scroll-margin-top: 70px; }
.section.alt { background: var(--surface); border-block: 1px solid var(--line); }
.section-head { display: grid; gap: 12px; max-width: 720px; margin-bottom: 40px; }
.h2 { font-family: var(--font-display); font-stretch: 112%; font-weight: 780; font-size: clamp(28px, 3.4vw, 42px); letter-spacing: -.022em; line-height: 1.08; }
.lead { font-size: 17px; line-height: 1.6; color: var(--ink-2); max-width: 60ch; }

.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; }
.step { padding: 26px 26px 28px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.step + .step { border-left: 1px solid var(--line); }
.step-n { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--accent-text); display: flex; align-items: center; gap: 10px; }
.step-n::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.step h3 { font-size: 19px; font-weight: 700; }
.step p { color: var(--ink-2); font-size: 14.5px; }

.feat-rows { display: grid; gap: 20px; }
.feat-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 40px; align-items: center; padding: 28px; border: 1px solid var(--line); border-radius: 18px; background: var(--bg); }
.feat-row:nth-child(even) .feat-copy { order: 2; }
.feat-copy { display: grid; gap: 12px; min-width: 0; }
.feat-copy h3 { font-family: var(--font-display); font-stretch: 108%; font-size: 26px; font-weight: 750; letter-spacing: -.015em; line-height: 1.12; }
.feat-copy p { color: var(--ink-2); font-size: 15.5px; line-height: 1.6; }
.feat-visual { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; display: grid; gap: 14px; }
.fv-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.fv-kpi { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.fv-kpi span { font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.fv-kpi strong { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fv-status { display: grid; gap: 6px; max-width: 280px; justify-self: center; width: 100%; }
.fv-status .opt { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px; font-weight: 600; font-size: 13.5px; border: 1px solid var(--line); }
.fv-status .opt.on { border-color: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.fv-status .opt .chip { margin-left: auto; }
.fv-code { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border: 1px dashed var(--line-strong); border-radius: 10px; padding: 12px; line-height: 1.6; overflow-wrap: anywhere; }
.fv-code mark { background: var(--accent-soft); color: var(--accent-text); border-radius: 4px; padding: 0 3px; }
.feat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 20px; }
.feat { padding: 22px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); display: grid; gap: 8px; align-content: start; min-width: 0; }
.feat .feat-ico { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); margin-bottom: 4px; }
.feat h3 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.feat p { color: var(--ink-2); font-size: 14px; }

.audience { display: flex; flex-wrap: wrap; gap: 10px; }
.audience span { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 14px; }
.audience .i { color: var(--accent-text); width: 16px; height: 16px; }

.pricing { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: stretch; }
.plan { position: relative; display: flex; flex-direction: column; gap: 18px; padding: 26px 24px 24px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); min-width: 0; }
.plan.featured { border: 2px solid var(--accent-text); box-shadow: var(--shadow-pop); }
.plan-tag { position: absolute; top: -13px; left: 22px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; letter-spacing: .02em; }
.plan-name { font-family: var(--font-display); font-stretch: 112%; font-weight: 800; font-size: 22px; letter-spacing: -.01em; }
.plan-aud { color: var(--ink-2); font-size: 14px; min-height: 42px; }
.price { display: flex; align-items: baseline; gap: 6px; }
.price-val { font-family: var(--font-display); font-stretch: 108%; font-weight: 800; font-size: 44px; letter-spacing: -.03em; line-height: 1; }
.price-cur { font-weight: 700; font-size: 18px; color: var(--ink-2); }
.price-per { color: var(--ink-3); font-weight: 600; }
.plan-limit { display: flex; align-items: center; gap: 8px; font-weight: 700; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.plan-limit .i { color: var(--accent-text); }
.plan-list { list-style: none; display: grid; gap: 9px; font-size: 14px; color: var(--ink-2); }
.plan-list li { display: flex; gap: 9px; align-items: flex-start; }
.plan-list .i { color: var(--ok); width: 17px; height: 17px; margin-top: 2px; }
.plan-list .plus { font-weight: 700; color: var(--ink); }
.plan-support { font-size: 13px; color: var(--ink-3); display: flex; gap: 8px; align-items: center; padding-top: 14px; border-top: 1px solid var(--line); margin-top: auto; }
.pricing-note { margin-top: 18px; color: var(--ink-3); font-size: 13.5px; display: flex; gap: 18px; flex-wrap: wrap; }
.compare { margin-top: 26px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.compare > summary { padding: 16px 20px; font-weight: 650; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
.compare > summary::-webkit-details-marker { display: none; }
.compare[open] > summary .i { transform: rotate(180deg); }
.compare .table td, .compare .table th { text-align: center; }
.compare .table td:first-child, .compare .table th:first-child { text-align: left; }
.yes { color: var(--ok); }
.no { color: var(--ink-3); }

.faq { max-width: 820px; }
.faq details { border-bottom: 1px solid var(--line); }
.faq summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 18px 0; font-weight: 650; font-size: 16.5px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary .i { transition: transform .2s; color: var(--ink-3); }
.faq details[open] summary .i { transform: rotate(45deg); }
.faq details p { padding: 0 0 18px; color: var(--ink-2); font-size: 15px; line-height: 1.65; max-width: 68ch; }

.cta-band { background: var(--band-bg); color: var(--band-ink); }
.cta-band .wrap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: center; padding-block: 64px; }
.cta-band h2 { font-family: var(--font-display); font-stretch: 114%; font-weight: 800; font-size: clamp(28px, 3.4vw, 42px); letter-spacing: -.02em; line-height: 1.06; }
.cta-band p { color: var(--band-ink-2); font-size: 16px; margin-top: 10px; }
.cta-band .btn-primary { background: var(--band-ink); color: var(--band-bg); border-color: var(--band-ink); }
.cta-band .btn-primary:hover { background: var(--band-ink-2); border-color: var(--band-ink-2); }
.lp-footer { padding-block: 40px; border-top: 1px solid var(--line); }
.lp-footer .wrap { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(2, minmax(0, 1fr)); gap: 28px; }
.lp-footer h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin-bottom: 10px; font-family: var(--font-mono); }
.lp-footer ul { list-style: none; display: grid; gap: 6px; }
.lp-footer button.fl { background: none; border: none; padding: 0; color: var(--ink-2); font-size: 14px; text-align: left; }
.lp-footer button.fl:hover { color: var(--ink); text-decoration: underline; }
.lp-footer .legal { grid-column: 1 / -1; color: var(--ink-3); font-size: 12.5px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.copyline { display: inline-flex; align-items: center; gap: 6px; }
.copyline code { font-family: var(--font-mono); font-size: 13px; user-select: all; }

.legal-text { display: grid; gap: 12px; font-size: 14px; color: var(--ink-2); line-height: 1.65; max-height: 60vh; overflow-y: auto; padding-right: 6px; }
.legal-text h3 { font-size: 14.5px; color: var(--ink); margin-top: 6px; }
.legal-text ul { padding-left: 18px; display: grid; gap: 4px; }

/* ---------- autenticação ---------- */
.auth { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.9fr); }
.auth-main { display: flex; flex-direction: column; padding: 24px; }
.auth-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.auth-center { flex: 1; display: grid; place-items: center; padding-block: 32px; }
.auth-card { width: 100%; max-width: 440px; display: grid; gap: 22px; }
.auth-card h1 { font-family: var(--font-display); font-stretch: 112%; font-weight: 800; font-size: 32px; letter-spacing: -.02em; }
.auth-card .sub { color: var(--ink-2); font-size: 15px; margin-top: 6px; }

.form-error { padding: 10px 12px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); font-weight: 600; font-size: 13.5px; }

/* ================= PAINEL ================= */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; }

}

.usage { display: grid; gap: 6px; font-size: 12.5px; color: var(--ink-2); }

.meter-track { height: 6px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }

.userbtn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border-radius: 10px; border: 1px solid transparent; background: none; text-align: left; min-width: 0; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; display: flex; align-items: center; gap: 12px;
  height: 64px; padding: 0 28px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line);
}
.topbar .burger { display: none; }

.topbar .crumb { color: var(--ink-3); font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; min-width: 0; }

.top-search { position: relative; flex: 0 1 400px; min-width: 0; }
.top-logo { display: none; }
.top-logo svg { width: 28px; height: 28px; display: block; }

.search-results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 60; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-pop); padding: 6px; max-height: 70vh; overflow-y: auto; }

.search-results button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: none; background: none; border-radius: 8px; text-align: left; color: var(--ink); font-size: 13.5px; }
.search-results button:hover, .search-results button.active { background: var(--surface-3); }
.search-results .sr-empty { padding: 14px 10px; color: var(--ink-3); font-size: 13px; }
.bell { position: relative; }
.bell .bell-dot { position: absolute; top: 7px; right: 7px; min-width: 16px; height: 16px; border-radius: 999px; padding: 0 4px; background: var(--bad-fill); color: var(--on-fill); font-size: 10.5px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--bg); line-height: 1; }
.banners { display: grid; }
.banner { display: flex; align-items: center; gap: 12px; padding: 10px 28px; font-size: 13.5px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.banner .i { flex: none; }

.banner.info { background: var(--accent-soft); color: var(--ink); }

.banner.warn { background: var(--warn-soft); color: var(--ink); }

.banner.bad { background: var(--bad-soft); color: var(--ink); }
.banner.bad > .i { color: var(--bad); }
.content { width: 100%; max-width: 1320px; margin: 0 auto; padding-block: 26px 64px; padding-inline: 28px; display: grid; gap: 20px; align-content: start; }

.scrim { position: fixed; inset: 0; background: var(--backdrop); z-index: 55; animation: fade-in .15s; }

/* ---------- dashboard ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kpi { padding: 16px 18px 18px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.kpi-label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.kpi-ico { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; flex: none; }
.kpi-ico .i { width: 15px; height: 15px; }
.kpi-value { font-size: 27px; font-weight: 650; letter-spacing: -.015em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-sub { font-size: 12.5px; color: var(--ink-3); display: grid; gap: 2px; justify-items: start; }
.kpi-sub .delta-line { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.delta { display: inline-flex; align-items: center; gap: 3px; font-weight: 650; }
.delta .i { width: 13px; height: 13px; stroke-width: 2.2; }
.delta.good { color: var(--ok); }
.delta.bad { color: var(--bad); }
.delta.flat { color: var(--ink-3); }
.ico-ok { background: var(--ok-soft); color: var(--ok); }
.ico-warn { background: var(--warn-soft); color: var(--warn); }
.ico-bad { background: var(--bad-soft); color: var(--bad); }
.ico-accent { background: var(--accent-soft); color: var(--accent-text); }
.dash-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-items: start; }
.span-7 { grid-column: span 7; } .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; } .span-12 { grid-column: 1 / -1; } .span-8 { grid-column: span 8; } .span-4 { grid-column: span 4; }
.chart-toggle { font-size: 12.5px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .gl { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.chart .base { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.chart .tick { fill: var(--ink-3); font-size: 11.5px; font-family: var(--font-ui); font-variant-numeric: tabular-nums; }
.chart .xl { fill: var(--ink-3); font-size: 12px; font-family: var(--font-ui); }
.chart .xl.cur { fill: var(--ink); font-weight: 650; }
.chart .dl { fill: var(--ink); font-size: 12px; font-weight: 650; font-family: var(--font-ui); font-variant-numeric: tabular-nums; }
.chart .bar { fill: var(--chart-bar); transition: opacity .12s; }
.chart .bar.dim { opacity: .45; }
.chart .hit { fill: transparent; outline: none; }
.chart .hit:focus-visible { stroke: var(--accent-text); stroke-width: 2; }
.aging { display: grid; gap: 12px; }
.aging-row { display: grid; grid-template-columns: 112px minmax(0, 1fr); align-items: center; gap: 10px; font-size: 13px; }
.aging-row .al { color: var(--ink-2); font-weight: 600; white-space: nowrap; line-height: 1.25; }
.aging-row .al small { display: block; font-weight: 500; color: var(--ink-3); font-size: 11.5px; }
.aging-track { display: flex; align-items: center; gap: 8px; min-width: 0; position: relative; }
.aging-bar { height: 18px; border-radius: 0 4px 4px 0; min-width: 2px; width: calc(var(--p) * (100% - 128px)); }
.aging-val { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12.5px; }
.aging-val small { color: var(--ink-3); font-weight: 500; }
.age-1 { background: var(--age-1); } .age-2 { background: var(--age-2); } .age-3 { background: var(--age-3); } .age-4 { background: var(--age-4); } .age-5 { background: var(--age-5); }
.meter { display: flex; gap: 2px; height: 14px; border-radius: 999px; overflow: hidden; background: var(--surface-3); }
.meter > span { height: 100%; min-width: 3px; }
.m-pago { background: var(--ok-mark); } .m-pendente { background: var(--warn-mark); } .m-atrasado { background: var(--bad-mark); }
.legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.legend.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.legend-item.total { border-left: 1px solid var(--line); padding-left: 14px; }
.legend-item { display: grid; gap: 2px; min-width: 0; }
.legend-item .lg-l { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.legend-item .lg-l .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend-item .lg-l .i { width: 14px; height: 14px; }
.legend-item strong { font-size: 15px; font-variant-numeric: tabular-nums; }
.legend-item small { color: var(--ink-3); font-size: 12px; }
.list { display: grid; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 11px 18px; border-top: 1px solid var(--line); min-width: 0; }
.list-item:first-child { border-top: 0; }
.list-item .li-main { flex: 1; min-width: 0; display: grid; }
.list-item .li-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-item .li-sub { font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-item .li-val { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.date-chip { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); flex: none; line-height: 1.05; }
.date-chip b { font-size: 16px; }
.date-chip span { font-size: 10.5px; text-transform: uppercase; color: var(--ink-3); font-weight: 700; letter-spacing: .04em; }
.date-chip.today { background: var(--warn-soft); border-color: transparent; }
.activity { display: grid; }
.activity.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 0; }
.activity.cols-2 .act:nth-child(2) { border-top: 0; }
.activity.cols-2 .act:nth-child(even) { border-left: 1px solid var(--line); }
.act { display: flex; gap: 12px; padding: 10px 18px; border-top: 1px solid var(--line); font-size: 13px; align-items: flex-start; }
.act:first-child { border-top: 0; }
.act .act-ico { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--surface-3); color: var(--ink-2); }
.act .act-ico .i { width: 15px; height: 15px; }
.act .act-meta { font-size: 12px; color: var(--ink-3); }
.checklist { display: grid; gap: 4px; }
.check-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: none; border: none; width: 100%; text-align: left; color: var(--ink); font-size: 14px; }
.check-item:hover { background: var(--surface-2); }
.check-item .ck { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; flex: none; }
.check-item.done .ck { background: var(--ok-mark); border-color: var(--ok-mark); color: var(--on-fill); }
.check-item.done .ck .i { width: 13px; height: 13px; stroke-width: 3; }
.check-item.done .ck-t { color: var(--ink-3); text-decoration: line-through; }
.check-item .i-go { margin-left: auto; color: var(--ink-3); }
.progress-dots { display: flex; gap: 4px; }
.progress-dots span { width: 22px; height: 5px; border-radius: 3px; background: var(--surface-3); }
.progress-dots span.on { background: var(--ok-mark); }

/* ---------- cliente (detalhe) ---------- */
.profile { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: start; padding: 20px; }
.profile-main { display: flex; gap: 16px; align-items: flex-start; min-width: 0; }
.profile h2 { font-size: 22px; font-weight: 700; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px 22px; margin-top: 14px; }
.kv > div { display: grid; gap: 2px; min-width: 0; }
.kv dt, .kv .k { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.kv dd, .kv .v { margin: 0; font-weight: 550; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; }
.kv .dd-sub { flex-basis: 100%; font-size: 12.5px; font-weight: 500; color: var(--ink-3); }
.mini-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.mini-kpis > div { padding: 14px 20px; display: grid; gap: 2px; min-width: 0; }
.mini-kpis > div + div { border-left: 1px solid var(--line); }
.mini-kpis span { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.mini-kpis strong { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timeline { display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; padding-bottom: 12px; position: relative; font-size: 13px; }
.tl::before { content: ""; position: absolute; left: 9px; top: 18px; bottom: 0; width: 2px; background: var(--line); }
.tl:last-child::before { display: none; }
.tl .tl-dot { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--ink-2); }
.tl .tl-dot .i { width: 12px; height: 12px; stroke-width: 2.4; }

/* ---------- upsell / bloqueio ---------- */
.upsell { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.9fr); gap: 28px; align-items: center; padding: 32px; }
.upsell h2 { font-family: var(--font-display); font-stretch: 110%; font-size: 28px; font-weight: 780; letter-spacing: -.015em; line-height: 1.1; }
.upsell p { color: var(--ink-2); font-size: 15px; }
.upsell ul { list-style: none; display: grid; gap: 8px; }
.upsell li { display: flex; gap: 8px; align-items: flex-start; color: var(--ink-2); }
.upsell li .i { color: var(--ok); margin-top: 2px; }
.upsell-art { border: 1px solid var(--line); border-radius: 14px; padding: 18px; background: var(--surface-2); display: grid; gap: 10px; filter: saturate(.9); position: relative; overflow: hidden; }
.upsell-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, var(--surface-2)); }
.ghost-row { height: 12px; border-radius: 6px; background: var(--surface-3); }

/* ---------- configurações ---------- */
.settings { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: start; }
.subnav { display: grid; gap: 2px; position: sticky; top: calc(80px + env(safe-area-inset-top, 0px)); }
.subnav button { display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 8px 12px; line-height: 1.3; border-radius: 9px; border: none; background: none; color: var(--ink-2); font-weight: 600; text-align: left; font-size: 14px; }
.subnav button:hover { background: var(--surface-3); color: var(--ink); }
.subnav button[aria-current="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); border: 1px solid var(--line); }
.set-section { display: grid; gap: 18px; }
.set-card { padding: 22px; display: grid; gap: 18px; }
.set-card h3 { font-size: 16px; font-weight: 700; }
.set-card .set-desc { color: var(--ink-3); font-size: 13.5px; margin-top: 3px; max-width: 70ch; }
.set-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.logo-edit { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.logo-prev { width: 64px; height: 64px; border-radius: 12px; border: 1px dashed var(--line-strong); display: grid; place-items: center; color: var(--ink-3); background: var(--surface-2); overflow: hidden; }
.logo-prev img { width: 100%; height: 100%; object-fit: cover; }
.var-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.var-chips button { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink-2); border-radius: 6px; padding: 3px 7px; }
.var-chips button:hover { border-color: var(--accent-text); color: var(--accent-text); }
.preview-msg { white-space: pre-wrap; font-size: 13.5px; background: var(--ok-soft); color: var(--ink); border-radius: 12px 12px 12px 4px; padding: 12px 14px; line-height: 1.55; overflow-wrap: anywhere; }
.danger-zone { border-color: var(--bad); }
.danger-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.danger-row:first-of-type { border-top: 0; padding-top: 0; }
.json-box { width: 100%; min-height: 200px; font-family: var(--font-mono); font-size: 12px; }
.file-drop { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px; border: 1.5px dashed var(--line-strong); border-radius: 12px; background: var(--surface-2); text-align: center; color: var(--ink-2); cursor: pointer; position: relative; }
.file-drop:hover, .file-drop.drag { border-color: var(--accent-text); background: var(--accent-soft); }
.file-drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* ---------- assinatura ---------- */
.plan-current { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; padding: 22px; align-items: start; }
.plan-current .pc-name { font-family: var(--font-display); font-stretch: 112%; font-weight: 800; font-size: 26px; letter-spacing: -.015em; }
.bill-plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.bill-plan { padding: 18px; display: grid; gap: 12px; align-content: start; position: relative; }
.bill-plan.current { border: 2px solid var(--accent-text); }
.bill-plan .bp-price { font-size: 24px; font-weight: 750; letter-spacing: -.02em; }
.bill-plan .bp-price small { font-size: 13px; color: var(--ink-3); font-weight: 600; }
.bill-plan ul { list-style: none; display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); }
.bill-plan li { display: flex; gap: 7px; align-items: flex-start; }
.bill-plan li .i { width: 15px; height: 15px; color: var(--ok); margin-top: 2px; }

/* ---------- automações ---------- */
.regua { display: grid; gap: 0; }
.regua-step { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.regua-step:first-child { border-top: 0; }
.regua-day { font-family: var(--font-mono); font-weight: 600; font-size: 13px; min-width: 64px; text-align: center; padding: 6px 8px; border-radius: 8px; background: var(--surface-3); }
.regua-day.before { background: var(--warn-soft); color: var(--warn); }
.regua-day.after { background: var(--bad-soft); color: var(--bad); }
.regua-day.on-day { background: var(--accent-soft); color: var(--accent-text); }
.regua-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.regua-controls .input { width: 72px; }
.regua-controls .select { min-width: 150px; }
.soon-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.soon { padding: 18px; display: grid; gap: 10px; align-content: start; }
.soon h3 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.soon p { color: var(--ink-2); font-size: 13.5px; }

/* ---------- automações (central) ---------- */
.auto-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.auto-summary > div { padding: 14px 18px; display: grid; gap: 2px; min-width: 0; align-content: start; }
.auto-summary > div + div { border-left: 1px solid var(--line); }
.auto-summary span { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.auto-summary strong { font-size: 21px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.auto-summary strong small { font-size: 13px; color: var(--ink-3); font-weight: 600; }
.auto-summary em { font-style: normal; font-size: 12px; color: var(--ink-3); }
.auto-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.auto-card { padding: 16px 18px; display: grid; gap: 8px; align-content: start; grid-template-rows: auto auto 1fr auto; }
.auto-card.is-off .auto-ico { filter: grayscale(1); opacity: .6; }
.auto-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.auto-head h3 { font-size: 15px; font-weight: 700; flex: 1; min-width: 0; }
.auto-ico { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.auto-ico .i { width: 17px; height: 17px; }
.auto-ctrl { display: inline-flex; align-items: center; }
.auto-text { color: var(--ink-2); font-size: 13.5px; }
.auto-meta { font-size: 12.5px; color: var(--ink-3); align-self: end; overflow-wrap: anywhere; }
.auto-foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-top: 4px; }
.upsell-strip { display: flex; align-items: center; gap: 14px; padding: 16px 18px; flex-wrap: wrap; }
.upsell-strip > .i { color: var(--accent-text); }
.soon-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.mini-list { display: grid; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.mini-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--surface); border: 0; border-top: 1px solid var(--line); text-align: left; color: var(--ink); font-size: 13.5px; width: 100%; }
.mini-row:first-child { border-top: 0; }
.mini-row:hover { background: var(--surface-2); }
.tag-btn { border: 0; cursor: pointer; }
.desc-ico { display: inline-flex; vertical-align: -2px; margin-right: 5px; color: var(--accent-text); }
.desc-ico .i { width: 14px; height: 14px; }
.cell-sub.upd { color: var(--bad); font-weight: 600; }
.sit-cell { display: grid; gap: 4px; justify-items: start; }
.table.responsive .sit-cell { justify-items: end; }
.punct { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-3); font-weight: 600; white-space: nowrap; }
.punct i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.punct.p-good i { background: var(--ok-mark); }
.punct.p-mid i { background: var(--warn-mark); }
.punct.p-bad i { background: var(--bad-mark); }
.punct.p-none { font-weight: 500; }
.mini-kpis small { font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-kpis .punct { margin-top: 2px; }
.mini-kpis.boxed { border: 1px solid var(--line); border-radius: 10px; }

/* ---------- Pix ---------- */
.pix-panel { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); align-items: start; }
.pix-panel.empty { grid-template-columns: auto minmax(0, 1fr); align-items: center; color: var(--ink-2); }
.pix-panel.empty > .i { color: var(--accent-text); }
.pix-panel.empty .btn { margin-top: 8px; }
.qr-box { width: 192px; height: 192px; border-radius: 10px; background: #fff; display: grid; place-items: center; padding: 8px; border: 1px solid var(--line); }
.pix-panel.compact .qr-box { width: 166px; height: 166px; }
.qr-box svg { width: 100%; height: 100%; display: block; }
.qr-wait { color: #9aa0b0; animation: pulse 1.2s ease-in-out infinite; }
.qr-fail { display: grid; gap: 6px; justify-items: center; text-align: center; font-size: 12px; color: #4b5165; padding: 8px; }
.pix-info { display: grid; gap: 8px; min-width: 0; }
.pix-code { width: 100%; font-size: 11.5px; line-height: 1.45; border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; background: var(--surface); color: var(--ink-2); resize: none; word-break: break-all; }
.receipt-line { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; background: var(--ok-soft); flex-wrap: wrap; }
.receipt-line > .i { color: var(--ok); }
@keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

/* ---------- acordos ---------- */
.deal-list { display: grid; gap: 2px; max-height: 260px; overflow-y: auto; }
.deal-item { padding: 8px 4px; border-bottom: 1px solid var(--line); align-items: center; }
.deal-item:last-child { border-bottom: 0; }
.deal-val { font-weight: 650; text-align: right; display: grid; white-space: nowrap; }
.deal-val small { font-size: 11.5px; color: var(--bad); font-weight: 600; }
.deal-preview { display: grid; gap: 10px; }
.deal-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.deal-sum > div { padding: 10px 14px; display: grid; gap: 2px; }
.deal-sum > div + div { border-left: 1px solid var(--line); }
.deal-sum span { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.deal-sum strong { font-size: 16px; font-variant-numeric: tabular-nums; }
.deal-sum .total { background: var(--accent-soft); }
.deal-sum .total strong { color: var(--accent-text); }

/* ---------- fechamento ---------- */
.big-tabs { border-bottom: 1px solid var(--line); margin-top: -4px; }
.big-tabs button { font-size: 14px; padding: 11px 14px; }
.big-tabs .i-lock { color: var(--ink-3); }
.toolbar .spacer { flex: 1 1 auto; }
.period-label { font-size: 14px; font-weight: 650; }
.insights { list-style: none; display: grid; gap: 8px; }
.insights li { display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; border-radius: 10px; background: var(--surface-2); font-size: 13.5px; }
.insights li > .i { margin-top: 2px; flex: none; }
.insights .ins-ok > .i { color: var(--ok); }
.insights .ins-warn > .i { color: var(--warn); }
.insights .ins-bad > .i { color: var(--bad); }
.insights .ins-accent > .i { color: var(--accent-text); }
.insights .btn { margin: -3px -4px -3px auto; flex: none; }
.ai-badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); font-size: 11.5px; font-weight: 700; letter-spacing: .02em; flex: none; }
.ai-badge .i { width: 13px; height: 13px; }
.ai-card { border: 1px dashed var(--line-strong); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.ai-card.has-ai { border-style: solid; border-color: color-mix(in srgb, var(--accent-text) 35%, var(--line)); background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
.ai-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ai-head strong { font-size: 14.5px; flex: 1; min-width: 160px; }
.ai-text { font-size: 14px; color: var(--ink); line-height: 1.6; }
.ai-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.ai-list strong { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.ai-list.good strong { color: var(--ok); }
.ai-list.bad strong { color: var(--bad); }
.ai-list.acc strong { color: var(--accent-text); }
.ai-list ul, .ai-ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13.5px; color: var(--ink-2); }
.ai-empty { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ai-skeleton { display: grid; gap: 8px; }
.ai-skeleton span { height: 10px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-3), var(--accent-soft), var(--surface-3)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
.ai-skeleton span:nth-child(2) { width: 86%; }
.ai-skeleton span:nth-child(3) { width: 64%; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.hbars { display: grid; gap: 10px; }
.hbar { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; align-items: center; gap: 10px; font-size: 13px; }
.hb-l { color: var(--ink-2); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-track { height: 12px; border-radius: 0 4px 4px 0; background: var(--surface-3); overflow: hidden; }
.hb-fill { display: block; height: 100%; background: var(--chart-bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.hb-v { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.hb-v small { color: var(--ink-3); font-weight: 500; margin-left: 6px; font-size: 12px; }
.daybars { display: flex; align-items: flex-end; gap: 3px; height: 96px; border-bottom: 1px solid var(--axis); }
.daybars .db { flex: 1 1 0; height: 100%; display: flex; align-items: flex-end; min-width: 3px; outline: none; }
.daybars .db i { display: block; width: 100%; background: var(--chart-bar); border-radius: 3px 3px 0 0; }
.daybars .db:hover i, .daybars .db:focus-visible i { opacity: .75; }
.kv-list { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 8px; }
.kv-list > div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; font-size: 13.5px; }
.kv-list > div + div { border-top: 1px solid var(--line); }
.kv-list span { color: var(--ink-2); }
.kv-list strong { font-variant-numeric: tabular-nums; }
.how-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.how-grid > div { display: grid; gap: 6px; padding: 14px; border-radius: 12px; background: var(--surface-2); align-content: start; font-size: 13.5px; color: var(--ink-2); }
.how-grid .i { color: var(--accent-text); }
.how-grid strong { color: var(--ink); }
.recon-table .tx-desc { font-size: 12px; max-width: 300px; overflow-wrap: anywhere; color: var(--ink); }
.recon-table tr.is-unmatched td { background: color-mix(in srgb, var(--warn-soft) 40%, transparent); }
.recon-pick .select { min-width: 260px; max-width: 420px; height: 36px; font-size: 13px; }
.conf { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.conf .i { width: 12px; height: 12px; }
.c-alta { background: var(--ok-soft); color: var(--ok); }
.c-media { background: var(--warn-soft); color: var(--warn); }
.c-baixa, .c-none, .c-manual { background: var(--muted-soft); color: var(--ink-2); }
.c-ai { background: var(--accent-soft); color: var(--accent-text); }
.recon-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.map-box { display: grid; gap: 12px; }
.map-table .select { min-width: 130px; height: 34px; font-size: 12.5px; }
.map-table th { background: var(--surface); padding: 8px 6px; text-transform: none; letter-spacing: 0; }
.map-table td { font-size: 12.5px; color: var(--ink-2); max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.map-table tr.is-head td { font-weight: 700; color: var(--ink); background: var(--surface-2); }
.rates-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px 12px; }
.input-affix.suffix .input { padding-left: 12px; padding-right: 44px; }
.input-affix.suffix .affix { left: auto; right: 12px; font-size: 12.5px; }
.card-files { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.card-file { display: grid; gap: 10px; align-content: start; padding: 14px; border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.file-drop.small { flex-direction: row; justify-content: flex-start; text-align: left; padding: 12px 14px; gap: 12px; }
.sub-h { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.cross-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.cross-grid > div { display: grid; gap: 8px; align-content: start; padding: 14px; border-radius: 12px; background: var(--surface-2); }
.cross-list { list-style: none; display: grid; gap: 4px; font-size: 13px; }
.cross-list li { display: flex; justify-content: space-between; gap: 10px; }
.cross-list strong { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- assistente (gaveta) ---------- */
.modal-backdrop.is-drawer { justify-content: flex-end; padding: 0; align-items: stretch; }
.modal.drawer { max-width: 460px; height: 100vh; height: 100dvh; border-radius: 0; border-top: 0; border-bottom: 0; border-right: 0; animation: drawer-in .2s ease-out; }
.modal.drawer .modal-body { flex: 1; overflow-y: auto; align-content: start; }
@keyframes drawer-in { from { transform: translateX(24px); opacity: .5; } to { transform: none; opacity: 1; } }
.chat { display: grid; gap: 12px; align-content: start; }
.chat-hello { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 12px; background: var(--surface-2); }
.bubble-row { display: flex; }
.bubble-row.user { justify-content: flex-end; }
.chat-bubble { max-width: 88%; padding: 10px 13px; border-radius: 14px; font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere; }
.chat-bubble.user { background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; white-space: pre-wrap; }
.chat-bubble.assistant { background: var(--surface-2); border: 1px solid var(--line); border-bottom-left-radius: 4px; color: var(--ink); }
.chat-bubble.assistant p + p, .chat-bubble.assistant p + ul, .chat-bubble.assistant ul + p { margin-top: 6px; }
.chat-bubble.assistant ul { padding-left: 18px; display: grid; gap: 3px; }
.chat-bubble.err { background: var(--bad-soft); border-color: transparent; }
.thinking { color: var(--ink-3); }
.thinking span { animation: pulse 1s infinite; }
.thinking span:nth-child(2) { animation-delay: .2s; }
.thinking span:nth-child(3) { animation-delay: .4s; }
.chat-suggest { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 6px 11px; font-size: 12.5px; font-weight: 600; text-align: left; }
.chip-btn:hover { border-color: var(--accent-text); color: var(--accent-text); }
.chat-form { width: 100%; display: grid; gap: 8px; }
.chat-form .textarea { min-height: 64px; }
body.drawer-open .toasts { right: 480px; }
.ai-top { gap: 6px; color: var(--accent-text); font-weight: 650; }
.ai-top .i { color: var(--accent-text); }

/* ---------- site: novos blocos ---------- */
.fv-rec { display: grid; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.fv-rec-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-size: 13px; }
.fv-rec-row + .fv-rec-row { border-top: 1px solid var(--line); }
.fv-rec-row strong { display: block; font-size: 13.5px; }
.fv-rec-row small { color: var(--ink-3); font-size: 12px; }
.fv-rec-ico { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); flex: none; }
.fv-rec-v { text-align: right; display: grid; }
.fv-upd { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 10px; background: var(--bad-soft); font-size: 13px; }
.fv-upd s { color: var(--ink-3); }
.fv-upd strong { color: var(--bad); }
.fv-recon { display: grid; gap: 6px; }
.fv-recon-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 10px; align-items: center; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); font-size: 12.5px; }
.fv-recon-row .mono { font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fv-recon-m { grid-column: 1 / 3; display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-weight: 600; }
.fv-recon-row .conf { grid-row: 1 / 3; grid-column: 3; }
.fv-table th, .fv-table td { padding: 9px 10px; }
.fv-alert { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--bad-soft); font-size: 13px; }
.fv-alert .i { color: var(--bad); margin-top: 2px; }
.fv-ai { display: grid; gap: 8px; padding: 14px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--accent-text) 35%, var(--line)); background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
.fv-chat { display: flex; justify-content: flex-end; }
.niches { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-bottom: 22px; }
.niche { padding: 24px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); display: grid; gap: 10px; align-content: start; }
.niche-ico { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); }
.niche h3 { font-family: var(--font-display); font-stretch: 108%; font-size: 22px; font-weight: 750; letter-spacing: -.01em; }
.niche p { color: var(--ink-2); font-size: 15px; }
.niche ul { list-style: none; display: grid; gap: 8px; margin-top: 4px; }
.niche li { display: flex; gap: 9px; align-items: flex-start; color: var(--ink-2); font-size: 14.5px; }
.niche li .i { color: var(--ok); margin-top: 2px; }
.cycle-toggle { display: inline-flex; padding: 4px; border-radius: 12px; background: var(--surface-3); gap: 4px; margin-bottom: 26px; flex-wrap: wrap; }
.cycle-toggle button { border: 0; background: transparent; height: 38px; padding: 0 16px; border-radius: 9px; font-weight: 650; color: var(--ink-2); display: inline-flex; align-items: center; gap: 8px; }
.cycle-toggle button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.save-tag { font-size: 11.5px; font-weight: 700; color: var(--ok); background: var(--ok-soft); padding: 2px 7px; border-radius: 999px; }
.price-block { display: grid; gap: 4px; }
.price-sub { font-size: 13px; color: var(--ink-3); min-height: 20px; }
.plan-limits { display: grid; gap: 6px; }
.seg-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.seg-card { display: grid; gap: 6px; padding: 12px; border: 1px solid var(--line-strong); border-radius: 10px; cursor: pointer; position: relative; align-content: start; }
.seg-card input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.seg-card .i { color: var(--accent-text); }
.seg-card strong { display: block; font-size: 13px; line-height: 1.25; }
.seg-card small { display: block; font-size: 11.5px; color: var(--ink-3); line-height: 1.35; margin-top: 2px; }
.seg-card:has(input:checked) { border-color: var(--accent-text); box-shadow: 0 0 0 3px var(--accent-soft); }
.seg-card:has(input:focus-visible) { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.cycle-cards .rc-title .tag { margin-left: 4px; }

/* ---------- responsivo ---------- */
@media (max-width: 1180px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .span-7, .span-5, .span-8, .span-4 { grid-column: 1 / -1; }
