/* ============================================================
   Relatórios: cobranças, recebimentos, inadimplência e resumo
   por cliente, com exportação em PDF, Excel e CSV.
   ============================================================ */
const REPORTS = {
  cobrancas: { title: 'Cobranças', desc: 'Todas as cobranças com vencimento no período escolhido.' },
  recebimentos: { title: 'Recebimentos', desc: 'Pagamentos registrados no período, pela data do pagamento.' },
  inadimplencia: { title: 'Inadimplência', desc: 'Clientes com cobranças em atraso hoje, do maior valor para o menor.' },
  clientes: { title: 'Resumo por cliente', desc: 'Quanto cada cliente teve de cobranças, pagou e deve no período.' },
};
const REPORT_PERIODS = [['este-mes', 'Este mês'], ['mes-passado', 'Mês passado'], ['ultimos-30', 'Últimos 30 dias'], ['ultimos-90', 'Últimos 90 dias'], ['este-ano', 'Este ano'], ['tudo', 'Todo o período'], ['personalizado', 'Personalizado']];
function reportRange(p, from, to) {
  const t = todayISO();
  switch (p) {
    case 'este-mes': return [monthStart(t), monthEnd(t)];
    case 'mes-passado': { const s = addMonths(monthStart(t), -1); return [s, monthEnd(s)]; }
    case 'ultimos-30': return [addDays(t, -29), t];
    case 'ultimos-90': return [addDays(t, -89), t];
    case 'este-ano': return [t.slice(0, 4) + '-01-01', t.slice(0, 4) + '-12-31'];
    case 'personalizado': return [isISODate(from) ? from : '0000-01-01', isISODate(to) ? to : '9999-12-31'];
    default: return ['0000-01-01', '9999-12-31'];
  }
}
function rangeLabel(r) {
  if (r[0] === '0000-01-01' && r[1] === '9999-12-31') return 'Todo o período';
  if (r[0] === '0000-01-01') return `Até ${fmtDate(r[1])}`;
  if (r[1] === '9999-12-31') return `A partir de ${fmtDate(r[0])}`;
  return `${fmtDate(r[0])} a ${fmtDate(r[1])}`;
}
function buildReport(c, opts = ui.reports) {
  const tab = opts.tab;
  const r = reportRange(opts.period, opts.from, opts.to);
  const clMap = new Map(c.clients.map((x) => [x.id, x]));
  const name = (id) => (clMap.get(id) || {}).name || 'Cliente removido';
  const inClient = (ch) => !opts.client || ch.clientId === opts.client;
  const t = todayISO();
  const rep = { key: tab, title: REPORTS[tab].title, periodLabel: tab === 'inadimplencia' ? `Situação em ${fmtDate(t)}` : rangeLabel(r), range: r, summary: [], columns: [], rows: [], totals: null, note: '' };
  if (opts.client) rep.periodLabel += ` · ${name(opts.client)}`;

  if (tab === 'cobrancas') {
    const list = c.charges.filter((ch) => ch.due >= r[0] && ch.due <= r[1] && inClient(ch) && (opts.status === 'todos' || ch.status === opts.status)).sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : a.num - b.num));
    rep.columns = [
      { key: 'num', label: 'Nº', type: 'text', w: 0.7 }, { key: 'due', label: 'Vencimento', type: 'date', w: 1 }, { key: 'client', label: 'Cliente', type: 'text', w: 2.1 },
      { key: 'desc', label: 'Descrição', type: 'text', w: 2.3 }, { key: 'amount', label: 'Valor', type: 'money', w: 1.1, align: 'right' }, { key: 'status', label: 'Status', type: 'text', w: 0.95 },
      { key: 'paidAt', label: 'Pago em', type: 'date', w: 0.95 }, { key: 'paidAmount', label: 'Valor pago', type: 'money', w: 1.1, align: 'right' },
    ];
    rep.rows = list.map((ch) => ({ num: '#' + numStr(ch.num), due: ch.due, client: name(ch.clientId), desc: ch.desc, amount: ch.amount, status: STATUS[ch.status].label, paidAt: ch.paidAt || '', paidAmount: ch.status === 'pago' ? ch.paidAmount : null }));
    const valid = list.filter((x) => x.status !== 'cancelado');
    rep.summary = [
      { label: 'Total em cobranças', value: fmtMoney(sumBy(valid, (x) => x.amount)), raw: sumBy(valid, (x) => x.amount), type: 'money' },
      { label: 'Recebido', value: fmtMoney(sumBy(list.filter((x) => x.status === 'pago'), (x) => x.paidAmount)), raw: sumBy(list.filter((x) => x.status === 'pago'), (x) => x.paidAmount), type: 'money' },
      { label: 'Pendente', value: fmtMoney(sumBy(list.filter((x) => x.status === 'pendente'), (x) => x.amount)), raw: sumBy(list.filter((x) => x.status === 'pendente'), (x) => x.amount), type: 'money' },
      { label: 'Em atraso', value: fmtMoney(sumBy(list.filter((x) => x.status === 'atrasado'), (x) => x.amount)), raw: sumBy(list.filter((x) => x.status === 'atrasado'), (x) => x.amount), type: 'money' },
    ];
    rep.totals = { num: 'Total', amount: sumBy(valid, (x) => x.amount), paidAmount: sumBy(list.filter((x) => x.status === 'pago'), (x) => x.paidAmount) };
    if (list.some((x) => x.status === 'cancelado')) rep.note = 'Cobranças canceladas aparecem na lista, mas não entram no total.';
  } else if (tab === 'recebimentos') {
    const list = c.charges.filter((ch) => ch.status === 'pago' && ch.paidAt && ch.paidAt >= r[0] && ch.paidAt <= r[1] && inClient(ch)).sort((a, b) => (a.paidAt < b.paidAt ? -1 : a.paidAt > b.paidAt ? 1 : a.num - b.num));
    rep.columns = [
      { key: 'paidAt', label: 'Pago em', type: 'date', w: 0.95 }, { key: 'num', label: 'Nº', type: 'text', w: 0.7 }, { key: 'client', label: 'Cliente', type: 'text', w: 2.1 },
      { key: 'desc', label: 'Descrição', type: 'text', w: 2.2 }, { key: 'due', label: 'Vencimento', type: 'date', w: 0.95 }, { key: 'method', label: 'Forma', type: 'text', w: 0.95 },
      { key: 'recovered', label: 'Após venc.', type: 'text', w: 0.8 }, { key: 'paidAmount', label: 'Valor pago', type: 'money', w: 1.1, align: 'right' },
    ];
    rep.rows = list.map((ch) => ({ paidAt: ch.paidAt, num: '#' + numStr(ch.num), client: name(ch.clientId), desc: ch.desc, due: ch.due, method: METHODS[ch.method] || '—', recovered: isRecovered(ch) ? 'Sim' : 'Não', paidAmount: ch.paidAmount }));
    const total = sumBy(list, (x) => x.paidAmount);
    const rec = sumBy(list.filter(isRecovered), (x) => x.paidAmount);
    rep.summary = [
      { label: 'Total recebido', value: fmtMoney(total), raw: total, type: 'money' },
      { label: 'Pagamentos', value: fmtInt(list.length), raw: list.length, type: 'int' },
      { label: 'Recuperado (pago após o vencimento)', value: fmtMoney(rec), raw: rec, type: 'money' },
      { label: 'Valor médio', value: fmtMoney(list.length ? Math.round(total / list.length) : 0), raw: list.length ? Math.round(total / list.length) : 0, type: 'money' },
    ];
    rep.totals = { paidAt: 'Total', paidAmount: total };
  } else if (tab === 'inadimplencia') {
    const groups = overdueByClient(c).filter((g) => !opts.client || g.clientId === opts.client);
    rep.columns = [
      { key: 'client', label: 'Cliente', type: 'text', w: 2.3 }, { key: 'doc', label: 'CPF/CNPJ', type: 'text', w: 1.35, nowrap: true }, { key: 'phone', label: 'WhatsApp', type: 'text', w: 1.2, nowrap: true },
      { key: 'count', label: 'Cobranças', type: 'int', w: 0.8, align: 'right' }, { key: 'oldest', label: 'Venc. mais antigo', type: 'date', w: 1.1 }, { key: 'days', label: 'Dias de atraso', type: 'int', w: 0.9, align: 'right' },
      { key: 'lastContact', label: 'Última cobrança', type: 'date', w: 1.05 }, { key: 'total', label: 'Em atraso', type: 'money', w: 1.1, align: 'right' },
    ];
    rep.rows = groups.map((g) => {
      const cl = clMap.get(g.clientId) || {};
      const lc = g.charges.reduce((a, x) => Math.max(a, x.lastContactAt || 0), cl.lastContactAt || 0);
      return { client: name(g.clientId), doc: cl.doc ? fmtDoc(cl.doc) : '', phone: cl.phone ? fmtPhone(cl.phone) : '', count: g.count, oldest: g.oldest, days: g.days, lastContact: lc ? isoOf(new Date(lc)) : '', total: g.total };
    });
    const total = sumBy(groups, (g) => g.total);
    const n = sumBy(groups, (g) => g.count);
    const avgDays = total ? Math.round(sumBy(groups, (g) => sumBy(g.charges, (x) => diffDays(t, x.due) * x.amount)) / total) : 0;
    rep.summary = [
      { label: 'Total em atraso', value: fmtMoney(total), raw: total, type: 'money' },
      { label: 'Clientes em atraso', value: fmtInt(groups.length), raw: groups.length, type: 'int' },
      { label: 'Cobranças em atraso', value: fmtInt(n), raw: n, type: 'int' },
      { label: 'Atraso médio (ponderado)', value: plural(avgDays, 'dia', 'dias'), raw: avgDays, type: 'int' },
    ];
    rep.totals = { client: 'Total', count: n, total };
    rep.note = 'O período não se aplica: o relatório mostra quem está em atraso hoje.';
  } else {
    const list = c.charges.filter((ch) => ch.due >= r[0] && ch.due <= r[1] && inClient(ch) && ch.status !== 'cancelado');
    const m = new Map();
    for (const ch of list) {
      const x = m.get(ch.clientId) || { client: name(ch.clientId), count: 0, billed: 0, paid: 0, open: 0, overdue: 0 };
      x.count++; x.billed += ch.amount;
      if (ch.status === 'pago') x.paid += ch.paidAmount || 0;
      else if (ch.status === 'pendente') x.open += ch.amount;
      else if (ch.status === 'atrasado') x.overdue += ch.amount;
      m.set(ch.clientId, x);
    }
    rep.rows = Array.from(m.values()).sort((a, b) => b.billed - a.billed || a.client.localeCompare(b.client, 'pt-BR'));
    rep.columns = [
      { key: 'client', label: 'Cliente', type: 'text', w: 2.6 }, { key: 'count', label: 'Cobranças', type: 'int', w: 0.9, align: 'right' }, { key: 'billed', label: 'Total cobrado', type: 'money', w: 1.2, align: 'right' },
      { key: 'paid', label: 'Recebido', type: 'money', w: 1.2, align: 'right' }, { key: 'open', label: 'Pendente', type: 'money', w: 1.2, align: 'right' }, { key: 'overdue', label: 'Em atraso', type: 'money', w: 1.2, align: 'right' },
    ];
    const tot = (k) => sumBy(rep.rows, (x) => x[k]);
    rep.summary = [
      { label: 'Clientes no período', value: fmtInt(rep.rows.length), raw: rep.rows.length, type: 'int' },
      { label: 'Total cobrado', value: fmtMoney(tot('billed')), raw: tot('billed'), type: 'money' },
      { label: 'Recebido', value: fmtMoney(tot('paid')), raw: tot('paid'), type: 'money' },
      { label: 'Em atraso', value: fmtMoney(tot('overdue')), raw: tot('overdue'), type: 'money' },
    ];
    rep.totals = { client: 'Total', count: tot('count'), billed: tot('billed'), paid: tot('paid'), open: tot('open'), overdue: tot('overdue') };
  }
  return rep;
}
function fmtCell(v, type) {
  if (v == null || v === '') return '';
  if (type === 'money') return typeof v === 'number' ? fmtMoney(v) : String(v);
  if (type === 'date') return isISODate(v) ? fmtDate(v) : String(v);
  if (type === 'int') return typeof v === 'number' ? fmtInt(v) : String(v);
  return String(v);
}

F.member = async (f) => {
  const c = co();
  const v = formValues(f);
  const errs = {};
  if (v.name.length < 2) errs.name = 'Digite o nome.';
  if (!validEmail(v.email)) errs.email = 'Digite um e-mail válido.';
  else if (DB.users[v.email.toLowerCase()]) errs.email = 'Este e-mail já tem acesso ao Quitaí.';
  if (!showErrors(f, errs)) return;
  let r;
  if (Cloud.on) {
    const btn = $('[form="f-member"]');
    setBusy(btn, true, 'Criando…');
    const role = ROLES[v.role] && v.role !== 'owner' ? v.role : 'financeiro';
    const res = await callFn('team', { action: 'add', name: v.name.trim(), email: v.email.trim().toLowerCase(), role });
    setBusy(btn, false);
    if (res.error) { showErrors(f, { email: fnError(res.error) }); return; }
    const key = v.email.trim().toLowerCase();
    DB.users[key] = { id: res.user_id, name: v.name.trim(), email: key, companyId: c.id, role, createdAt: Date.now(), lastLoginAt: null, mustChange: true, active: true, invitedBy: realUser().id, theme: 'system' };
    logAct(c, 'team', `Deu acesso a ${v.name.trim()} como ${ROLES[role].label}`);
    r = { temp: res.temp, user: DB.users[key] };
  } else {
    r = await addMember(c, { name: v.name, email: v.email, role: v.role || 'financeiro' });
    if (r.error) { showErrors(f, { email: r.error }); return; }
  }
  save();
  closeModal(true);
  refreshPage(false);
  showCredentials(r.user, r.temp, true);
};
function showCredentials(u, temp, isNew) {
  const c = co();
  const msg = `Olá, ${u.name.split(' ')[0]}! ${isNew ? 'Criei seu acesso' : 'Redefini sua senha de acesso'} ao painel da ${c.name} no Quitaí.\n\nE-mail: ${u.email}\nSenha temporária: ${temp}\n\nNo primeiro acesso, você vai criar sua própria senha.`;
  openModal({
    title: isNew ? 'Acesso criado' : 'Senha redefinida', size: 'sm',
    body: html`<p class="ink2">Envie os dados abaixo para ${u.name.split(' ')[0]}. A senha temporária aparece só agora.</p>

      <p class="hint">${Cloud.on ? `A pessoa entra em ${sitePage()} com este e-mail e esta senha, de qualquer dispositivo.` : 'Na demonstração, o acesso funciona só neste navegador.'} Use “Ver o painel como esta pessoa” para conferir o que ela enxerga.</p>`,
    foot: html`<button type="button" class="btn" data-act="copy" data-text="${msg}" data-ok="Mensagem copiada.">${icon('copy')}Copiar mensagem</button><button type="button" class="btn btn-primary" data-act="modalCancel">Concluir</button>`,
  });
}
A.memberMenu = (el) => {
  const c = co();
  const u = DB.users[el.dataset.email];
  if (!u) return;
  const items = [
    { label: 'Ver o painel como esta pessoa', icon: 'eye', disabled: u.active === false, run: () => impersonate(u) },
    { label: 'Alterar função', icon: 'edit', run: () => changeRoleModal(u) },
    { label: 'Redefinir senha', icon: 'key', run: async () => {
      let t;
      if (Cloud.on) { const res = await callFn('team', { action: 'reset', user_id: u.id }); if (res.error) { toast(fnError(res.error), { type: 'bad' }); return; } t = res.temp; u.mustChange = true; } else t = await resetMemberPassword(u);
      logAct(c, 'team', `Redefiniu a senha de ${u.name}`); save(); refreshPage(); showCredentials(u, t, false);
    } },
    { label: u.active === false ? 'Reativar acesso' : 'Desativar acesso', icon: u.active === false ? 'refresh' : 'ban', run: async () => {
      const next = u.active === false;
      if (Cloud.on) { const { error } = await Cloud.sb.rpc('manage_member', { p_user: u.id, p_action: next ? 'activate' : 'deactivate' }); if (error) { toast(fnError('not_allowed'), { type: 'bad' }); return; } }
      u.active = next; logAct(c, 'team', `${u.active ? 'Reativou' : 'Desativou'} o acesso de ${u.name}`); save(); refreshPage(); toast(u.active ? 'Acesso reativado.' : 'Acesso desativado. A pessoa não consegue mais entrar.');
    } },
    { sep: true },
    { label: 'Remover da equipe', icon: 'trash', danger: true, run: async () => {
      const ok = await confirmBox({ title: `Remover ${u.name}?`, text: 'A pessoa perde o acesso ao painel. O histórico do que ela fez continua registrado.', ok: 'Remover', danger: true }); if (!ok) return;
      if (Cloud.on) { const res = await callFn('team', { action: 'remove', user_id: u.id }); if (res.error) { toast(fnError(res.error), { type: 'bad' }); return; } }
      delete DB.users[u.email]; logAct(c, 'team', `Removeu ${u.name} da equipe`); save(); refreshPage(); toast('Pessoa removida da equipe.');
    } },
  ];
  openMenu(el, items);
};
function changeRoleModal(u) {

F.role = async (f) => {
  const c = co();
  const u = DB.users[f.dataset.email];
  const role = formValues(f).role;
  if (!u || !ROLES[role] || role === 'owner') return;

  }
  u.role = role;
  logAct(c, 'team', `Mudou a função de ${u.name} para ${ROLES[role].label}`);

function impersonate(u) {
  DB.session = { email: u.email, realEmail: DB.session.realEmail || DB.session.email };

function viewAutomations() {

  const late30 = c.charges.filter((ch) => ch.log.some((l) => l.by === 'auto' && l.to === 'atrasado' && l.at >= d30)).length;
  const recon30 = sumBy(c.reconLog.filter((l) => l.at >= d30), (l) => l.n);
  const pixKey = !!pixKeyFormatted(c);
  const onCount = [s.autoOverdue, recActive.length > 0, fr.on, s.pixCode !== false && pixKey, s.backupReminder !== false, planHas('automations') && s.regua.some((x) => x.on)].filter(Boolean).length;

      ${foot ? html`<div class="auto-foot">${foot}</div>` : ''}

  const q = planHas('automations') ? todayQueue(c) : [];
  const recRank = { ativa: 0, pausada: 1, encerrada: 2 };

  return html`
  <div class="page-head"><div><h2>Automações</h2><p class="page-sub">O que o Quitaí faz sozinho por você. Tudo é posto em dia sempre que alguém da equipe abre o painel, em qualquer dispositivo.</p></div></div>

    <div><span>Geradas em 30 dias</span><strong>${gen30}</strong><em>cobranças criadas sozinhas</em></div>
    <div><span>Baixas pelo extrato</span><strong>${recon30}</strong><em>nos últimos 30 dias</em></div>
  </section>
  <div class="auto-grid">
    ${card({ ic: 'alert', tone: 'bad', title: 'Atraso automático', off: !s.autoOverdue, ctrl: sw('autoOverdue', s.autoOverdue, 'Atraso automático'), text: 'Passou do vencimento sem pagamento, a cobrança vai sozinha para Em atraso e entra na régua.', meta: `${s.graceDays ? `Tolerância de ${plural(s.graceDays, 'dia', 'dias')}` : 'Sem tolerância'} · ${plural(late30, 'cobrança marcada', 'cobranças marcadas')} em 30 dias`, foot: html`<button type="button" class="link-btn" data-act="nav" data-page="config" data-tab="cobranca">Ajustar tolerância</button>` })}
    ${card({ ic: 'repeat', title: 'Mensalidades automáticas', text: `Crie a mensalidade uma vez: o Quitaí gera a cobrança de cada mês ${recLead(c)} dias antes do vencimento, com Pix e régua prontos.`, meta: recActive.length ? `${plural(recActive.length, 'ativa', 'ativas')} · ${fmtMoney(recMonthlyTotal(c))} por mês` : 'Nenhuma mensalidade ainda', foot: can('charges.edit') ? html`<button type="button" class="btn btn-sm" data-act="newRecurrence">${icon('plus')}Nova mensalidade</button>` : '' })}
    ${card({ ic: 'percent', tone: 'warn', title: 'Multa e juros', off: !fr.on, ctrl: sw('fees', fr.on, 'Multa e juros'), text: 'Calcula o valor atualizado de cada cobrança em atraso e coloca nas mensagens e no Pix.', meta: fr.on ? `${fmtBp(fr.fine)} de multa + ${fmtBp(fr.interest)} ao mês · ${fmtMoney(Math.max(0, m.overdueUpd - m.overdue))} a mais hoje` : 'Desligado: as cobranças em atraso ficam com o valor original', foot: html`<button type="button" class="link-btn" data-act="nav" data-page="config" data-tab="cobranca">Ajustar percentuais</button>` })}
    ${card({ ic: 'qr', tone: 'ok', title: 'Pix copia e cola', off: s.pixCode === false || !pixKey, ctrl: sw('pixCode', s.pixCode !== false, 'Pix copia e cola'), text: 'Cada cobrança ganha um Pix com o valor certo (já com multa e juros) e QR Code, que também vai na mensagem.', meta: pixKey ? `Chave ${PIX_TYPES[c.pixType]}: ${c.pixKey}` : 'Falta cadastrar a chave Pix da empresa', foot: pixKey ? '' : html`<button type="button" class="btn btn-sm" data-act="nav" data-page="config" data-tab="empresa">Cadastrar chave Pix</button>` })}
    ${card({ ic: 'bank', tone: 'ok', title: 'Baixa pelo extrato', ctrl: planHas('reconcile') ? '' : lock('reconcile'), text: 'Envie o extrato do banco (OFX, CSV, Excel ou PDF). O Quitaí encontra o pagamento de cada cobrança e dá baixa.', meta: c.reconLog[0] ? `Última importação ${timeAgo(c.reconLog[0].at)}: ${plural(c.reconLog[0].n, 'baixa', 'baixas')}` : 'Nenhum extrato importado ainda', foot: html`<button type="button" class="btn btn-sm" data-act="goStatement">${icon('upload')}Importar extrato</button>` })}
    ${card({ ic: 'calculator', title: 'Conferência da maquininha', ctrl: planHas('cards') ? '' : lock('cards'), text: 'Cruza as vendas do caixa com o relatório da maquininha e mostra se alguma taxa veio acima do contratado.', meta: c.cardAudits[0] ? `Última conferência: ${c.cardAudits[0].over ? fmtMoney(c.cardAudits[0].over) + ' cobrados a mais' : 'taxas certas'}` : 'Nenhuma conferência ainda', foot: html`<button type="button" class="btn btn-sm" data-act="goCards">${icon('percent')}Conferir taxas</button>` })}
    ${card({ ic: 'ai', title: 'Fechamento com IA', text: 'Resumo do dia, da semana ou do mês escrito pelo Claude, com alertas e próximos passos, e um assistente para perguntas.', meta: aiUsageLine(c), foot: html`<button type="button" class="btn btn-sm" data-act="nav" data-page="fechamento">${icon('book')}Abrir fechamento</button>` })}
    ${card({ ic: 'database', title: 'Lembrete de backup', off: s.backupReminder === false, ctrl: sw('backupReminder', s.backupReminder !== false, 'Lembrete de backup'), text: 'Avisa no sino quando passar 30 dias sem baixar uma cópia dos dados.', meta: last ? `Último backup ${timeAgo(last)}` : 'Nenhum backup feito ainda', foot: can('data.export') ? html`<button type="button" class="link-btn" data-act="exportJSON">Baixar backup agora</button>` : '' })}
  </div>

    <div class="card-body flush">${queueListHTML(c, q)}</div>

  <section class="card" aria-labelledby="rc-title">

    <div class="card-body flush">${c.recurrences.length ? html`${recListHTML(c, recSorted.slice(0, ui.recAll ? recSorted.length : 8))}${recSorted.length > 8 ? html`<div class="card-foot"><span class="muted">${ui.recAll ? `Mostrando todas as ${recSorted.length}` : `Mostrando 8 de ${recSorted.length}`}</span><button type="button" class="btn btn-sm" data-act="recToggleAll">${ui.recAll ? 'Mostrar menos' : 'Mostrar todas'}</button></div>` : ''}` : emptyMini('repeat', 'Nenhuma mensalidade automática', 'Na hora de lançar uma cobrança, escolha "Todo mês" e "Até eu encerrar". O Quitaí cuida dos próximos meses.')}</div>
  </section>
  ${planHas('automations') ? reguaSection(c) : html`<section class="card upsell-strip">${icon('lock')}<div class="grow"><strong>Régua de cobrança com fila diária</strong><p class="muted">No plano Empresa, você define quando lembrar e quando cobrar, e o Quitaí monta a fila de quem precisa de contato hoje.</p></div><button type="button" class="btn btn-sm" data-act="upgrade" data-feature="automations">Conhecer</button></section>`}
  <section aria-labelledby="soon-title" class="stack">

CH.autoToggle = (el) => {

  const k = el.dataset.k, on = el.checked;
  if (k === 'fees') c.settings.fees.on = on;
  else if (k === 'pixCode') c.settings.pixCode = on;

  let extra = '';
  if (k === 'autoOverdue' && on) { const n = runAutoOverdue(c); if (n) extra = ` ${plural(n, 'cobrança passou', 'cobranças passaram')} para Em atraso.`; }
  const names = { autoOverdue: 'Atraso automático', fees: 'Multa e juros', pixCode: 'Pix copia e cola', backupReminder: 'Lembrete de backup' };
  logAct(c, 'settings', `${on ? 'Ligou' : 'Desligou'} a automação ${names[k] || k}`);
  save();
  refreshPage();
  toast(`${names[k] || 'Automação'} ${on ? 'ligado' : 'desligado'}.${extra}`, { type: 'info' });
};

  return html`<div class="table-wrap"><table class="table responsive">

F.recurrence = (f) => {
  const c = co();
  const r = recById(c, f.dataset.id);
  if (!r || !can('charges.edit')) return readOnlyToast();
  const v = formValues(f);
  const amount = parseMoney(v.amount);
  const day = parseInt(v.day, 10);
  const errs = {};
  if (v.desc.length < 2) errs.desc = 'Descreva a mensalidade.';
  if (!amount || amount <= 0) errs.amount = 'Digite um valor maior que zero.';
  if (!(day >= 1 && day <= 31)) errs.day = 'Use um dia de 1 a 31.';
  if (!showErrors(f, errs)) return;
  const dayChanged = day !== r.day;
  Object.assign(r, { desc: v.desc, amount, method: v.method, notes: v.notes, updatedAt: Date.now() });
  if (dayChanged) {
    r.day = day;
    let next = addMonths(monthStart(r.next), 0, day);
    if (r.lastDue && next <= r.lastDue) next = addMonths(monthStart(next), 1, day);
    r.next = next;
  }
  const n = runRecurrences(c);
  logAct(c, 'rec', `Editou a mensalidade automática ${r.desc}`);
  save();
  closeModal(true);
  refreshPage();
  toast(`Mensalidade atualizada.${n ? ` ${plural(n, 'cobrança gerada', 'cobranças geradas')} agora.` : ''}`);
};
function recSetStatus(id, to) {
  const c = co();
  const r = recById(c, id);
  if (!r || !can('charges.edit')) return readOnlyToast();
  const cl = clientById(c, r.clientId);
  if (to === 'pausada') { r.status = 'pausada'; r.pausedAt = Date.now(); r.updatedAt = Date.now(); }
  else { recResume(c, r); r.endedAt = null; }
  const firstDue = r.next;
  const n = to === 'ativa' ? runRecurrences(c) : 0;
  logAct(c, 'rec', `${to === 'pausada' ? 'Pausou' : 'Retomou'} a mensalidade automática de ${cl ? cl.name : 'cliente'} (${r.desc})`);
  save();
  closeAllModals();
  refreshPage();
  toast(to === 'pausada' ? 'Mensalidade pausada. Nenhuma cobrança nova até você retomar.' : `Mensalidade retomada. A próxima cobrança vence em ${fmtDate(firstDue)}${n ? ' e já foi gerada' : ''}.`, { type: 'info' });
}
async function recEnd(id) {
  const c = co();
  const r = recById(c, id);
  if (!r || !can('charges.edit')) return readOnlyToast();
  const t = todayISO();
  const future = c.charges.filter((ch) => ch.recId === r.id && ch.status === 'pendente' && ch.due >= t);
  const ok = await confirmBox({ title: 'Encerrar esta mensalidade?', text: 'O Quitaí para de gerar novas cobranças. As cobranças já geradas continuam na lista.', detail: future.length ? `${plural(future.length, 'cobrança já gerada ainda não venceu', 'cobranças já geradas ainda não venceram')} (${future.map((x) => fmtDate(x.due)).join(', ')}). Ela${future.length > 1 ? 's serão canceladas' : ' será cancelada'} junto.` : '', ok: 'Encerrar', danger: true });
  if (!ok) return;
  r.status = 'encerrada'; r.endedAt = Date.now(); r.updatedAt = Date.now();
  for (const ch of future) setStatus(c, ch, 'cancelado', { note: 'Mensalidade encerrada', silent: true });
  const cl = clientById(c, r.clientId);
  logAct(c, 'rec', `Encerrou a mensalidade automática de ${cl ? cl.name : 'cliente'} (${r.desc})${future.length ? ` e cancelou ${plural(future.length, 'cobrança futura', 'cobranças futuras')}` : ''}`);
  save();
  closeAllModals();
  refreshPage();
  toast('Mensalidade encerrada.', { type: 'info' });
}

function dealState() {
  const f = document.getElementById('f-deal');
  if (!f) return null;
  const c = co();
  const ids = Array.from(f.querySelectorAll('input[type=checkbox][name^="ch_"]')).filter((i) => i.checked).map((i) => i.name.slice(3));
  const list = ids.map((id) => chargeById(c, id)).filter(Boolean);
  const includeFees = !!(f.elements.includeFees && f.elements.includeFees.checked);
  const discount = parseMoney(f.elements.discount.value) || 0;
  const n = clamp(parseInt(f.elements.n.value, 10) || 1, 1, 24);
  return { f, c, ids, list, includeFees, discount, n, firstDue: f.elements.firstDue.value, calc: agreementCalc(c, list, { includeFees, discount }) };
}
function dealPreview() {
  const s = dealState();
  if (!s) return;
  const box = document.getElementById('deal-preview');
  if (!s.list.length) { box.innerHTML = html`<p class="hint">Escolha pelo menos uma cobrança.</p>`.s; return; }
  const { calc, n } = s;
  const base = Math.floor(calc.total / n), first = calc.total - base * (n - 1);
  const dates = range(Math.min(n, 3)).map((i) => (isISODate(s.firstDue) ? addMonths(s.firstDue, i, +s.firstDue.slice(8, 10)) : ''));
  box.innerHTML = html`<div class="deal-sum">
      <div><span>Dívida original</span><strong>${fmtMoney(calc.original)}</strong></div>
      ${calc.fees ? html`<div><span>Multa e juros</span><strong>+ ${fmtMoney(calc.fees)}</strong></div>` : ''}
      ${calc.discount ? html`<div><span>Desconto</span><strong>− ${fmtMoney(calc.discount)}</strong></div>` : ''}
      <div class="total"><span>Total do acordo</span><strong>${fmtMoney(calc.total)}</strong></div>
    </div>
    <p class="ink2">${n === 1 ? `Pagamento único de ${fmtMoney(calc.total)}` : `${n} parcelas de ${fmtMoney(base)}${first !== base ? ` (a 1ª de ${fmtMoney(first)})` : ''}`}${dates[0] ? `, ${n === 1 ? 'com vencimento em' : 'a partir de'} ${fmtDate(dates[0])}` : ''}. ${plural(s.list.length, 'cobrança antiga será cancelada', 'cobranças antigas serão canceladas')} e o que for pago entra como recuperado.</p>`.s;
}
CH.dealCalc = () => dealPreview();

F.agreement = (f) => {
  const s = dealState();
  if (!s) return;
  const errs = {};
  if (!s.list.length) { toast('Escolha pelo menos uma cobrança para o acordo.', { type: 'warn' }); return; }
  if (!isISODate(s.firstDue)) errs.firstDue = 'Escolha o 1º vencimento.';
  if (s.calc.total <= 0) errs.discount = 'O desconto não pode zerar o acordo.';

  const c = s.c;
  const res = createAgreement(c, { clientId: f.dataset.client, chargeIds: s.ids, includeFees: s.includeFees, discount: s.discount, n: s.n, firstDue: s.firstDue, desc: f.elements.desc.value.trim(), method: f.elements.method.value });

CH.reguaWhen = (el) => { const s = reguaStep(el.dataset.id); if (!s) return; const n = Math.abs(s.offset) || 3; s.offset = el.value === 'antes' ? -n : el.value === 'depois' ? n : 0; if (el.value !== 'dia' && s.offset === 0) s.offset = el.value === 'antes' ? -3 : 3; save(); refreshPage(false); };
CH.reguaTpl = (el) => { const s = reguaStep(el.dataset.id); if (!s) return; s.tpl = el.value; save(); refreshPage(false); };
CH.reguaOn = (el) => { const s = reguaStep(el.dataset.id); if (!s) return; s.on = el.checked; save(); refreshPage(false); };
A.reguaDel = (el) => { const c = co(); c.settings.regua = c.settings.regua.filter((s) => s.id !== el.dataset.id); save(); refreshPage(false); toast('Etapa removida.', { type: 'info' }); };
A.reguaAdd = () => { const c = co(); const max = Math.max(0, ...c.settings.regua.map((s) => s.offset)); c.settings.regua.push({ id: uid('r'), offset: max + 5, tpl: 'overdue', on: true }); save(); refreshPage(false); };

A.changePlan = async (el) => {
  const c = co();
  const to = el.dataset.plan;
  closeAllModals();
  if (c.billing.complimentary) { toast('Sua conta é cortesia e já tem o plano Empresa, com tudo liberado.', { type: 'info' }); return; }
  if (me().role !== 'owner' || isImpersonating()) { toast('Só o proprietário da conta pode mudar o plano.', { type: 'warn' }); return; }
  if (!PLANS[to]) return;
  const np = PLANS[to];
  if (Number.isFinite(np.clients) && c.clients.length > np.clients) {
    openModal({ title: `O plano ${np.name} permite ${np.clients} clientes`, size: 'sm', body: html`<p class="ink2">Você tem ${c.clients.length} clientes cadastrados. Para mudar para o ${np.name}, exclua ${c.clients.length - np.clients} ${c.clients.length - np.clients === 1 ? 'cliente' : 'clientes'} antes ou escolha outro plano.</p>`, foot: html`<button type="button" class="btn btn-primary" data-act="modalCancel">Entendi</button>` });
    return;
  }
  const bs = billingState(c).kind;
  if (bs === 'trial-ended' || bs === 'canceled-ended') { openCheckout(to); return; }
  if (c.cloud && (bs === 'active' || bs === 'canceled-active')) { A.billingPortal(); return; }
  const members = usersOf(c).filter((u) => u.role !== 'owner').length;
  const loseTeam = !np.features.team && members > 0;
  const lost = Object.keys(FEATURE_PLAN).filter((f) => planHas(f, c) && !np.features[f]).map((f) => FEATURE_INFO[f].title);
  const ok = await confirmBox({
    title: `Mudar para o plano ${np.name}?`,
    text: bs === 'trial' ? `Seu teste grátis continua até ${fmtDate(c.billing.trialEndsAt)}, agora no plano ${np.name}.` : `A mudança vale agora. A próxima fatura, em ${fmtDate(c.billing.currentPeriodEnd)}, será de ${fmtMoney(planCharge(to, c.billing.cycle))}${c.billing.cycle === 'anual' ? ' (plano anual)' : ''}.`,
    detail: lost.length ? `Você deixa de ter: ${lost.join(', ')}.${loseTeam ? ` As ${plural(members, 'pessoa', 'pessoas')} da equipe ficam sem acesso até você voltar para o Empresa.` : ''}` : '',
    ok: `Mudar para o ${np.name}`, danger: lost.length > 0,
  });
  if (!ok) return;
  const from = planOf(c).name;
  if (c.cloud) {
    const { error } = await Cloud.sb.rpc('set_trial_plan', { p_plan: to });
    if (error) { toast(fnError('network'), { type: 'bad' }); return; }
  }
  c.plan = to;
  if (bs === 'canceled-active') { c.billing.status = 'active'; c.billing.canceledAt = null; }
  logAct(c, 'plan', `Mudou do plano ${from} para o ${np.name}`);
  save();
  refreshPage(false);
  toast(`Pronto. Você está no plano ${np.name}.`);
};

F.checkout = async (f) => {
  const c = co();
  const planId = f.dataset.plan;
  const v = formValues(f);
  if (c.cloud) {
    const btn = $('[form="f-checkout"]');
    setBusy(btn, true, 'Abrindo o pagamento…');
    const res = await callFn('billing', { action: 'checkout', plan: planId, cycle: v.cycle === 'anual' ? 'anual' : 'mensal' });

  subscribe(c, planId, method, cycle);
  logAct(c, 'plan', `Assinou o plano ${PLANS[planId].name} ${cycle} (${METHODS[method] || method})`);
  save();
  closeModal(true);
  refreshPage(false);
  toast(`Assinatura do plano ${PLANS[planId].name} ativada. Obrigado!`);
};
/* ---------- administração do Quitaí (só administradores) ---------- */
function adminStatus(r) {
  const t = todayISO();
  if (r.complimentary) return { key: 'ativas', label: 'Cortesia', cls: 'st-pago', icon: 'star' };
  if (r.billing_status === 'trial') return r.trial_ends_at >= t ? { key: 'teste', label: 'Em teste', cls: 'st-pendente', icon: 'clock' } : { key: 'canceladas', label: 'Teste encerrado', cls: 'st-atrasado', icon: 'lock' };
  if (r.billing_status === 'active') return { key: 'ativas', label: 'Ativa', cls: 'st-pago', icon: 'checkCircle' };
  if (r.billing_status === 'past_due') return { key: 'ativas', label: 'Pagamento pendente', cls: 'st-atrasado', icon: 'alert' };
  return r.current_period_end && r.current_period_end > t ? { key: 'canceladas', label: 'Cancelada · acesso até ' + fmtDate(r.current_period_end), cls: 'st-pendente', icon: 'info' } : { key: 'canceladas', label: 'Cancelada', cls: 'st-cancelado', icon: 'ban' };
}
function adminMRR(r) {
  if (r.complimentary || !['active', 'past_due'].includes(r.billing_status)) return 0;
  return planMonthly(r.plan, r.billing_cycle === 'anual' ? 'anual' : 'mensal');
}

  const [a, b] = await Promise.all([Cloud.sb.rpc('admin_companies'), Cloud.sb.rpc('admin_tickets', { p_limit: 50 })]);
  ui.admin.loading = false;
  if (a.error || b.error) ui.admin.error = 'Não conseguimos carregar os dados agora. Tente atualizar.';
  else { ui.admin.rows = a.data || []; ui.admin.tickets = b.data || []; ui.admin.loadedAt = Date.now(); }
  if (ui.route.page === 'admin') refreshPage(false);
}

CH.logoFile = (el) => {
  const file = el.files && el.files[0];
  if (!file) return;
  if (!/^image\//.test(file.type)) { toast('Escolha uma imagem PNG ou JPG.', { type: 'warn' }); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 240;
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;

F.password = async (f) => {
  const u = me();
  const cur = f.elements.cur.value, p1 = f.elements.p1.value, p2 = f.elements.p2.value;
  const errs = {};
  if (Cloud.on) {
    if (!cur) errs.cur = 'Digite a senha atual.';
  } else if ((await hashPass(cur, u.salt)) !== u.hash) errs.cur = 'A senha atual não confere.';
  if (p1.length < 8) errs.p1 = 'A nova senha precisa ter pelo menos 8 caracteres.';
  else if (p1 !== p2) errs.p2 = 'As senhas não são iguais.';
  if (!showErrors(f, errs)) return;
  if (Cloud.on) {
    const btn = f.querySelector('[type=submit]');
    setBusy(btn, true, 'Alterando…');
    const chk = await Cloud.sb.auth.signInWithPassword({ email: realUser().email, password: cur });
    if (chk.error) { setBusy(btn, false); showErrors(f, { cur: /invalid login/i.test(chk.error.message) ? 'A senha atual não confere.' : authErrorText(chk.error) }); return; }
    const { error } = await Cloud.sb.auth.updateUser({ password: p1 });
    setBusy(btn, false);
    if (error) { showErrors(f, { p1: /different|same/i.test(error.message) ? 'A nova senha precisa ser diferente da atual.' : authErrorText(error) }); return; }
    f.reset();
    toast('Senha alterada.');
    return;
  }
  u.salt = uid('s_');
  u.hash = await hashPass(p1, u.salt);
  u.mustChange = false;
  save();
  f.reset();
  toast('Senha alterada.');
};

A.restoreGo = async () => {
  const r = ui.restore;
  if (!r) return;
  const c = co();
  const withSettings = document.getElementById('restore-settings').checked;
  const withCompany = document.getElementById('restore-company').checked;
  const ok = await confirmBox({ title: 'Substituir os dados atuais?', text: `Os ${plural(c.clients.length, 'cliente', 'clientes')} e as ${plural(c.charges.length, 'cobrança', 'cobranças')} de agora serão trocados pelos do backup. Se quiser guardar os dados atuais, baixe uma cópia antes.`, ok: 'Substituir', danger: true, typed: 'RESTAURAR' });
  if (!ok) return;
  c.clients = r.clients;
  c.charges = r.charges;
  c.recurrences = r.recurrences || [];
  c.agreements = [];
  c.bankSeen = {};
  c.seq.charge = Math.max(0, ...r.charges.map((x) => x.num)) + 1;
  c.queueDone = {};
  if (withSettings && r.data.settings) {
    const s = r.data.settings;
    if (typeof s.templateReminder === 'string' && s.templateReminder.length >= 10) c.settings.tplReminder = s.templateReminder.slice(0, 1500);
    if (typeof s.templateOverdue === 'string' && s.templateOverdue.length >= 10) c.settings.tplOverdue = s.templateOverdue.slice(0, 1500);
    if (typeof s.autoOverdue === 'boolean') c.settings.autoOverdue = s.autoOverdue;
    if (Number.isFinite(s.graceDays)) c.settings.graceDays = clamp(s.graceDays | 0, 0, 30);
    if (['auto', 'web', 'app'].includes(s.whatsappMode)) c.settings.waMode = s.whatsappMode;
    if (Array.isArray(s.collectionSchedule) && s.collectionSchedule.length) c.settings.regua = s.collectionSchedule.slice(0, 12).map((x) => ({ id: String(x.id || uid('r')), offset: clamp(x.offsetDays | 0, -90, 90), tpl: x.template === 'reminder' ? 'reminder' : 'overdue', on: x.enabled !== false }));
    if (s.lateFees && typeof s.lateFees === 'object') c.settings.fees = { on: !!s.lateFees.enabled, fine: clamp(Math.round((+s.lateFees.finePercent || 0) * 100), 0, 1000), interest: clamp(Math.round((+s.lateFees.monthlyInterestPercent || 0) * 100), 0, 1000) };
    if (Number.isFinite(s.recurringLeadDays)) c.settings.recLeadDays = clamp(s.recurringLeadDays | 0, 1, 28);
    if (typeof s.pixCopyPaste === 'boolean') c.settings.pixCode = s.pixCopyPaste;
    if (typeof s.backupReminder === 'boolean') c.settings.backupReminder = s.backupReminder;
  }
  if (withCompany && r.data.company) {
    const k = r.data.company;
    if (k.name) c.name = String(k.name).slice(0, 80);
    c.doc = onlyDigits(k.document).slice(0, 14);
    c.phone = onlyDigits(k.phone).slice(0, 13);
    c.city = String(k.city || '');
    c.state = UFS.includes(k.state) ? k.state : '';
    c.pixType = PIX_TYPES[k.pixKeyType] ? k.pixKeyType : c.pixType;
    c.pixKey = String(k.pixKey || '');
    if (SEGMENTS[k.segment]) c.segment = k.segment;
  }
  runAutomations(c);
  logAct(c, 'data', `Restaurou um backup com ${plural(r.clients.length, 'cliente', 'clientes')} e ${plural(r.charges.length, 'cobrança', 'cobranças')}`);
  ui.restore = null;
  ui.charges = defaultChargeFilters();
  save();
  refreshPage(false);
  toast('Backup restaurado.');
};

/* tela de mapeamento de colunas (extrato e maquininha) */
function mappingUI(scope, rows, fields, current, required, text) {

  const cols = (current && current.cols) || {};
  const hr = current && Number.isFinite(current.headerRow) ? current.headerRow : 0;
  const fieldOf = (i) => Object.keys(cols).find((k) => cols[k] === i) || '';
  return html`<div class="map-box" data-scope="${scope}">
    <div class="callout warn">${icon('sliders')}<div>${text} Campos obrigatórios: ${required.map((f) => fields[f]).join(', ')}.</div></div>
    <div class="field" style="max-width:280px"><label for="map-hr-${scope}">Linha do cabeçalho</label><span class="select-wrap"><select id="map-hr-${scope}" class="select" data-change="mapHeader" data-scope="${scope}">${head.map((r, i) => html`<option value="${i}"${sel(hr === i)}>Linha ${i + 1}: ${r.slice(0, 3).join(' · ').slice(0, 40)}</option>`)}</select></span></div>
    <div class="table-wrap map-table"><table class="table"><thead><tr>${range(ncol).map((i) => html`<th><span class="select-wrap"><label class="sr-only" for="map-${scope}-${i}">Coluna ${i + 1}</label><select id="map-${scope}-${i}" class="select" data-change="mapCol" data-scope="${scope}" data-i="${i}"><option value="">Ignorar</option>${Object.entries(fields).map(([k, l]) => html`<option value="${k}"${sel(fieldOf(i) === k)}>${l}</option>`)}</select></span></th>`)}</tr></thead>
    <tbody>${head.map((r, ri) => html`<tr class="${ri === hr ? 'is-head' : ''}">${range(ncol).map((i) => html`<td class="nowrap">${String(r[i] == null ? '' : r[i]).slice(0, 40)}</td>`)}</tr>`)}</tbody></table></div>
    <div class="row-wrap"><button type="button" class="btn btn-primary" data-act="mapApply" data-scope="${scope}">Usar estas colunas</button>${aiReady() ? html`<button type="button" class="btn btn-soft" data-act="mapAI" data-scope="${scope}">${icon('ai')}Descobrir com IA</button>` : ''}</div>
  </div>`;
}
function mapTarget(scope) {
  if (scope === 'recon') return { st: ui.recon, fields: STATEMENT_MAP_FIELDS, required: ['date'] };
  if (scope === 'machine') return { st: ui.cards && ui.cards.machine, fields: MACHINE_MAP_FIELDS, required: ['date', 'gross'] };
  return { st: ui.cards && ui.cards.pdv, fields: PDV_MAP_FIELDS, required: ['date', 'amount'] };
}
CH.mapHeader = (el) => { const { st } = mapTarget(el.dataset.scope); if (!st) return; st.map = Object.assign({ cols: {} }, st.map, { headerRow: +el.value }); };
CH.mapCol = (el) => {
  const { st } = mapTarget(el.dataset.scope);
  if (!st) return;
  st.map = Object.assign({ headerRow: 0, cols: {} }, st.map);
  const cols = Object.assign({}, st.map.cols);
  for (const k of Object.keys(cols)) if (cols[k] === +el.dataset.i) delete cols[k];
  if (el.value) cols[el.value] = +el.dataset.i;
  st.map.cols = cols;
};
A.mapApply = (el) => {
  const scope = el.dataset.scope;
  const { st, required, fields } = mapTarget(scope);
  if (!st || !st.map) return;
  const miss = required.filter((f) => !(f in st.map.cols));
  if (scope === 'recon' && !('amount' in st.map.cols) && !('credit' in st.map.cols)) miss.push('amount');
  if (scope === 'machine' && !['fee', 'feePct', 'net'].some((f) => f in st.map.cols)) toast('Sem a coluna de taxa ou de valor líquido, dá para cruzar vendas, mas não conferir as taxas.', { type: 'warn', timeout: 7000 });
  if (miss.length) { toast(`Falta indicar: ${miss.map((f) => fields[f] || 'valor').join(', ')}.`, { type: 'warn' }); return; }
  if (scope === 'recon') reconFromLoaded(st.loaded, st.file, st.map); else cardsParse(scope);
};
A.mapAI = async (el) => {
  const scope = el.dataset.scope;
  const { st, fields } = mapTarget(scope);
  if (!st || !st.loaded) return;
  setBusy(el, true, 'Analisando…');
  try {
    const res = await askAI(promptMapColumns({ kind: scope === 'recon' ? 'extrato bancário' : scope === 'machine' ? 'relatório de vendas da maquininha de cartão' : 'relatório de vendas do caixa/PDV', fields, rows: st.loaded.rows }), { json: true, tier: 'quick' });
    const cols = {};
    const ncol = Math.max(...st.loaded.rows.slice(0, 10).map((r) => r.length));
    for (const [k, v] of Object.entries((res && res.colunas) || {})) if (k in fields && Number.isInteger(v) && v >= 0 && v < ncol) cols[k] = v;
    const hr = Number.isInteger(res && res.linhaCabecalho) ? res.linhaCabecalho : 0;
    st.map = { headerRow: Math.max(-1, hr), cols };
    if (st.map.headerRow < 0) st.map.headerRow = -1;
    toast('A IA sugeriu as colunas. Confira e clique em Usar estas colunas.', { type: 'info' });
    refreshPage(false);
  } catch (e) { aiHandleError(e); setBusy(el, false); }
};

function mdLite(text) {
  const lines = String(text || '').split('\n');
  let out = '', inList = false;
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|\s)\*(\S[^*]*?)\*(?=\s|$|[.,;:!?])/g, '$1<em>$2</em>');
  for (const l of lines) {
    const m = l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)$/);
    if (m) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${inline(m[1])}</li>`; continue; }
    if (inList) { out += '</ul>'; inList = false; }
    const h = l.match(/^\s*#{1,4}\s+(.*)$/);
    if (h) out += `<p><strong>${inline(h[1])}</strong></p>`;
    else if (l.trim()) out += `<p>${inline(l)}</p>`;
  }
  if (inList) out += '</ul>';
  return out;
}

/* ============================================================
   Exportação: CSV, TSV, Excel (.xlsx), PDF e backup JSON.
   ============================================================ */
function csvCell(v, type, delim) {
  let s;
  if (v == null || v === '') s = '';
  else if (type === 'money' && typeof v === 'number') s = (v / 100).toFixed(2).replace('.', ',');
  else if (type === 'date' && isISODate(v)) s = fmtDate(v);
  else s = String(v);
  if (s.includes(delim) || s.includes('"') || /[\r\n]/.test(s) || /^[=+\-@]/.test(s)) s = '"' + (/^[=+\-@]/.test(s) ? "'" : '') + s.replace(/"/g, '""') + '"';
  return s;
}
function reportToCSV(rep) {
  const d = ';';
  const lines = [rep.columns.map((c) => csvCell(c.label, 'text', d)).join(d)];
  for (const row of rep.rows) lines.push(rep.columns.map((c) => csvCell(row[c.key], c.type, d)).join(d));
  if (rep.totals) lines.push(rep.columns.map((c) => csvCell(rep.totals[c.key], c.type, d)).join(d));
  return '\uFEFF' + lines.join('\r\n') + '\r\n';
}
function reportToTSV(rep) {
  const cell = (v, type) => {
    if (v == null || v === '') return '';
    if (type === 'money' && typeof v === 'number') return (v / 100).toFixed(2).replace('.', ',');
    if (type === 'date' && isISODate(v)) return fmtDate(v);
    return String(v).replace(/[\t\r\n]+/g, ' ');
  };
  const lines = [rep.columns.map((c) => c.label).join('\t')];
  for (const row of rep.rows) lines.push(rep.columns.map((c) => cell(row[c.key], c.type)).join('\t'));
  if (rep.totals) lines.push(rep.columns.map((c) => cell(rep.totals[c.key], c.type)).join('\t'));
  return lines.join('\n');
}

function xmlEsc(s) { return String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function colName(i) { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }

function xCell(ref, v, type, style) {
  if (v == null || v === '') return style ? `<c r="${ref}" s="${style}"/>` : '';
  if (type === 'money' && typeof v === 'number') return `<c r="${ref}" s="${style || 2}"><v>${(v / 100).toFixed(2)}</v></c>`;
  if (type === 'int' && typeof v === 'number') return `<c r="${ref}"${style ? ` s="${style}"` : ''}><v>${v}</v></c>`;
  if (type === 'date' && isISODate(v)) return `<c r="${ref}" s="${style || 3}"><v>${excelDate(v)}</v></c>`;
  return `<c r="${ref}" t="inlineStr"${style ? ` s="${style}"` : ''}><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
}
function buildSheetXML(columns, rows, totals, { widths } = {}) {

  x += '<row r="1">' + columns.map((c, i) => xCell(colName(i) + '1', c.label, 'text', 1)).join('') + '</row>';
  rows.forEach((row, ri) => { const r = ri + 2; x += `<row r="${r}">` + columns.map((c, i) => xCell(colName(i) + r, row[c.key], c.type)).join('') + '</row>'; });

      return `<c r="${ref}" t="inlineStr" s="5"><is><t>${xmlEsc(v)}</t></is></c>`;
    }).join('') + '</row>';
  }
  x += '</sheetData>';
  if (rows.length) x += `<autoFilter ref="A1:${colName(columns.length - 1)}${last}"/>`;
  x += '<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/><pageSetup orientation="landscape" paperSize="9"/></worksheet>';

function buildSummaryXML(title, lines) {

  x += `<row r="1"><c r="A1" t="inlineStr" s="6"><is><t>${xmlEsc(title)}</t></is></c></row>`;

const WINANSI_EXTRA = new Set(Array.from('€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ'));
function winAnsi(s) {
  let out = '';
  for (const ch of String(s == null ? '' : s)) {
    const code = ch.codePointAt(0);
    if ((code >= 0x20 && code <= 0x7e) || (code >= 0xa0 && code <= 0xff) || WINANSI_EXTRA.has(ch)) out += ch;
    else if (code === 0x202f) out += '\u00A0';
    else if (ch === '\n' || ch === '\t' || ch === '\r') out += ' ';
    else out += '?';
  }
  return out;
}
function dataURLBytes(u) {
  const b64 = u.slice(u.indexOf(',') + 1);
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
async function reportToPDF(rep, c) {

  doc.setAuthor(winAnsi(c.name));
  doc.setCreator('Quitaí');
  doc.setProducer('Quitaí');
  const font = await doc.embedFont(StandardFonts.Helvetica);
  const bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const landscape = rep.columns.length > 6;
  const PW = landscape ? 841.89 : 595.28, PH = landscape ? 595.28 : 841.89;
  const M = 36, avail = PW - 2 * M;
  const ink = rgb(0.07, 0.08, 0.13), ink2 = rgb(0.29, 0.32, 0.4), ink3 = rgb(0.4, 0.43, 0.51), line = rgb(0.88, 0.89, 0.92), accent = rgb(0.169, 0.247, 0.796), fill = rgb(0.957, 0.961, 0.976), white = rgb(1, 1, 1);
  const bad = rgb(0.769, 0.169, 0.227), ok = rgb(0.055, 0.471, 0.263);

  if (c.logo) { try { const b = dataURLBytes(c.logo); logo = c.logo.startsWith('data:image/png') ? await doc.embedPng(b) : await doc.embedJpg(b); } catch (e) { logo = null; } }
  const tw = (s, f, size) => f.widthOfTextAtSize(s, size);
  const fit = (s, f, size, maxW) => {
    s = winAnsi(s);
    if (tw(s, f, size) <= maxW) return s;
    while (s.length > 1 && tw(s + '…', f, size) > maxW) s = s.slice(0, -1);
    return s + '…';
  };
  const totalW = rep.columns.reduce((a, col) => a + (col.w || 1), 0);
  const colW = rep.columns.map((col) => ((col.w || 1) / totalW) * avail);
  let page, y;
  const newPage = () => { page = doc.addPage([PW, PH]); y = PH - M; page.drawRectangle({ x: 0, y: PH - 5, width: PW, height: 5, color: accent }); };
  const drawRow = (vals, { f = font, size = 8.5, h = 17, bg = null, colorFor = null } = {}) => {
    if (bg) page.drawRectangle({ x: M, y: y - h, width: avail, height: h, color: bg });

      }

  const tableHeader = () => { drawRow(rep.columns.map((c2) => c2.label.toUpperCase()), { f: bold, size: 7.2, h: 20, bg: fill, colorFor: () => ink3 }); };

  newPage();

  if (logo) { const s = 36 / logo.height; page.drawImage(logo, { x: hx, y: y - 38, width: logo.width * s, height: 36 }); hx += logo.width * s + 12; }
  page.drawText(fit(c.name, bold, 16, avail - 200), { x: hx, y: y - 16, size: 16, font: bold, color: ink });
  page.drawText(fit(`${rep.title} · ${rep.periodLabel}`, font, 10.5, avail - 200), { x: hx, y: y - 33, size: 10.5, font, color: ink2 });
  const gen = winAnsi(`Gerado em ${fmtDateTime(Date.now())}`);
  page.drawText(gen, { x: PW - M - tw(gen, font, 8.5), y: y - 14, size: 8.5, font, color: ink3 });
  page.drawText('Quitaí', { x: PW - M - tw('Quitaí', bold, 10.5), y: y - 30, size: 10.5, font: bold, color: accent });
  y -= 54;
  if (rep.summary.length) {
    const n = rep.summary.length, gap = 8, bw = (avail - gap * (n - 1)) / n;
    rep.summary.forEach((s, i) => {
      const x = M + i * (bw + gap);
      page.drawRectangle({ x, y: y - 46, width: bw, height: 46, color: white, borderColor: line, borderWidth: 0.8 });
      page.drawText(fit(s.label, font, 8, bw - 16), { x: x + 9, y: y - 16, size: 8, font, color: ink3 });
      page.drawText(fit(s.value, bold, 13, bw - 16), { x: x + 9, y: y - 35, size: 13, font: bold, color: ink });

  tableHeader();

    drawRow(vals, { colorFor: (i) => (i === statusIdx ? (row.status === 'Em atraso' ? bad : row.status === 'Pago' ? ok : null) : null) });
    page.drawLine({ start: { x: M, y }, end: { x: M + avail, y }, thickness: 0.5, color: line });
  });
  if (!rep.rows.length) { page.drawText('Nenhum registro no período.', { x: M + 4, y: y - 18, size: 10, font, color: ink3 }); y -= 26; }
  else if (rep.totals) {
    if (y - 20 < M + 22) { newPage(); y -= 8; tableHeader(); }
    drawRow(rep.columns.map((col) => (rep.totals[col.key] != null ? fmtCell(rep.totals[col.key], col.type) : '')), { f: bold, h: 20, bg: fill });
  }
  const pages = doc.getPages();
  pages.forEach((p, i) => {
    const left = fit(`${c.name} · ${rep.title}`, font, 7.5, avail - 120);
    p.drawText(left, { x: M, y: 20, size: 7.5, font, color: ink3 });
    const right = winAnsi(`Página ${i + 1} de ${pages.length}`);
    p.drawText(right, { x: PW - M - tw(right, font, 7.5), y: 20, size: 7.5, font, color: ink3 });
  });
  return doc.save();
}

async function pdfKit(c, { title, subtitle = '', landscape = false }) {
  const L = await loadLib('pdf');
  const { PDFDocument, StandardFonts, rgb } = L;
  const doc = await PDFDocument.create();
  doc.setTitle(winAnsi(`${title} · ${c.name}`));

  doc.setCreator('Quitaí');

  const font = await doc.embedFont(StandardFonts.Helvetica);
  const bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const PW = landscape ? 841.89 : 595.28, PH = landscape ? 595.28 : 841.89, M = 40;
  const C = { ink: rgb(0.07, 0.08, 0.13), ink2: rgb(0.29, 0.32, 0.4), ink3: rgb(0.4, 0.43, 0.51), line: rgb(0.88, 0.89, 0.92), accent: rgb(0.169, 0.247, 0.796), fill: rgb(0.957, 0.961, 0.976), white: rgb(1, 1, 1), bad: rgb(0.769, 0.169, 0.227), ok: rgb(0.055, 0.471, 0.263) };
  let logo = null;
  if (c.logo) { try { const b = dataURLBytes(c.logo); logo = c.logo.startsWith('data:image/png') ? await doc.embedPng(b) : await doc.embedJpg(b); } catch (e) { logo = null; } }
  const K = { doc, font, bold, PW, PH, M, avail: PW - 2 * M, C, page: null, y: 0, logo, rgb };
  K.tw = (s, f, size) => f.widthOfTextAtSize(s, size);
  K.fit = (s, f, size, maxW) => { s = winAnsi(s); if (K.tw(s, f, size) <= maxW) return s; while (s.length > 1 && K.tw(s + '…', f, size) > maxW) s = s.slice(0, -1); return s + '…'; };
  K.wrap = (s, f, size, maxW) => {
    const out = [];
    for (const para of winAnsi(s).split(/ {2,}|\n/)) {
      let line = '';
      for (const w of para.split(' ')) { const t = line ? line + ' ' + w : w; if (K.tw(t, f, size) <= maxW) line = t; else { if (line) out.push(line); line = K.tw(w, f, size) > maxW ? K.fit(w, f, size, maxW) : w; } }
      out.push(line);
    }
    return out;
  };
  K.newPage = () => { K.page = doc.addPage([PW, PH]); K.y = PH - M; K.page.drawRectangle({ x: 0, y: PH - 5, width: PW, height: 5, color: C.accent }); };
  K.ensure = (h) => { if (K.y - h < M + 22) { K.newPage(); K.y -= 6; } };
  K.header = () => {
    K.newPage();
    let hx = M;
    if (logo) { const s = 36 / logo.height; K.page.drawImage(logo, { x: hx, y: K.y - 38, width: logo.width * s, height: 36 }); hx += logo.width * s + 12; }
    K.page.drawText(K.fit(c.name, bold, 16, K.avail - 190), { x: hx, y: K.y - 16, size: 16, font: bold, color: C.ink });
    K.page.drawText(K.fit(subtitle ? `${title} · ${subtitle}` : title, font, 10.5, K.avail - 190), { x: hx, y: K.y - 33, size: 10.5, font, color: C.ink2 });
    const gen = winAnsi(`Gerado em ${fmtDateTime(Date.now())}`);
    K.page.drawText(gen, { x: PW - M - K.tw(gen, font, 8.5), y: K.y - 14, size: 8.5, font, color: C.ink3 });
    K.page.drawText('Quitaí', { x: PW - M - K.tw('Quitaí', bold, 10.5), y: K.y - 30, size: 10.5, font: bold, color: C.accent });
    K.y -= 56;
  };
  K.text = (s, { f = font, size = 10, color = C.ink2, gap = 4.5, x = M, maxW = K.avail } = {}) => {
    for (const l of K.wrap(s, f, size, maxW)) { K.ensure(size + gap); K.page.drawText(l, { x, y: K.y - size, size, font: f, color }); K.y -= size + gap; }
  };
  K.heading = (s) => { K.ensure(34); K.y -= 10; K.page.drawText(winAnsi(s), { x: M, y: K.y - 12, size: 12, font: bold, color: C.ink }); K.y -= 22; };
  K.bullets = (items, { color = C.ink2 } = {}) => {
    for (const it of items) {
      const lines = K.wrap(it, font, 10, K.avail - 14);
      lines.forEach((l, i) => { K.ensure(14.5); if (i === 0) K.page.drawCircle({ x: M + 3, y: K.y - 6.5, size: 1.8, color: C.accent }); K.page.drawText(l, { x: M + 12, y: K.y - 10, size: 10, font, color }); K.y -= 14.5; });
      K.y -= 2;
    }
  };
  K.kpis = (items) => {
    const n = items.length, gap = 8, bw = (K.avail - gap * (n - 1)) / n;
    K.ensure(54);
    items.forEach((s, i) => {
      const x = M + i * (bw + gap);
      K.page.drawRectangle({ x, y: K.y - 46, width: bw, height: 46, color: C.white, borderColor: C.line, borderWidth: 0.8 });
      K.page.drawText(K.fit(s.label, font, 8, bw - 16), { x: x + 9, y: K.y - 16, size: 8, font, color: C.ink3 });
      K.page.drawText(K.fit(s.value, bold, 13, bw - 16), { x: x + 9, y: K.y - 35, size: 13, font: bold, color: s.tone === 'bad' ? C.bad : s.tone === 'ok' ? C.ok : C.ink });
    });
    K.y -= 60;
  };
  K.table = (cols, rows, { totals = null, colorFor = null } = {}) => {
    const totalW = cols.reduce((a, col) => a + (col.w || 1), 0);
    const cw = cols.map((col) => ((col.w || 1) / totalW) * K.avail);
    const drawRow = (vals, { f = font, size = 8.5, h = 17, bg = null, cf = null } = {}) => {
      if (bg) K.page.drawRectangle({ x: M, y: K.y - h, width: K.avail, height: h, color: bg });
      let x = M;
      cols.forEach((col, i) => {
        const v = vals[i];
        if (v != null && v !== '') { const t = K.fit(String(v), f, size, cw[i] - 8); const tx = col.align === 'right' ? x + cw[i] - 4 - K.tw(t, f, size) : x + 4; K.page.drawText(t, { x: tx, y: K.y - h / 2 - size * 0.35, size, font: f, color: (cf && cf(i)) || C.ink }); }
        x += cw[i];
      });
      K.y -= h;
    };
    const head = () => drawRow(cols.map((col) => col.label.toUpperCase()), { f: bold, size: 7.2, h: 20, bg: C.fill, cf: () => C.ink3 });
    K.ensure(40);
    head();
    rows.forEach((r, ri) => {
      if (K.y - 17 < M + 22) { K.newPage(); K.y -= 6; head(); }
      drawRow(r, { cf: colorFor ? (i) => colorFor(ri, i) : null });
      K.page.drawLine({ start: { x: M, y: K.y }, end: { x: M + K.avail, y: K.y }, thickness: 0.5, color: C.line });
    });
    if (!rows.length) { K.page.drawText('Nada para mostrar.', { x: M + 4, y: K.y - 14, size: 9.5, font, color: C.ink3 }); K.y -= 22; }

    K.y -= 6;
  };
  K.footer = (left) => {
    const pages = doc.getPages();
    pages.forEach((p, i) => {
      p.drawText(K.fit(left, font, 7.5, K.avail - 120), { x: M, y: 20, size: 7.5, font, color: C.ink3 });
      const r = winAnsi(`Página ${i + 1} de ${pages.length}`);
      p.drawText(r, { x: PW - M - K.tw(r, font, 7.5), y: 20, size: 7.5, font, color: C.ink3 });
    });
  };
  return K;
}

/* volta da Stripe: espera o aviso de pagamento chegar e atualiza a tela */

    if (r.error) { await Cloud.sb.auth.signOut().catch(() => {}); leaveCloud(); firstRender(''); toast(r.error, { type: 'warn', timeout: 9000 }); return; }

  });
  window.addEventListener('pagehide', () => { if (Cloud.on) { if (Cloud.t) flushCloudSave(); } else flushLocal(); });
  window.addEventListener('beforeunload', (e) => { if (Cloud.on && (Cloud.t || Cloud.saving)) { flushCloudSave(); e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('storage', (e) => {
    if (Cloud.on || e.key !== LS_KEY || !e.newValue) return;
    try {
      const d = JSON.parse(e.newValue);
      if (validDB(d) && (d.savedAt || 0) > (DB.savedAt || 0)) { DB = migrate(d); onExternalData(); }
    } catch (err) { /* ignora */ }
  });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();
</script>
