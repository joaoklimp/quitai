/* ============================================================
   Armazenamento: navegador (localStorage) sempre como cache,
   e nuvem (db privado do visitante) quando disponível.
   ============================================================ */
const LS_KEY = 'quitai:data:v1';
const SS_ROUTE = 'quitai:route:v1';
const CHUNK = 60000;
let DB = null;
const Sync = { state: 'memory', cloud: null, lastHashes: [], writing: false, pending: false, tLocal: null, tCloud: null, localOk: false, retry: 0, perm: 'unknown', initTried: false };

function emptyDB() {
  return { schema: APP.schema, savedAt: 0, users: {}, companies: {}, session: { email: null, realEmail: null }, meta: { demoId: null, theme: 'system' } };
}
function validDB(d) { return !!(d && typeof d === 'object' && d.users && typeof d.users === 'object' && d.companies && typeof d.companies === 'object' && d.session); }
function lsGet(k, store = 'local') { try { return (store === 'local' ? window.localStorage : window.sessionStorage).getItem(k); } catch (e) { return null; } }
function lsSet(k, v, store = 'local') { try { (store === 'local' ? window.localStorage : window.sessionStorage).setItem(k, v); return true; } catch (e) { return false; } }
function lsProbe() { try { const k = '__quitai_probe'; window.localStorage.setItem(k, '1'); window.localStorage.removeItem(k); return true; } catch (e) { return false; } }
function loadLocal() {
  const s = lsGet(LS_KEY);
  if (!s) return null;
  try { const d = JSON.parse(s); return validDB(d) ? d : null; } catch (e) { return null; }
}

/* migração leve: garante campos novos em dados antigos */
function migrate(d) {
  d.schema = APP.schema;
  d.meta = Object.assign({ demoId: null, theme: 'system' }, d.meta || {});
  d.session = Object.assign({ email: null, realEmail: null }, d.session || {});
  for (const c of Object.values(d.companies)) {
    c.clients = Array.isArray(c.clients) ? c.clients : [];
    c.charges = Array.isArray(c.charges) ? c.charges : [];
    c.activity = Array.isArray(c.activity) ? c.activity : [];
    c.invoices = Array.isArray(c.invoices) ? c.invoices : [];
    c.queueDone = c.queueDone && typeof c.queueDone === 'object' ? c.queueDone : {};
    c.seq = Object.assign({ charge: c.charges.length + 1 }, c.seq || {});
    c.onboarding = Object.assign({ dismissed: false, templates: false, exported: false }, c.onboarding || {});
    c.settings = Object.assign(defaultSettings(), c.settings || {});
    c.settings.notify = Object.assign({ email: false, pix: false, wa: false }, c.settings.notify || {});
    c.settings.fees = Object.assign({ on: false, fine: 200, interest: 100 }, c.settings.fees || {});
    if (!Array.isArray(c.settings.regua)) c.settings.regua = deepCopy(DEFAULT_REGUA);
    if (c.settings.tplReminder === LEGACY_TPL.reminder) c.settings.tplReminder = DEFAULT_TPL.reminder;
    if (c.settings.tplOverdue === LEGACY_TPL.overdue) c.settings.tplOverdue = DEFAULT_TPL.overdue;
    c.billing = Object.assign({ status: 'trial', trialEndsAt: addDays(todayISO(), TRIAL_DAYS), currentPeriodEnd: null, method: null, canceledAt: null, cycle: 'mensal' }, c.billing || {});
    if (c.billing.cycle !== 'anual') c.billing.cycle = 'mensal';
    if (!PLANS[c.plan]) c.plan = 'pro';
    if (!SEGMENTS[c.segment]) c.segment = 'servicos';
    for (const k of ['recurrences', 'agreements', 'reconLog', 'cardAudits', 'closings']) if (!Array.isArray(c[k])) c[k] = [];
    if (!c.bankSeen || typeof c.bankSeen !== 'object') c.bankSeen = {};
    if (c.cardRates && typeof c.cardRates === 'object') c.cardRates = Object.assign({}, DEFAULT_CARD_RATES, c.cardRates); else c.cardRates = null;
    c.ai = Object.assign({ month: '', used: 0 }, c.ai || {});
    for (const ch of c.charges) { ch.log = Array.isArray(ch.log) ? ch.log : []; ch.contacts = ch.contacts || 0; }
  }
  return d;
}

function save() {
  if (!DB) return;
  DB.savedAt = Date.now();
  if (Cloud.on) { cloudSave(); return; }
  clearTimeout(Sync.tLocal);
  Sync.tLocal = setTimeout(flushLocal, 150);
  if (Sync.cloud) {
    clearTimeout(Sync.tCloud);
    Sync.tCloud = setTimeout(flushCloud, 1200);
    setSyncState('saving');
  } else if (!Sync.initTried && Sync.perm === 'prompt' && me()) ensureCloud();
}
function flushLocal() {
  clearTimeout(Sync.tLocal);
  Sync.tLocal = null;
  if (!DB || Cloud.on) return;
  const ok = lsSet(LS_KEY, JSON.stringify(DB));
  Sync.localOk = ok;
  if (!Sync.cloud) setSyncState(ok ? 'local' : 'memory');
}

async function flushCloud() {
  clearTimeout(Sync.tCloud);
  Sync.tCloud = null;
  if (!Sync.cloud || !DB) return;
  if (Sync.writing) { Sync.pending = true; return; }
  Sync.writing = true;
  try {
    const json = JSON.stringify(DB);
    const chunks = [];
    for (let i = 0; i < json.length; i += CHUNK) chunks.push(json.slice(i, i + CHUNK));
    if (!chunks.length) chunks.push('');
    const hashes = chunks.map(fnv);
    const { db, base } = Sync.cloud;
    for (let i = 0; i < chunks.length; i++) {
      if (Sync.lastHashes[i] !== hashes[i]) await db.doc(base + '/chunk-' + i).set({ i, s: chunks[i] });
    }
    await db.doc(base + '/meta').set({ schema: APP.schema, savedAt: DB.savedAt, n: chunks.length, hashes, app: APP.version });
    for (let i = chunks.length; i < Sync.lastHashes.length; i++) {
      try { await db.doc(base + '/chunk-' + i).delete(); } catch (e) { /* ignora */ }
    }
    Sync.lastHashes = hashes;
    Sync.retry = 0;
    setSyncState('cloud');
  } catch (e) {
    const code = e && e.code;
    if (['invalid_argument', 'not_granted', 'revoked', 'capability_disabled', 'capability_removed', 'transform_error'].includes(code)) {
      Sync.cloud = null;
      setSyncState(Sync.localOk ? 'local' : 'memory');
    } else if (code === 'quota_exceeded') {
      Sync.cloud = null;
      setSyncState(Sync.localOk ? 'local' : 'memory');
      toast('O espaço na nuvem acabou. Seus dados continuam salvos neste navegador; exporte um backup em Configurações.', { type: 'warn', timeout: 9000 });
    } else {
      setSyncState('error');
      Sync.retry = Math.min(Sync.retry + 1, 6);
      setTimeout(() => { if (Sync.cloud) flushCloud(); }, 3000 * Sync.retry + Math.random() * 1500);
    }
  } finally {
    Sync.writing = false;
    if (Sync.pending) { Sync.pending = false; setTimeout(flushCloud, 50); }
  }
}

/* A permissão da nuvem é pedida só depois de uma ação da pessoa (entrar, criar conta,
   abrir a demonstração ou salvar algo), nunca ao abrir a página. */
async function cloudPermState() {
  const C = window.claude;
  if (!C || typeof C.use !== 'function') return 'unavailable';
  let p = null;
  try { p = await C.use('permissions'); } catch (e) { p = null; }
  if (!p || typeof p.state !== 'function') return 'unknown';
  try {
    const m = (await p.state()) || {};
    const db = m.db || 'unavailable', us = m.user || 'unavailable';
    if (db === 'unavailable' || db === 'denied') return db;
    if (us === 'denied') return 'denied';
    if (db === 'prompt' || us === 'prompt') return 'prompt';
    return 'granted';
  } catch (e) { return 'unknown'; }
}
async function bootCloud() {
  Sync.perm = await cloudPermState();
  if (Sync.initTried) return;
  if (Sync.perm === 'granted' || Sync.perm === 'unknown') { Sync.initTried = true; await initCloud(); }
}
function ensureCloud(maxWait = 20000) {
  if (Sync.cloud || Sync.initTried || (Sync.perm !== 'prompt' && Sync.perm !== 'unknown')) return Promise.resolve();
  Sync.initTried = true;
  return Promise.race([initCloud(), new Promise((r) => setTimeout(r, maxWait))]);
}
async function initCloud() {
  const C = window.claude;
  if (!C || typeof C.use !== 'function') return;
  let db = null, user = null;
  try { [db, user] = await Promise.all([C.use('db'), C.use('user')]); } catch (e) { return; }
  if (!db || !user) return;
  let id = null;
  try { id = await user.id(); } catch (e) { id = null; }
  if (!id) return;
  const base = 'data/users/' + id;
  let meta;
  try { meta = await db.doc(base + '/meta').get(); } catch (e) { return; }
  Sync.cloud = { db, base };
  try {
    if (meta && meta.exists) {
      const m = meta.data() || {};
      const n = m.n | 0;
      const hashes = Array.isArray(m.hashes) ? m.hashes : [];
      const snaps = await Promise.all(range(n).map((i) => db.doc(base + '/chunk-' + i).get()));
      const parts = snaps.map((s) => (s && s.exists ? String((s.data() || {}).s || '') : null));
      const consistent = n > 0 && parts.every((p, i) => p !== null && fnv(p) === hashes[i]);
      if (consistent) {
        Sync.lastHashes = hashes.slice();
        let remote = null;
        try { remote = JSON.parse(parts.join('')); } catch (e) { remote = null; }
        if (validDB(remote) && (remote.savedAt || 0) > (DB.savedAt || 0)) {
          DB = migrate(remote);
          flushLocal();
          setSyncState('cloud');
          onExternalData();
          return;
        }
      }
    }
    if (Object.keys(DB.users).length) await flushCloud();
    else setSyncState('cloud');
  } catch (e) {
    setSyncState(Sync.localOk ? 'local' : 'memory');
  }
}

/* monta o DB em memória a partir do servidor */
function applyServerBilling(c, row) {
  c.plan = PLANS[row.plan] ? row.plan : 'pro';
  c.billing = {
    status: row.billing_status === 'past_due' ? 'active' : row.billing_status,
    pastDue: row.billing_status === 'past_due',
    trialEndsAt: row.trial_ends_at, currentPeriodEnd: row.current_period_end || null,
    method: row.billing_status === 'trial' ? null : 'cartao', canceledAt: row.canceled_at ? Date.parse(row.canceled_at) : null,
    cycle: row.billing_cycle === 'anual' ? 'anual' : 'mensal', hasSub: !!row.stripe_subscription_id,
    complimentary: !!row.complimentary,
  };
  c.invoices = Array.isArray(row.invoices) ? row.invoices : [];
}
async function cloudLoad() {
  const sb = Cloud.sb;
  const { data: auth } = await sb.auth.getUser();
  const user = auth && auth.user;
  if (!user) return { error: 'Sua sessão terminou. Entre de novo.' };
  let { data: m } = await sb.from('members').select('*').eq('user_id', user.id).maybeSingle();
  if (!m) {
    // primeiro acesso depois do cadastro: cria a empresa com o que a pessoa preencheu
    const md = user.user_metadata || {};
    const { error } = await sb.rpc('create_company', { p_name: md.company || 'Minha empresa', p_owner_name: md.name || '', p_plan: md.plan || 'pro', p_segment: md.segment || 'servicos' });
    if (error && !/already_member/.test(error.message)) return { error: 'Não conseguimos criar a sua empresa agora. Tente de novo em instantes.' };
    ({ data: m } = await sb.from('members').select('*').eq('user_id', user.id).maybeSingle());
    if (!m) return { error: 'Não encontramos a empresa desta conta.' };
  }
  if (!m.active) return { error: 'Seu acesso foi desativado. Fale com o responsável pela empresa.' };
  const { data: row } = await sb.from('companies').select('*').eq('id', m.company_id).maybeSingle();
  if (!row) return { error: 'O acesso de equipe não está disponível no plano atual da empresa. Peça ao proprietário para mudar para o plano Empresa.' };
  const { data: people } = await sb.from('members').select('*').eq('company_id', m.company_id);
  const d = row.data || {};
  const c = Object.assign(newCompany({ name: d.name || 'Minha empresa', email: d.email || user.email, plan: row.plan, segment: d.segment }), d);
  c.id = row.id;
  c.cloud = true;
  c.isDemo = false;
  c.createdAt = Date.parse(row.created_at) || Date.now();
  applyServerBilling(c, row);
  const db = emptyDB();
  db.companies[c.id] = c;
  for (const p of people || [m]) {
    db.users[p.email] = { id: p.user_id, name: p.name, email: p.email, companyId: c.id, role: p.role, active: p.active, mustChange: p.must_change, lastLoginAt: p.last_login_at ? Date.parse(p.last_login_at) : null, createdAt: Date.parse(p.created_at) || null, theme: lsGet(themeKey(p.user_id)) || 'system' };
  }
  db.session = { email: m.email, realEmail: null };
  db.savedAt = Date.now();
  const adm = await sb.rpc('is_platform_admin');
  Cloud.isAdmin = adm.data === true;
  DB = migrate(db);
  clearTimeout(Cloud.t);
  Object.assign(Cloud, { on: true, userId: user.id, companyId: c.id, version: row.version, updatedAt: row.updated_at, pending: false, retry: 0, t: null });
  setSyncState('cloud');
  return { ok: true, user: DB.users[m.email] };
}
/* volta para o modo deste navegador (demonstração) */
function leaveCloud() {
  clearTimeout(Cloud.t);
  Object.assign(Cloud, { on: false, userId: null, companyId: null, version: 0, pending: false, t: null, isAdmin: false });
  ui.admin = null;

/* neste navegador só a demonstração pode ficar logada */
function localSessionOk() {
  const u = DB.session.email ? DB.users[DB.session.email] : null;
  const c = u ? DB.companies[u.companyId] : null;
  return !!(c && c.isDemo);
}
function companyPayload(c) {
  const out = {};
  for (const [k, v] of Object.entries(c)) if (!SERVER_KEYS.includes(k)) out[k] = v;
  return out;
}
function cloudSave() {
  if (!Cloud.on) return;
  clearTimeout(Cloud.t);
  Cloud.t = setTimeout(flushCloudSave, 900);
  setSyncState('saving');
}
async function flushCloudSave() {
  clearTimeout(Cloud.t);
  Cloud.t = null;
  if (!Cloud.on) return;
  const c = DB.companies[Cloud.companyId];
  const u = realUser();
  if (!c || !u || u.role === 'leitura') { setSyncState('cloud'); return; }
  if (Cloud.saving) { Cloud.pending = true; return; }
  Cloud.saving = true;
  try {
    const { data, error } = await Cloud.sb.rpc('save_company', { p_data: companyPayload(c), p_version: Cloud.version });
    if (error) throw error;
    Cloud.version = data;
    Cloud.retry = 0;
    setSyncState('cloud');
  } catch (e) {
    const msg = String((e && e.message) || '');
    const why = ['conflict', 'locked', 'client_limit', 'read_only', 'no_access'].find((k) => msg.includes(k));
    if (why) {
      Cloud.pending = false;
      await cloudReload();
      toast({
        conflict: 'Outra pessoa da equipe mudou os dados agora há pouco. Atualizamos a tela. Confira se a sua última alteração entrou.',
        locked: 'O painel está em modo leitura porque o teste ou a assinatura terminou. A última alteração não foi salva.',
        client_limit: 'Você chegou ao limite de clientes do seu plano. A última alteração não foi salva.',
        read_only: 'Seu acesso é só de leitura. A alteração não foi salva.',
        no_access: 'Seu acesso a esta empresa mudou. Entre de novo.',
      }[why], { type: 'warn', timeout: 9000 });
    } else {
      setSyncState('error');
      Cloud.retry = Math.min(Cloud.retry + 1, 6);
      clearTimeout(Cloud.t);
      Cloud.t = setTimeout(flushCloudSave, 3000 * Cloud.retry);
    }
  } finally {
    Cloud.saving = false;
    if (Cloud.pending) { Cloud.pending = false; setTimeout(flushCloudSave, 50); }
  }
}
async function cloudReload() {
  if (!Cloud.on) return;
  const route = Object.assign({}, ui.route);
  const sess = Object.assign({}, DB.session);
  const r = await cloudLoad();
  if (r.error) { await cloudSignOut(); toast(r.error, { type: 'warn', timeout: 9000 }); return; }
  if (sess.realEmail && DB.users[sess.email]) DB.session = sess;
  runMaintenance();
  if (!modalStack.length) { ui.route = route; render(); }
}
/* confere de tempos em tempos se a assinatura ou os dados mudaram no servidor */
async function cloudPoll() {
  if (!Cloud.on || Cloud.saving || Cloud.t || document.visibilityState === 'hidden') return;
  const { data: row } = await Cloud.sb.from('companies').select('version,updated_at,plan,billing_status,billing_cycle,trial_ends_at,current_period_end,canceled_at,invoices,stripe_subscription_id,complimentary').eq('id', Cloud.companyId).maybeSingle();
  if (!row || !Cloud.on) return;
  if (row.version !== Cloud.version) { if (!Cloud.t && !Cloud.saving) await cloudReload(); return; }
  if (row.updated_at !== Cloud.updatedAt) {
    Cloud.updatedAt = row.updated_at;
    const c = DB.companies[Cloud.companyId];
    applyServerBilling(c, row);
    if (!modalStack.length) refreshPage(false);
    return true;
  }
  return false;
}
async function cloudSignOut() {
  try { if (Cloud.sb) await Cloud.sb.auth.signOut(); } catch (e) { /* ignora */ }

/* ============================================================
   Regras de negócio: contas, empresas, clientes, cobranças,
   status, multa e juros, mensalidades automáticas, acordos,
   pontualidade, métricas, mensagens e fila de cobrança.
   ============================================================ */
function me() { return DB && DB.session.email ? DB.users[DB.session.email] || null : null; }
function co() { const u = me(); return u ? DB.companies[u.companyId] || null : null; }
function realUser() { return DB.session.realEmail ? DB.users[DB.session.realEmail] || me() : me(); }
function isImpersonating() { return !!DB.session.realEmail; }
function planOf(c = co()) { return PLANS[c && c.plan] || PLANS.basico; }
function planHas(f, c = co()) { return !!(c && planOf(c).features[f]); }
function clientLimit(c = co()) { return planOf(c).clients; }
function usersOf(c) { return Object.values(DB.users).filter((u) => u.companyId === c.id); }
function userById(id) { return Object.values(DB.users).find((u) => u.id === id) || null; }
function numStr(n) { return String(n).padStart(4, '0'); }
function clientById(c, id) { return c.clients.find((x) => x.id === id) || null; }
function chargeById(c, id) { return c.charges.find((x) => x.id === id) || null; }
function isOpen(ch) { return ch.status === 'pendente' || ch.status === 'atrasado'; }

function defaultSettings() {

/* ---------- assinatura ---------- */
function cycleMonths(cy) { return cy === 'anual' ? 12 : 1; }
function planCharge(planId, cy) { const p = PLANS[planId] || PLANS.basico; return cy === 'anual' ? p.annualMonthly * 12 : p.price; }
function planMonthly(planId, cy) { const p = PLANS[planId] || PLANS.basico; return cy === 'anual' ? p.annualMonthly : p.price; }
function billingState(c = co()) {
  const b = c.billing, t = todayISO();
  if (b.status === 'trial') { const left = diffDays(b.trialEndsAt, t); return left >= 0 ? { kind: 'trial', left } : { kind: 'trial-ended' }; }
  if (b.status === 'canceled') return b.currentPeriodEnd && b.currentPeriodEnd > t ? { kind: 'canceled-active', until: b.currentPeriodEnd } : { kind: 'canceled-ended' };
  return { kind: 'active', next: b.currentPeriodEnd };
}
function isLocked(c = co()) { const k = billingState(c).kind; return k === 'trial-ended' || k === 'canceled-ended'; }
function renewSubscriptions(c) {
  const b = c.billing, t = todayISO();
  if (c.cloud || b.status !== 'active' || !b.currentPeriodEnd) return;
  const cy = b.cycle === 'anual' ? 'anual' : 'mensal';
  let guard = 0;
  while (b.currentPeriodEnd <= t && guard++ < 36) {
    const start = b.currentPeriodEnd;
    b.currentPeriodEnd = addMonths(start, cycleMonths(cy));
    c.invoices.unshift({ id: uid('inv_'), date: start, desc: `Plano ${planOf(c).name} · ${cy}`, amount: planCharge(c.plan, cy), status: 'paga', method: b.method || 'pix' });
  }
}
function subscribe(c, planId, method, cycle = 'mensal') {
  const t = todayISO();
  const st = billingState(c).kind;
  c.plan = planId;
  c.billing.method = method;
  c.billing.canceledAt = null;
  if (st === 'active' || st === 'canceled-active') { c.billing.status = 'active'; return false; }
  c.billing.status = 'active';
  c.billing.cycle = cycle === 'anual' ? 'anual' : 'mensal';
  c.billing.currentPeriodEnd = addMonths(t, cycleMonths(c.billing.cycle));
  c.invoices.unshift({ id: uid('inv_'), date: t, desc: `Plano ${PLANS[planId].name} · ${c.billing.cycle}`, amount: planCharge(planId, c.billing.cycle), status: 'paga', method });
  return true;
}

/* ---------- análises com IA (cota mensal do plano) ---------- */
function aiMonthKey() { return todayISO().slice(0, 7); }
function aiUsed(c = co()) { return c && c.ai && c.ai.month === aiMonthKey() ? c.ai.used | 0 : 0; }
function aiQuota(c = co()) { return planOf(c).ai; }
function aiLeft(c = co()) { return Math.max(0, aiQuota(c) - aiUsed(c)); }
function aiSpend(c) { const k = aiMonthKey(); if (!c.ai || c.ai.month !== k) c.ai = { month: k, used: 0 }; c.ai.used++; }

/* ---------- permissões ---------- */
function can(perm) {
  const u = me();
  if (!u) return false;
  const role = ROLES[u.role] || ROLES.leitura;
  const has = role.perms === '*' || role.perms.includes(perm);
  if (!has) return false;
  if (WRITE_PERMS.has(perm) && isLocked()) return false;
  return true;
}
function canWhatsApp() { return planHas('whatsapp') && can('whatsapp'); }

async function createAccount({ name, email, companyName, pass, plan, segment }) {
  const key = email.trim().toLowerCase();
  if (DB.users[key]) return { error: 'Já existe uma conta com este e-mail. Entre com sua senha ou use outro e-mail.' };
  const c = newCompany({ name: companyName.trim(), email: key, plan, segment });

  DB.session = { email: key, realEmail: null };

async function login(email, pass) {
  const key = email.trim().toLowerCase();
  const u = DB.users[key];
  if (!u) return { error: 'E-mail ou senha incorretos.' };
  const h = await hashPass(pass, u.salt);
  if (h !== u.hash) return { error: 'E-mail ou senha incorretos.' };
  const c = DB.companies[u.companyId];
  if (!c) return { error: 'Não encontramos a empresa desta conta.' };
  if (u.active === false) return { error: 'Seu acesso foi desativado. Fale com o responsável pela empresa.' };
  if (u.role !== 'owner' && !planHas('team', c)) return { error: `O acesso de equipe não está disponível no plano atual da ${c.name}. Peça ao proprietário para mudar para o plano Empresa.` };
  u.lastLoginAt = Date.now();
  DB.session = { email: key, realEmail: null };
  save();
  return { ok: true, user: u };
}

/* ---------- clientes ---------- */
function clientStatsMap(c) {
  const m = new Map();
  for (const cl of c.clients) m.set(cl.id, { open: 0, openN: 0, overdue: 0, overdueN: 0, paid: 0, count: 0, oldest: null, lastPaid: null });
  for (const ch of c.charges) {
    const s = m.get(ch.clientId);
    if (!s || ch.status === 'cancelado') continue;
    s.count++;
    if (ch.status === 'pendente') { s.open += ch.amount; s.openN++; }
    else if (ch.status === 'atrasado') { s.overdue += ch.amount; s.overdueN++; if (!s.oldest || ch.due < s.oldest) s.oldest = ch.due; }
    else if (ch.status === 'pago') { s.paid += ch.paidAmount || 0; if (!s.lastPaid || ch.paidAt > s.lastPaid) s.lastPaid = ch.paidAt; }
  }
  return m;
}
function clientSituation(s) { if (!s || !s.count) return 'sem'; return s.overdueN ? 'atraso' : 'emdia'; }
function firstName(cl) {
  if (cl.contact) return cl.contact.trim().split(/\s+/)[0];
  if (cl.kind === 'PJ') return cl.name.trim();
  return cl.name.trim().split(/\s+/)[0];
}
function saveClient(c, data, id) {
  const now = Date.now();
  if (id) {
    const cl = clientById(c, id);
    Object.assign(cl, data, { updatedAt: now });
    logAct(c, 'client', `Atualizou o cadastro de ${cl.name}`, cl.id);
    return cl;
  }
  const cl = Object.assign({ id: uid('cl_'), createdAt: now, updatedAt: now, lastContactAt: null }, data);
  c.clients.push(cl);
  logAct(c, 'client', `Cadastrou o cliente ${cl.name}`, cl.id);
  return cl;
}
function deleteClient(c, id) {
  const cl = clientById(c, id);
  if (!cl) return 0;
  const n = c.charges.filter((x) => x.clientId === id).length;
  c.charges = c.charges.filter((x) => x.clientId !== id);
  c.clients = c.clients.filter((x) => x.id !== id);
  c.recurrences = c.recurrences.filter((r) => r.clientId !== id);
  logAct(c, 'del', `Excluiu o cliente ${cl.name}${n ? ` e ${plural(n, 'cobrança', 'cobranças')}` : ''}`);
  return n;
}

/* ---------- pontualidade ---------- */
const PUNCT = {
  otimo: { label: 'Pontual', cls: 'p-good' },
  medio: { label: 'Às vezes atrasa', cls: 'p-mid' },
  ruim: { label: 'Costuma atrasar', cls: 'p-bad' },
  sem: { label: 'Sem histórico', cls: 'p-none' },
};
function punctualityMap(c) {
  const t = todayISO(), from = addDays(t, -365), g = c.settings.graceDays | 0;
  const m = new Map();
  const get = (id) => { let s = m.get(id); if (!s) { s = { onTime: 0, late: 0, lateDays: 0, overdueNow: 0 }; m.set(id, s); } return s; };
  for (const ch of c.charges) {
    if (ch.due > t || ch.due < from) continue;
    if (ch.status === 'pago' && ch.paidAt) {
      const s = get(ch.clientId);
      const d = diffDays(ch.paidAt, ch.due);
      if (d <= g) s.onTime++; else { s.late++; s.lateDays += d; }
    } else if (isOpen(ch) && diffDays(t, ch.due) > g) get(ch.clientId).overdueNow++;
  }
  const out = new Map();
  for (const cl of c.clients) {
    const s = m.get(cl.id) || { onTime: 0, late: 0, lateDays: 0, overdueNow: 0 };
    const total = s.onTime + s.late + s.overdueNow;
    let level = 'sem', pctV = null;
    if (total >= 2) {
      pctV = Math.round((s.onTime / total) * 100);
      level = pctV >= 90 && !s.overdueNow ? 'otimo' : pctV >= 70 ? 'medio' : 'ruim';
    }
    out.set(cl.id, { level, label: PUNCT[level].label, pct: pctV, onTime: s.onTime, total, avgLate: s.late ? Math.round(s.lateDays / s.late) : 0, overdueNow: s.overdueNow });
  }
  return out;
}

/* ---------- multa e juros ---------- */
function feeRules(c) {
  const f = (c.settings && c.settings.fees) || {};
  return { on: !!f.on, fine: clamp(Math.round(+f.fine || 0), 0, 1000), interest: clamp(Math.round(+f.interest || 0), 0, 1000) };
}
/* valor devido numa data: original + multa + juros proporcionais aos dias de atraso */
function chargeDue(c, ch, t = todayISO()) {
  const base = ch.amount;
  const days = isOpen(ch) ? Math.max(0, diffDays(t, ch.due)) : 0;
  const r = feeRules(c);
  if (!isOpen(ch) || !r.on || ch.noFees || days <= 0 || days <= (c.settings.graceDays | 0)) return { base, fine: 0, interest: 0, total: base, days };
  const fine = Math.round((base * r.fine) / 10000);
  const interest = Math.round((base * r.interest * days) / 300000);
  return { base, fine, interest, total: base + fine + interest, days };
}
function feeExample(c, amount = 10000, days = 10) {
  const r = feeRules(c);
  const fine = Math.round((amount * r.fine) / 10000), interest = Math.round((amount * r.interest * days) / 300000);
  return { fine, interest, total: amount + fine + interest };
}

/* ---------- cobranças ---------- */
function isRecovered(ch) { return ch.status === 'pago' && !!(ch.wasOverdue || ch.recovery || (ch.paidAt && ch.paidAt > ch.due)); }
function daysLate(ch, t = todayISO()) { return diffDays(t, ch.due); }
function newChargeObj(c, { clientId, desc, amount, due, method, notes, group = null, recId = null, by, note = 'Cobrança criada' }) {
  return {
    id: uid('ch_'), num: c.seq.charge++, clientId, desc, amount, due, status: 'pendente', paidAt: null, paidAmount: null, method: method || 'pix',
    wasOverdue: false, lockAuto: false, group, recId, notes: notes || '', createdAt: Date.now(), updatedAt: Date.now(), lastContactAt: null, contacts: 0,
    log: [{ at: Date.now(), by: by || 'auto', from: null, to: 'pendente', note }],
  };
}
function autoLateOnCreate(c, ch) {
  if (c.settings.autoOverdue && diffDays(todayISO(), ch.due) > (c.settings.graceDays | 0)) {

/* ---------- mensalidades automáticas ---------- */
const REC_STATUS = { ativa: { label: 'Ativa', cls: 'st-pago', icon: 'repeat' }, pausada: { label: 'Pausada', cls: 'st-pendente', icon: 'pause' }, encerrada: { label: 'Encerrada', cls: 'st-cancelado', icon: 'ban' } };

/* ---------- acordos ---------- */
function agreementCalc(c, list, { includeFees, discount = 0 }) {

  const fees = includeFees ? sumBy(list, (x) => { const d = chargeDue(c, x, t); return d.fine + d.interest; }) : 0;

}
function createAgreement(c, { clientId, chargeIds, includeFees, discount, n, firstDue, desc, method }) {
  const t = todayISO();

  if (!list.length) return null;
  const calc = agreementCalc(c, list, { includeFees, discount });
  if (calc.total <= 0) return null;
  const by = me().id;
  const ag = { id: uid('ag_'), clientId, chargeIds: list.map((x) => x.id), original: calc.original, fees: calc.fees, discount: calc.discount, total: calc.total, n, firstDue, createdAt: Date.now(), by, newIds: [] };
  const snaps = list.map((ch) => deepCopy(ch));
  for (const ch of list) {
    ch.log.push({ at: Date.now(), by, from: ch.status, to: 'cancelado', note: 'Substituída por acordo' });
    ch.status = 'cancelado'; ch.agreementId = ag.id; ch.updatedAt = Date.now();
  }
  const created = addCharges(c, { clientId, desc, amount: calc.total, due: firstDue, method, kind: n > 1 ? 'parcelada' : 'unica', n, notes: `Acordo de ${fmtDate(t)}: substitui ${list.map((x) => '#' + numStr(x.num)).join(', ')}.`, silent: true });
  created.forEach((ch) => { ch.agreementId = ag.id; ch.recovery = true; });
  ag.newIds = created.map((x) => x.id);
  c.agreements.unshift(ag);
  const cl = clientById(c, clientId);
  const actId = logAct(c, 'deal', `Fez um acordo com ${cl ? cl.name : 'o cliente'}: ${n === 1 ? 'pagamento único' : n + ' parcelas'}, total de ${fmtMoney(calc.total)}`, created[0].id);
  return { ag, created, snaps, actId };
}
function undoAgreement(c, res) {
  const ids = new Set(res.ag.newIds);

  for (const s of res.snaps) { const ch = chargeById(c, s.id); if (ch) { Object.keys(ch).forEach((k) => { if (!(k in s)) delete ch[k]; }); Object.assign(ch, s); } }
  c.agreements = c.agreements.filter((a) => a.id !== res.ag.id);
  c.activity = c.activity.filter((a) => a.id !== res.actId);
}

/* ---------- métricas ---------- */
function metrics(c) {
  const t = todayISO(), mk = t.slice(0, 7);
  const prevStart = addMonths(monthStart(t), -1);
  const prevEnd = monthEnd(prevStart);
  let prevCut = addDays(prevStart, +t.slice(8, 10) - 1);
  if (prevCut > prevEnd) prevCut = prevEnd;
  const d90 = addDays(t, -90);
  const fees = feeRules(c).on;
  const r = { open: 0, openN: 0, open7: 0, open7N: 0, overdue: 0, overdueUpd: 0, overdueN: 0, odClients: 0, recv: 0, recvN: 0, recov: 0, recovN: 0, prevRecv: 0, recov90: 0, prevKey: prevStart.slice(0, 7) };
  const od = new Set();
  for (const ch of c.charges) {
    if (ch.status === 'pendente') {
      r.open += ch.amount; r.openN++;
      const d = diffDays(ch.due, t);
      if (d <= 7) { r.open7 += ch.amount; r.open7N++; }
    } else if (ch.status === 'atrasado') {
      r.overdue += ch.amount; r.overdueN++; od.add(ch.clientId);
      r.overdueUpd += fees ? chargeDue(c, ch, t).total : ch.amount;
    } else if (ch.status === 'pago' && ch.paidAt) {
      const amt = ch.paidAmount || 0;
      if (ch.paidAt.slice(0, 7) === mk) { r.recv += amt; r.recvN++; if (isRecovered(ch)) { r.recov += amt; r.recovN++; } }
      else if (ch.paidAt >= prevStart && ch.paidAt <= prevCut) r.prevRecv += amt;
      if (ch.paidAt >= d90 && isRecovered(ch)) r.recov90 += amt;
    }
  }
  r.odClients = od.size;
  r.recoveryRate = r.recov90 + r.overdue > 0 ? Math.round((r.recov90 / (r.recov90 + r.overdue)) * 100) : null;
  r.delta = r.prevRecv > 0 ? Math.round(((r.recv - r.prevRecv) / r.prevRecv) * 100) : null;
  return r;
}
function receivedByMonth(c, n = 6) {
  const t = todayISO();
  const keys = [];
  for (let i = n - 1; i >= 0; i--) keys.push(addMonths(monthStart(t), -i).slice(0, 7));
  const map = Object.fromEntries(keys.map((k) => [k, { total: 0, count: 0, recovered: 0 }]));
  for (const ch of c.charges) {
    if (ch.status !== 'pago' || !ch.paidAt) continue;
    const m = map[ch.paidAt.slice(0, 7)];
    if (!m) continue;
    m.total += ch.paidAmount || 0; m.count++;
    if (isRecovered(ch)) m.recovered += ch.paidAmount || 0;
  }
  return keys.map((k) => Object.assign({ key: k, current: k === t.slice(0, 7) }, map[k]));
}

/* Substitui as variáveis. Uma linha com variável vazia some; se a linha de cima for só
   um rótulo terminado em ":" (ex.: "Pix copia e cola:"), ela some junto. */
function fillTemplate(tpl, vars) {
  const out = [];
  for (const line of String(tpl || '').split('\n')) {
    let drop = false, hasVar = false;
    const filled = line.replace(/\{(\w+)\}/g, (m, k) => {
      if (!(k in vars)) return m;
      hasVar = true;
      const v = vars[k];
      if (v == null || v === '') { drop = true; return ''; }
      return String(v);
    });
    if (drop) { const prev = out[out.length - 1]; if (prev && prev.label) out.pop(); continue; }
    out.push({ text: filled, label: !hasVar && /:\s*$/.test(line) });
  }
  return out.map((x) => x.text).join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

}

/* ---------- régua de cobrança ---------- */
function reguaLabel(off) { return off < 0 ? `${-off} ${off === -1 ? 'dia' : 'dias'} antes` : off === 0 ? 'No vencimento' : `${off} ${off === 1 ? 'dia' : 'dias'} depois`; }
function todayQueue(c) {
  const t = todayISO();
  const steps = c.settings.regua.filter((s) => s.on).slice().sort((a, b) => b.offset - a.offset);
  const items = [];
  for (const ch of c.charges) {
    if (!isOpen(ch)) continue;
    const days = diffDays(t, ch.due);
    const step = steps.find((s) => days >= s.offset && days - s.offset <= 2);
    if (!step) continue;
    const key = ch.id + ':' + step.id;
    if (c.queueDone[key]) continue;
    const stepDate = addDays(ch.due, step.offset);
    if (ch.lastContactAt && isoOf(new Date(ch.lastContactAt)) >= stepDate) continue;
    items.push({ ch, step, key, late: days - step.offset });
  }
  return items.sort((a, b) => (a.ch.due < b.ch.due ? -1 : 1));
}
function pruneQueue(c) {
  const lim = Date.now() - 90 * 86400000;
  for (const [k, v] of Object.entries(c.queueDone)) if (typeof v === 'number' && v < lim) delete c.queueDone[k];
  const lim2 = Date.now() - 400 * 86400000;
  for (const [k, v] of Object.entries(c.bankSeen || {})) if (typeof v === 'number' && v < lim2) delete c.bankSeen[k];
}

function searchAll(c, q) {
  const n = norm(q);
  if (!n) return { clients: [], charges: [] };
  const digits = onlyDigits(q);
  const clients = c.clients.filter((cl) => norm(cl.name).includes(n) || norm(cl.email).includes(n) || (digits.length >= 3 && (onlyDigits(cl.doc).includes(digits) || onlyDigits(cl.phone).includes(digits)))).slice(0, 5);
  const numQ = q.trim().replace(/^#/, '');
  const clientName = new Map(c.clients.map((cl) => [cl.id, norm(cl.name)]));
  const charges = c.charges.filter((ch) => (/^\d+$/.test(numQ) && String(ch.num) === String(+numQ)) || norm(ch.desc).includes(n) || (clientName.get(ch.clientId) || '').includes(n)).slice(0, 6);
  return { clients, charges };
}

/* ============================================================
   Pix copia e cola (BR Code estático do Banco Central), QR Code
   e valor por extenso (usado nos recibos).
   ============================================================ */
function crc16(str) {
  let crc = 0xffff;
  for (let i = 0; i < str.length; i++) {
    crc ^= str.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) crc = crc & 0x8000 ? ((crc << 1) ^ 0x1021) & 0xffff : (crc << 1) & 0xffff;
  }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}
function emv(id, v) { return id + String(v.length).padStart(2, '0') + v; }
function pixKeyFormatted(c) {
  const k = String((c && c.pixKey) || '').trim();
  if (!k) return '';
  switch (c.pixType) {
    case 'cpfcnpj': { const d = onlyDigits(k); return d.length === 11 || d.length === 14 ? d : ''; }
    case 'telefone': { const d = onlyDigits(k); if (d.length === 10 || d.length === 11) return '+55' + d; if ((d.length === 12 || d.length === 13) && d.startsWith('55')) return '+' + d; return ''; }
    case 'email': return validEmail(k) ? k.toLowerCase() : '';
    default: return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(k) ? k.toLowerCase() : k.replace(/\s+/g, '').slice(0, 77);
  }
}
/* BR Code estático com valor: 00 formato · 26 conta Pix · 52 MCC · 53 moeda · 54 valor · 58 país · 59 nome · 60 cidade · 62 txid · 63 CRC */
function pixPayload(c, amountCents, txid = '***') {
  const key = pixKeyFormatted(c);
  if (!key) return '';
  const mai = emv('00', 'br.gov.bcb.pix') + emv('01', key);
  if (mai.length > 99) return '';
  const name = asciiText(c.name, 25) || 'RECEBEDOR';
  const city = asciiText(c.city, 15) || 'BRASIL';
  const tx = String(txid || '***') === '***' ? '***' : String(txid).replace(/[^A-Za-z0-9]/g, '').slice(0, 25) || '***';
  let p = emv('00', '01') + emv('26', mai) + emv('52', '0000') + emv('53', '986');
  if (amountCents > 0) p += emv('54', (amountCents / 100).toFixed(2));
  p += emv('58', 'BR') + emv('59', name) + emv('60', city) + emv('62', emv('05', tx)) + '6304';
  return p + crc16(p);
}
function chargePix(c, ch) {
  if (!ch || !isOpen(ch) || c.settings.pixCode === false) return '';
  return pixPayload(c, chargeDue(c, ch).total, 'QUITAI' + numStr(ch.num));
}

/* ---------- QR Code (biblioteca carregada só quando precisa) ---------- */
async function qrSVG(text, size = 196) {
  const qrcode = await loadLib('qr');
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount(), q = 4, dim = n + q * 2;
  let d = '';
  for (let r = 0; r < n; r++) {
    let run = 0;
    for (let col = 0; col <= n; col++) {
      const dark = col < n && qr.isDark(r, col);
      if (dark) run++;
      else if (run) { d += `M${col - run + q} ${r + q}h${run}v1h-${run}z`; run = 0; }
    }
  }
  const px = Math.max(2, Math.floor(size / dim)) * dim;
  return `<svg viewBox="0 0 ${dim} ${dim}" width="${px}" height="${px}" shape-rendering="crispEdges" role="img" aria-label="QR Code do Pix"><rect width="${dim}" height="${dim}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

/* ---------- valor por extenso ---------- */
const EXT_U = ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove', 'dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
const EXT_D = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
const EXT_C = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];
function ate999(n) {
  if (n === 0) return '';
  if (n === 100) return 'cem';
  const c = Math.floor(n / 100), r = n % 100, parts = [];
  if (c) parts.push(EXT_C[c]);
  if (r) { if (r < 20) parts.push(EXT_U[r]); else { const d = Math.floor(r / 10), u = r % 10; parts.push(u ? `${EXT_D[d]} e ${EXT_U[u]}` : EXT_D[d]); } }
  return parts.join(' e ');
}
function inteiroExtenso(n) {
  if (n === 0) return 'zero';
  const grupos = [];
  let x = n;
  while (x > 0) { grupos.push(x % 1000); x = Math.floor(x / 1000); }
  const nomes = [['', ''], ['mil', 'mil'], ['milhão', 'milhões'], ['bilhão', 'bilhões']];
  const partes = [];
  for (let i = grupos.length - 1; i >= 0; i--) {
    const g = grupos[i];
    if (!g) continue;
    const t = i === 1 && g === 1 ? 'mil' : ate999(g) + (i ? ' ' + (g === 1 ? nomes[i][0] : nomes[i][1]) : '');
    partes.push({ t, g, i });
  }
  let out = '';
  partes.forEach((p, k) => {
    if (k === 0) { out = p.t; return; }
    const last = k === partes.length - 1;
    const useE = last && p.i === 0 && (p.g < 100 || p.g % 100 === 0);
    out += (useE ? ' e ' : ' ') + p.t;
  });
  return out;
}
function extenso(cents) {
  const r = Math.floor(cents / 100), c = cents % 100;
  const parts = [];
  if (r) { let t = inteiroExtenso(r); if (r % 1000000 === 0) t += ' de'; parts.push(t + (r === 1 ? ' real' : ' reais')); }
  if (c) parts.push(ate999(c) + (c === 1 ? ' centavo' : ' centavos'));
  return parts.length ? parts.join(' e ') : 'zero real';
}

/* ============================================================
   Leitura de arquivos: CSV, Excel (.xlsx), OFX, PDF e imagens.
   Tudo é lido no navegador; nada sai daqui sem um clique.
   ============================================================ */
function userError(msg) { const e = new Error(msg); e.user = true; return e; }
function readFileText(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const t = String(r.result || '');
      if (!t.includes('\uFFFD')) { res(t); return; }
      const r2 = new FileReader();
      r2.onload = () => res(String(r2.result || ''));
      r2.onerror = () => rej(r2.error);
      r2.readAsText(file, 'windows-1252');
    };
    r.onerror = () => rej(r.error);
    r.readAsText(file, 'utf-8');
  });
}
function readFileBytes(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(new Uint8Array(r.result)); r.onerror = () => rej(r.error); r.readAsArrayBuffer(file); });
}
function fileKind(file) {
  const n = String(file.name || '').toLowerCase();
  if (/\.(ofx|qfx)$/.test(n)) return 'ofx';
  if (/\.(csv|txt|tsv)$/.test(n)) return 'csv';
  if (/\.(xlsx|xlsm)$/.test(n)) return 'xlsx';
  if (/\.(xls|ods)$/.test(n)) return 'xls';
  if (/\.pdf$/.test(n) || file.type === 'application/pdf') return 'pdf';
  if (/^image\//.test(file.type || '') || /\.(png|jpe?g|webp|gif)$/.test(n)) return 'image';
  return 'other';
}

/* ---------- CSV ---------- */
function detectDelimiter(text) {
  const lines = text.split(/\r?\n/).filter((l) => l.trim()).slice(0, 12);
  let best = ';', bestScore = -1;
  for (const d of [';', ',', '\t', '|']) {
    const counts = lines.map((l) => l.split(d).length - 1);
    const withD = counts.filter((n) => n > 0);
    if (!withD.length) continue;
    const mode = withD.sort((a, b) => withD.filter((x) => x === b).length - withD.filter((x) => x === a).length)[0];
    const score = withD.filter((n) => n === mode).length * 10 + mode;
    if (score > bestScore) { bestScore = score; best = d; }
  }
  return best;
}
function parseCSV(text) {
  text = String(text || '').replace(/^\uFEFF/, '');
  const delim = detectDelimiter(text);
  const rows = [];
  let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += ch;
    } else if (ch === '"' && field === '') q = true;
    else if (ch === delim) { row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(field); rows.push(row); row = []; field = ''; }
    else field += ch;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows.map((r) => r.map((x) => String(x).trim())).filter((r) => r.some((x) => x));
}
function rowsToText(rows, max = 400) {
  return rows.slice(0, max).map((r, i) => `${i}: ${r.map((x) => String(x == null ? '' : x).replace(/\s+/g, ' ').trim()).join(' | ')}`).join('\n');
}

/* ---------- Excel (.xlsx) com JSZip ---------- */
const XLSX_DATE_FMTS = new Set([14, 15, 16, 17, 18, 19, 20, 21, 22, 45, 46, 47]);
function colIndexOf(ref) { const m = String(ref || '').match(/^[A-Z]+/); if (!m) return 0; let n = 0; for (const ch of m[0]) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; }
async function readXLSX(bytes) {
  const JSZip = await loadLib('zip');
  let zip;
  try { zip = await JSZip.loadAsync(bytes); } catch (e) { throw userError('Não conseguimos abrir esta planilha. Salve de novo como .xlsx ou .csv e tente outra vez.'); }
  const read = async (p) => { const f = zip.file(p); return f ? f.async('string') : null; };
  const dp = new DOMParser();
  const xml = (s) => dp.parseFromString(s, 'application/xml');
  const tags = (doc, name) => Array.from(doc.getElementsByTagName(name));
  let sheetPath = 'xl/worksheets/sheet1.xml';
  const wb = await read('xl/workbook.xml');
  const rels = await read('xl/_rels/workbook.xml.rels');
  if (wb && rels) {
    const first = tags(xml(wb), 'sheet')[0];
    const rid = first && (first.getAttribute('r:id') || first.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id'));
    const rel = rid && tags(xml(rels), 'Relationship').find((r) => r.getAttribute('Id') === rid);
    if (rel) { const tgt = rel.getAttribute('Target') || ''; sheetPath = tgt.startsWith('/') ? tgt.slice(1) : 'xl/' + tgt.replace(/^\.\//, ''); }
  }
  const shared = [];
  const ss = await read('xl/sharedStrings.xml');
  if (ss) for (const si of tags(xml(ss), 'si')) shared.push(tags(si, 't').map((t) => t.textContent).join(''));
  const dateStyles = new Set();
  const st = await read('xl/styles.xml');
  if (st) {
    const sd = xml(st);
    const custom = new Map(tags(sd, 'numFmt').map((f) => [+f.getAttribute('numFmtId'), f.getAttribute('formatCode') || '']));
    const xfs = sd.getElementsByTagName('cellXfs')[0];
    if (xfs) tags(xfs, 'xf').forEach((xf, i) => {
      const id = +xf.getAttribute('numFmtId');
      const code = custom.get(id) || '';
      if (XLSX_DATE_FMTS.has(id) || (code && /[dy]/i.test(code.replace(/"[^"]*"|\[[^\]]*\]/g, '')) && !/^[#0.,\s%]+$/.test(code))) dateStyles.add(i);
    });
  }
  const sx = await read(sheetPath);
  if (!sx) throw userError('A planilha está vazia ou num formato que não reconhecemos.');
  const rows = [];
  for (const rowEl of tags(xml(sx), 'row')) {
    const r = [];
    for (const cEl of tags(rowEl, 'c')) {
      const col = colIndexOf(cEl.getAttribute('r'));
      const t = cEl.getAttribute('t');
      const s = +cEl.getAttribute('s') || 0;
      const vEl = cEl.getElementsByTagName('v')[0];
      let v = '';
      if (t === 's') v = shared[+(vEl ? vEl.textContent : -1)] || '';
      else if (t === 'inlineStr') v = tags(cEl, 't').map((x) => x.textContent).join('');
      else if (t === 'str' || t === 'e') v = vEl ? vEl.textContent : '';
      else if (t === 'b') v = vEl && vEl.textContent === '1' ? 'VERDADEIRO' : 'FALSO';
      else if (vEl && vEl.textContent !== '') { const n = +vEl.textContent; v = dateStyles.has(s) ? excelSerialToISO(n) : n; }
      r[col] = v;
    }
    rows.push(Array.from(r, (x) => (x == null ? '' : x)));
  }
  return rows.filter((r) => r.some((x) => String(x).trim() !== ''));
}

/* ---------- OFX (padrão dos bancos brasileiros) ---------- */
function decodeEntities(s) { return String(s).replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;|&apos;/g, "'"); }
function parseOFX(text) {
  const out = [];
  const blocks = String(text).split(/<STMTTRN>/i).slice(1);
  for (const b0 of blocks) {
    const b = b0.split(/<\/STMTTRN>/i)[0];
    const tag = (name) => { const m = b.match(new RegExp('<' + name + '>([^<\\r\\n]*)', 'i')); return m ? m[1].trim() : ''; };
    const date = parseDateCell(tag('DTPOSTED').slice(0, 8));
    let a = tag('TRNAMT').replace(/\s/g, '');
    if (a.includes(',') && !a.includes('.')) a = a.replace(',', '.');
    else if (a.includes(',') && a.includes('.')) a = a.replace(/\./g, '').replace(',', '.');
    const amount = Math.round(parseFloat(a) * 100);
    if (!date || !Number.isFinite(amount) || !amount) continue;
    const parts = [tag('NAME'), tag('MEMO')].filter(Boolean);
    const desc = decodeEntities(parts.filter((p, i) => parts.indexOf(p) === i).join(' · ') || tag('TRNTYPE') || 'Lançamento');
    out.push({ date, amount, desc, fitid: tag('FITID') });
  }
  return out;
}

/* ---------- PDF (pdf.js, carregado sob demanda) ---------- */
let pdfjsPromise = null;
function loadPdfJs() {
  if (pdfjsPromise) return pdfjsPromise;
  pdfjsPromise = (async () => {
    for (const src of PDFJS_SOURCES) {
      try {
        const mod = await import(src.lib);
        const L = mod && mod.getDocument ? mod : mod && mod.default && mod.default.getDocument ? mod.default : null;
        if (L) { L.GlobalWorkerOptions.workerSrc = src.worker; return L; }
      } catch (e) { /* tenta o próximo endereço */ }
    }
    pdfjsPromise = null;
    throw userError('Não foi possível carregar o leitor de PDF agora. Verifique a conexão ou envie o extrato em OFX, CSV ou Excel.');
  })();
  return pdfjsPromise;
}
async function readPDF(bytes) {
  const L = await loadPdfJs();
  let doc;
  try { doc = await L.getDocument({ data: bytes, isEvalSupported: false, useSystemFonts: true }).promise; }
  catch (e) { throw userError(e && e.name === 'PasswordException' ? 'Este PDF tem senha. Abra no seu computador, salve sem senha e envie de novo.' : 'Não conseguimos abrir este PDF.'); }
  const lines = [];
  const n = Math.min(doc.numPages, 40);
  for (let p = 1; p <= n; p++) {
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    const rows = [];
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      const y = it.transform[5], x = it.transform[4];
      let row = rows.find((r) => Math.abs(r.y - y) <= 2.2);
      if (!row) { row = { y, items: [] }; rows.push(row); }
      row.items.push({ x, s: it.str });
    }
    rows.sort((a, b) => b.y - a.y);
    for (const r of rows) lines.push(r.items.sort((a, b) => a.x - b.x).map((o) => o.s).join(' ').replace(/\s+/g, ' ').trim());
  }
  return { doc, lines, text: lines.join('\n'), pages: doc.numPages };
}
async function pdfPagesToImages(doc, max = 3) {
  const out = [];
  for (let p = 1; p <= Math.min(doc.numPages, max); p++) {
    const page = await doc.getPage(p);
    const vp = page.getViewport({ scale: 1.6 });
    const cv = document.createElement('canvas');
    cv.width = Math.ceil(vp.width); cv.height = Math.ceil(vp.height);
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvas: cv, canvasContext: ctx, viewport: vp }).promise;
    const blob = await new Promise((r) => cv.toBlob(r, 'image/jpeg', 0.86));
    if (blob) out.push(blob);
  }
  return out;
}

/* ---------- entrada única: qualquer arquivo vira tabela, texto ou imagem ---------- */
async function loadAnyFile(file) {
  const kind = fileKind(file);
  const name = file.name || 'arquivo';
  if (file.size > 15 * 1024 * 1024) throw userError('O arquivo passa de 15 MB. Exporte um período menor e tente de novo.');
  if (kind === 'xls') throw userError('Arquivos .xls e .ods não são lidos aqui. Abra no Excel ou no Google Planilhas e salve como .xlsx ou .csv.');
  if (kind === 'image') return { kind: 'image', blobs: [file], name };
  if (kind === 'xlsx') { const rows = await readXLSX(await readFileBytes(file)); return { kind: 'table', rows, name }; }
  if (kind === 'pdf') { const r = await readPDF(await readFileBytes(file)); return { kind: 'text', lines: r.lines, text: r.text, doc: r.doc, pages: r.pages, name }; }
  const text = await readFileText(file);
  if (kind === 'ofx' || /<OFX>|OFXHEADER|<STMTTRN>/i.test(text.slice(0, 4000))) return { kind: 'ofx', text, name };
  const rows = parseCSV(text);
  if (rows.length && Math.max(...rows.slice(0, 20).map((r) => r.length)) <= 1) return { kind: 'text', lines: text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean), text, name };
  return { kind: 'table', rows, name };
}

/* ---------- colunas: reconhece cabeçalhos por nome ---------- */
function headerScore(h, names) {
  const n = norm(h).replace(/[()$:._]/g, ' ').replace(/\s+/g, ' ').trim();
  if (!n) return 0;
  let best = 0;
  for (const name of names) {
    if (n === name) best = Math.max(best, 4);
    else if (n.startsWith(name + ' ') || n.endsWith(' ' + name)) best = Math.max(best, 3);
    else if (name.length >= 4 && n.includes(name)) best = Math.max(best, 2);
  }
  return best;
}
/* acha a linha de cabeçalho e as colunas de cada campo: fields = {campo: [nomes...]} */
function detectColumns(rows, fields, required) {
  let best = null;
  for (let hr = 0; hr < Math.min(rows.length, 25); hr++) {
    const header = rows[hr] || [];
    const cols = {}, used = new Set();
    let score = 0;
    for (const [field, names] of Object.entries(fields)) {
      let bi = -1, bs = 0;
      header.forEach((h, i) => { if (used.has(i)) return; const s = headerScore(h, names); if (s > bs) { bs = s; bi = i; } });
      if (bi >= 0) { cols[field] = bi; used.add(bi); score += bs; }
    }
    if (required.every((f) => f in cols) && (!best || score > best.score)) best = { headerRow: hr, cols, score };
  }
  return best;
}

/* ============================================================
   Baixa pelo extrato bancário: lê o extrato, encontra o
   pagamento de cada cobrança e dá baixa com um clique.
   ============================================================ */
const STATEMENT_FIELDS = {
  credit: ['credito', 'creditos', 'entrada', 'entradas', 'valor credito', 'credito r', 'receitas'],
  debit: ['debito', 'debitos', 'saida', 'saidas', 'valor debito', 'debito r', 'despesas'],
  date: ['data lancamento', 'data do lancamento', 'data de lancamento', 'data movimento', 'data mov', 'data', 'dt lancamento', 'date', 'dia'],
  desc: ['descricao', 'historico', 'lancamento', 'detalhes', 'detalhe', 'memo', 'description', 'identificacao', 'titulo', 'complemento'],
  amount: ['valor', 'valor r', 'valor rs', 'amount', 'montante', 'quantia', 'valor da transacao'],
  sign: ['c d', 'd c', 'tipo', 'natureza', 'sinal', 'cd', 'dc'],
};
const STATEMENT_MAP_FIELDS = { date: 'data do lançamento', desc: 'descrição ou histórico', amount: 'valor com sinal (negativo para saídas)', credit: 'coluna só de créditos/entradas, se existir', debit: 'coluna só de débitos/saídas, se existir' };
function txKey(tx) { return tx.fitid ? 'f:' + tx.fitid : 'h:' + fnv(tx.date + '|' + tx.amount + '|' + norm(tx.desc)); }
function finishTx(list) {
  const seen = new Map();
  return list.filter((t) => t.date && Number.isFinite(t.amount) && t.amount !== 0).map((t) => {
    const k = txKey(t);
    const n = (seen.get(k) || 0) + 1;
    seen.set(k, n);
    return Object.assign({}, t, { key: n > 1 ? k + ':' + n : k });
  });
}
/* tabela (CSV/Excel) com colunas conhecidas, detectadas ou mapeadas */
function tableToTx(rows, map) {
  const m = map || detectColumns(rows, STATEMENT_FIELDS, ['date']);
  if (!m || !('date' in m.cols) || !('amount' in m.cols || 'credit' in m.cols)) return null;
  const { cols } = m;
  const year = +todayISO().slice(0, 4);
  const out = [];
  for (const r of rows.slice(m.headerRow + 1)) {
    const date = parseDateCell(r[cols.date], year);
    if (!date) continue;
    let amount = NaN;
    if ('credit' in cols || 'debit' in cols) {
      const cr = 'credit' in cols ? parseAmountCell(r[cols.credit]) : NaN;
      const db = 'debit' in cols ? parseAmountCell(r[cols.debit]) : NaN;
      if (Number.isFinite(cr) && cr !== 0) amount = Math.abs(cr);
      else if (Number.isFinite(db) && db !== 0) amount = -Math.abs(db);
      else if ('amount' in cols) amount = parseAmountCell(r[cols.amount]);
    } else amount = parseAmountCell(r[cols.amount]);
    if (!Number.isFinite(amount)) continue;
    if ('sign' in cols) { const s = norm(r[cols.sign]); if (/^(d|deb|debito|saida|-)/.test(s)) amount = -Math.abs(amount); else if (/^(c|cred|credito|entrada|\+)/.test(s)) amount = Math.abs(amount); }
    const desc = 'desc' in cols ? String(r[cols.desc] || '').trim() : '';
    out.push({ date, amount, desc: desc || 'Lançamento' });
  }
  return { txs: finishTx(out), map: m };
}
/* texto (PDF ou TXT): linhas que começam com data e terminam com valores */
const AMT_RE = /(?:R\$\s*)?-?\(?\d{1,3}(?:\.\d{3})*,\d{2}\)?(?:\s?[CD]\b|-)?/g;
const AMT_TEST = /\d{1,3}(?:\.\d{3})*,\d{2}/;
function textToTx(lines) {
  const t = todayISO(), year = +t.slice(0, 4), month = +t.slice(5, 7);
  const out = [];
  let last = null;
  for (const raw of lines) {
    const line = String(raw).replace(/\s+/g, ' ').trim();
    const dm = line.match(/^(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?|\d{1,2}\s(?:jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]*\.?(?:\s\d{2,4})?)\b\s*(.*)$/i);
    if (!dm) { if (last && line && !AMT_TEST.test(line) && line.length < 80 && !/saldo|total/i.test(line)) last.desc += ' ' + line; continue; }
    let date = parseDateCell(dm[1], year);
    if (date && !/\d{4}$/.test(dm[1].trim()) && !/\/\d{2,4}$/.test(dm[1]) && +date.slice(5, 7) > month + 1) date = (year - 1) + date.slice(4);
    const rest = dm[2];
    if (!date || /saldo|^total/i.test(rest)) { last = null; continue; }
    const amts = rest.match(AMT_RE) || [];
    if (!amts.length) { last = null; continue; }
    const first = amts[0];
    let amount = parseAmountCell(first);
    if (!Number.isFinite(amount) || !amount) { last = null; continue; }
    const desc = rest.slice(0, rest.indexOf(first)).replace(/\s+[-–]\s*$/, '').trim();
    if (/\b(debito|pagamento|pgto|compra|saque|tarifa|transf(erencia)? enviada|pix enviado|envio)\b/i.test(norm(desc)) && amount > 0 && !/[CD]$/.test(first.trim())) amount = -amount;
    last = { date, amount, desc: desc || 'Lançamento' };
    out.push(last);
  }
  return finishTx(out);
}
function statementFromLoaded(L, map) {
  if (L.kind === 'ofx') return { txs: finishTx(parseOFX(L.text)), how: 'OFX' };
  if (L.kind === 'table') { const r = tableToTx(L.rows, map); return r ? { txs: r.txs, how: 'planilha', map: r.map } : { txs: [], how: 'planilha', needsMap: true }; }
  if (L.kind === 'text') return { txs: textToTx(L.lines || []), how: 'PDF' };
  return { txs: [], how: 'imagem' };
}
function txFromAI(arr) {
  if (!Array.isArray(arr)) return [];
  return finishTx(arr.map((x) => ({ date: parseDateCell(String((x && x.data) || '')), amount: Math.round(Number(x && x.valor) * 100), desc: String((x && x.descricao) || 'Lançamento').slice(0, 140) })));
}
function guessMethod(desc) {
  const d = norm(desc);
  if (/\bpix\b/.test(d)) return 'pix';
  if (/boleto|cobranca|liquidacao/.test(d)) return 'boleto';
  if (/cartao|cielo|stone|rede|getnet|pagseguro|pagbank|mercado ?pago|sumup|infinitepay|ton\b/.test(d)) return 'cartao';
  if (/deposito|dinheiro/.test(d)) return 'dinheiro';
  return 'transferencia';
}

/* ---------- encontrar a cobrança de cada crédito ---------- */
function nameHit(cl, memo, memoDigits) {
  const docD = onlyDigits(cl.doc);
  if (docD && docD.length >= 11 && memoDigits.includes(docD)) return { s: 45, why: 'CPF/CNPJ do cliente' };
  const full = norm(cl.name).replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  if (full.length >= 6 && memo.includes(full)) return { s: 38, why: 'nome do cliente' };
  const toks = nameTokens(cl.name).concat(cl.contact ? nameTokens(cl.contact) : []);
  if (!toks.length) return null;
  const words = new Set(memo.split(' '));
  const hits = toks.filter((w) => words.has(w));
  if (hits.length >= 2) return { s: 32, why: 'nome do cliente' };
  if (hits.length === 1 && cl.kind === 'PJ' && hits[0].length >= 5) return { s: 22, why: 'nome da empresa' };
  if (hits.length === 1 && hits[0] === toks[0]) {
    const last = toks[toks.length - 1];
    if (toks.length > 1 && new RegExp('\\b' + last[0] + '\\b').test(memo)) return { s: 24, why: 'nome abreviado' };
    return { s: 12, why: 'primeiro nome' };
  }
  return null;
}
function reconAnalyze(c, txs) {
  const open = c.charges.filter(isOpen);
  const clMap = new Map(c.clients.map((cl) => [cl.id, cl]));
  const credits = txs.filter((t) => t.amount > 0);
  const fresh = credits.filter((t) => !c.bankSeen[t.key]);
  const cand = [];
  for (const tx of fresh) {
    const memo = norm(tx.desc).replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ');
    const memoDigits = onlyDigits(tx.desc);
    const amtCount = open.filter((ch) => ch.amount === tx.amount || chargeDue(c, ch, tx.date).total === tx.amount).length;
    for (const ch of open) {
      let s = 0;
      const why = [];
      const hasTxid = memo.replace(/\s/g, '').includes('quitai' + numStr(ch.num));
      if (hasTxid) { s += 100; why.push('código do Pix da cobrança'); }
      const upd = chargeDue(c, ch, tx.date).total;
      if (tx.amount === ch.amount) { s += 40; why.push('valor igual'); }
      else if (tx.amount === upd) { s += 42; why.push('valor com multa e juros'); }
      else if (Math.abs(tx.amount - ch.amount) <= Math.max(100, Math.round(ch.amount * 0.01))) { s += 14; why.push('valor quase igual'); }
      else if (!hasTxid) continue;
      const cl = clMap.get(ch.clientId);
      const nh = cl ? nameHit(cl, memo, memoDigits) : null;
      if (nh) { s += nh.s; why.push(nh.why); }
      const dd = diffDays(tx.date, ch.due);
      if (dd >= -25 && dd <= 75) s += Math.max(0, 10 - Math.abs(dd) / 3); else s -= 15;
      if (!nh && !hasTxid && amtCount === 1) s += 8;
      cand.push({ tx, ch, s, why, nameOk: !!nh, txid: hasTxid, amtCount });
    }
  }
  cand.sort((a, b) => b.s - a.s);
  const usedTx = new Set(), usedCh = new Set();
  const best = new Map();
  for (const m of cand) {
    if (m.s < 40 || usedTx.has(m.tx.key) || usedCh.has(m.ch.id)) continue;
    usedTx.add(m.tx.key); usedCh.add(m.ch.id);
    best.set(m.tx.key, m);
  }
  const rows = fresh.map((tx) => {
    const b = best.get(tx.key) || null;
    const alts = cand.filter((m) => m.tx.key === tx.key).slice(0, 6);
    let conf = null;
    if (b) conf = b.txid || (b.nameOk && b.s >= 70) ? 'alta' : b.nameOk || b.amtCount === 1 ? 'media' : 'baixa';
    return { tx, ids: b ? [b.ch.id] : [], why: b ? b.why : [], conf, alts: alts.map((m) => m.ch.id), on: !!b && conf !== 'baixa', ai: false };
  });
  rows.sort((a, b) => (a.ids.length ? 0 : 1) - (b.ids.length ? 0 : 1) || (a.tx.date < b.tx.date ? -1 : 1));
  return { rows, credits: credits.length, debits: txs.length - credits.length, seen: credits.length - fresh.length, total: txs.length };
}

    const list = r.ids.map((id) => chargeById(c, id)).filter((ch) => ch && isOpen(ch));

    const dueSum = sumBy(list, (ch) => chargeDue(c, ch, r.tx.date).total);

}

    const rec = monthly ? { id: uid('rc_'), clientId: cl.id, desc: plan, amount: price * 100, method: kind === 'PJ' ? 'boleto' : 'pix', day, next: null, status: 'ativa', count: 0, lastDue: null, notes: '', createdAt: parseISO(joinedAt).getTime(), updatedAt: parseISO(joinedAt).getTime(), pausedAt: null, endedAt: null } : null;
    for (let off = startOffset; off <= 1; off++) {
      if (!monthly && off % 2 !== 0) continue; // pacote a cada dois meses
      const due = addMonths(monthStart(t), off, day);
      if (due < joinedAt) continue;
      const amount = price * 100;
      const desc = !monthly ? plan : `${plan} · ${MONTHS_SHORT[+due.slice(5, 7) - 1]}/${due.slice(0, 4)}`;
      const ch = demoCharge(c, cl, desc, amount, due);
      if (rec) { ch.recId = rec.id; ch.log[0].note = 'Gerada pela mensalidade automática'; rec.count++; rec.lastDue = due; }
      ch.method = rec && kind === 'PJ' ? 'boleto' : pick(methodsBag);
      const past = due < t;
      let st = ov[off] || ov[String(off)];
      if (!st) {
        if (!past) st = off === 0 && rnd() < 0.12 ? 'early' : 'open';
        else { const r = rnd(); st = off <= -2 ? (r < 0.94 ? 'ontime' : 'recovered') : r < 0.9 ? 'ontime' : 'recovered'; }
      }
      if (!past && (st === 'late' || st === 'recovered')) st = 'open';
      if (st === 'ontime' || st === 'early') {
        const pd = st === 'early' ? addDays(t, -Math.floor(rnd() * 3)) : addDays(due, -Math.floor(rnd() * 4));
        ch.status = 'pago'; ch.paidAt = pd > t ? t : pd; ch.paidAmount = amount;
        const who = actor();
        ch.log.push({ at: tsOf(ch.paidAt, 15), by: who, from: 'pendente', to: 'pago', note: '' });
        if (diffDays(t, ch.paidAt) <= 12) acts.push({ at: tsOf(ch.paidAt, 15), by: who, type: 'paid', text: `Registrou o pagamento de #${numStr(ch.num)} (${name}): ${fmtMoney(amount)}`, ref: ch.id });
      } else if (st === 'recovered') {
        let pd = addDays(due, 3 + Math.floor(rnd() * 18));
        if (pd > t) pd = addDays(t, -Math.floor(rnd() * 2));
        if (pd <= due) pd = addDays(due, 1) > t ? t : addDays(due, 1);
        ch.wasOverdue = true;
        ch.log.push({ at: tsOf(addDays(due, 1), 6), by: 'auto', from: 'pendente', to: 'atrasado', note: 'Atraso automático' });
        ch.lastContactAt = tsOf(addDays(due, 2), 10); ch.contacts = 1;
        ch.status = 'pago'; ch.paidAt = pd; ch.paidAmount = amount;
        const who = actor();
        ch.log.push({ at: tsOf(pd, 16), by: who, from: 'atrasado', to: 'pago', note: '' });
        if (diffDays(t, pd) <= 20) {
          acts.push({ at: tsOf(addDays(due, 2), 10), by: who, type: 'wa', text: `Abriu o WhatsApp para cobrar #${numStr(ch.num)} de ${name}`, ref: ch.id });
          acts.push({ at: tsOf(pd, 16), by: who, type: 'paid', text: `Registrou o pagamento de #${numStr(ch.num)} (${name}): ${fmtMoney(amount)}`, ref: ch.id });
        }
      } else if (st === 'late') {
        ch.status = 'atrasado'; ch.wasOverdue = true;
        ch.log.push({ at: tsOf(addDays(due, 1), 6), by: 'auto', from: 'pendente', to: 'atrasado', note: 'Atraso automático' });
        if (rnd() < 0.6 && diffDays(t, due) > 2) {
          const cd = addDays(due, 2 + Math.floor(rnd() * Math.max(1, Math.min(10, diffDays(t, due) - 2))));
          ch.lastContactAt = tsOf(cd > t ? t : cd, 11); ch.contacts = 1;
          if (diffDays(t, cd) <= 20) acts.push({ at: ch.lastContactAt, by: actor(), type: 'wa', text: `Abriu o WhatsApp para cobrar #${numStr(ch.num)} de ${name}`, ref: ch.id });
        }
      }
    }
    if (rec && rec.lastDue) { rec.next = addMonths(rec.lastDue, 1, day); c.recurrences.push(rec); }
  }
  // uma cobrança cancelada, para o exemplo ficar completo
  const canc = c.charges.find((x) => x.status === 'pendente' && x.desc.startsWith('Mensalidade 1x'));
  if (canc) { canc.status = 'cancelado'; canc.log.push({ at: Date.now() - 86400000, by: owner.id, from: 'pendente', to: 'cancelado', note: 'Aluno trancou a matrícula por um mês' }); canc.notes = 'Aluno trancou a matrícula por um mês.'; acts.push({ at: Date.now() - 86400000, by: owner.id, type: 'status', text: `Mudou #${numStr(canc.num)} de Pendente para Cancelado`, ref: canc.id }); }
  // uma mensalidade pausada (aluno viajando)
  const paused = c.recurrences.find((r) => (clientById(c, r.clientId) || {}).name === 'Eduardo Farias');
  if (paused) { paused.status = 'pausada'; paused.pausedAt = Date.now() - 3 * 86400000; paused.notes = 'Aluno viajando, volta no mês que vem.'; acts.push({ at: paused.pausedAt, by: owner.id, type: 'rec', text: 'Pausou a mensalidade automática de Eduardo Farias', ref: null }); }
  // fechamento do mês passado já registrado
  const lm = addMonths(monthStart(t), -1);
  const cd = closingData(c, [lm, monthEnd(lm)]);
  c.closings.push({ id: uid('fc_'), at: parseISO(addDays(monthEnd(lm), 1)).getTime() + 10 * 3600000, by: owner.id, from: lm, to: monthEnd(lm), label: cd.label, received: cd.received, receivedN: cd.receivedN, dueTotal: cd.dueTotal, duePaid: cd.duePaid, dueLate: cd.dueLate, adimplencia: cd.adimplencia, overdueNow: cd.overdueNow, recovered: cd.recovered, note: 'Fechamento conferido com o extrato do banco.', ai: null });
  acts.push({ at: c.closings[0].at, by: owner.id, type: 'closing', text: `Registrou o fechamento de ${cd.label.toLowerCase()}`, ref: null });

  const nAuto = c.charges.filter((x) => x.status === 'atrasado' && diffDays(t, x.due) <= 3).length;
  if (nAuto) acts.push({ at: tsOf(t, 6), by: 'auto', type: 'auto', text: `${nAuto === 1 ? '1 cobrança passou' : nAuto + ' cobranças passaram'} para Em atraso automaticamente`, ref: null });
  acts.push({ at: c.createdAt + 20 * 86400000, by: owner.id, type: 'team', text: 'Deu acesso a Ana Paula Souza como Financeiro', ref: null });
  acts.push({ at: c.createdAt + 60 * 86400000, by: owner.id, type: 'team', text: 'Deu acesso a Bruno Lima como Somente leitura', ref: null });
  c.activity = acts.sort((a, b) => b.at - a.at).slice(0, 120).map((a) => Object.assign({ id: uid('a_') }, a));
  c.settings.lastExportAt = Date.now() - 9 * 86400000;
  DB.companies[c.id] = c;
  DB.meta.demoId = c.id;
  return c;
}
function demoCharge(c, cl, desc, amount, due) {
  const created = Math.min(Date.now() - 2 * 86400000, parseISO(addDays(due, -20)).getTime() + 8 * 3600000);
  const ch = {
    id: uid('ch_'), num: c.seq.charge++, clientId: cl.id, desc, amount, due, status: 'pendente', paidAt: null, paidAmount: null,
    method: 'pix', wasOverdue: false, lockAuto: false, group: null, notes: '', createdAt: created,
    updatedAt: Date.now(), lastContactAt: null, contacts: 0,
    log: [{ at: created, by: 'auto', from: null, to: 'pendente', note: 'Cobrança criada' }],
  };
  c.charges.push(ch);
  return ch;
}
function removeDemo() {

  if (id && DB.companies[id]) {

/* automações que rodam sempre que o painel abre (e a cada minuto com ele aberto) */
function runAutomations(c) {
  if (!c) return 0;
  return runRecurrences(c) + runAutoOverdue(c);
}
function runMaintenance() {
  let changed = false;
  for (const c of Object.values(DB.companies)) {
    const before = c.invoices.length;
    renewSubscriptions(c);
    if (runAutomations(c)) changed = true;
    if (c.invoices.length !== before) changed = true;
    pruneQueue(c);
  }
  if (changed) save();
}

const modalStack = [];
function openModal({ title, sub = '', body, foot = '', size = '', onClose = null, onOpen = null, dismissable = true }) {
  const root = document.getElementById('modals');
  const n = uid('m');
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop' + (size === 'drawer' ? ' is-drawer' : '');
  wrap.innerHTML = html`<div class="modal ${size}" role="dialog" aria-modal="true" aria-labelledby="${n}-t">
      <div class="modal-head"><div class="grow"><h2 id="${n}-t">${title}</h2>${sub ? html`<p class="modal-sub">${sub}</p>` : ''}</div>
      ${dismissable ? html`<button type="button" class="btn btn-ghost btn-icon btn-sm" data-act="modalCancel" aria-label="Fechar">${icon('x')}</button>` : ''}</div>
      <div class="modal-body">${body}</div>
      ${foot ? html`<div class="modal-foot">${foot}</div>` : ''}
    </div>`.s;
  const entry = { wrap, onClose, prevFocus: document.activeElement, dismissable };
  wrap.addEventListener('mousedown', (e) => { if (e.target === wrap && entry.dismissable) closeModal(false); });
  root.appendChild(wrap);
  entry.drawer = size === 'drawer';
  modalStack.push(entry);
  document.body.classList.add('modal-open');
  document.body.classList.toggle('drawer-open', modalStack.some((m) => m.drawer));
  const first = wrap.querySelector('[autofocus]') || wrap.querySelector('.modal-body input:not([type=hidden]):not([type=checkbox]):not([type=radio]):not([disabled]), .modal-body select, .modal-body textarea') || wrap.querySelector('.modal-foot .btn-primary, .modal-foot .btn');
  if (first) setTimeout(() => { if (wrap.contains(document.activeElement)) return; try { first.focus({ preventScroll: true }); } catch (e) { first.focus(); } }, 30);
  if (onOpen) onOpen(wrap);
  return entry;
}
function closeModal(result) {
  const top = modalStack.pop();
  if (!top) return;
  top.wrap.remove();
  if (!modalStack.length) document.body.classList.remove('modal-open');
  document.body.classList.toggle('drawer-open', modalStack.some((m) => m.drawer));
  if (top.onClose) top.onClose(result);
  if (top.prevFocus && top.prevFocus.isConnected) { try { top.prevFocus.focus({ preventScroll: true }); } catch (e) { /* ignora */ } }
}
function closeAllModals() { while (modalStack.length) closeModal(false); }
function topModal() { return modalStack.length ? modalStack[modalStack.length - 1].wrap : null; }
A.modalCancel = () => closeModal(false);
A.modalOk = () => closeModal(true);

const toastActions = new Map();
function toast(msg, { type = 'ok', action = null, timeout = 4500 } = {}) {
  const root = document.getElementById('toasts');
  if (!root) return;
  const id = uid('t');
  const el = document.createElement('div');
  el.className = 'toast';
  el.id = id;
  el.setAttribute('role', type === 'bad' ? 'alert' : 'status');
  const ic = type === 'ok' ? 'checkCircle' : type === 'info' ? 'info' : 'alert';
  el.innerHTML = html`${icon(ic, 't-' + type)}<span class="grow">${msg}</span>${action ? html`<button type="button" data-act="toastAction" data-id="${id}">${action.label}</button>` : ''}<button type="button" class="toast-x" data-act="toastClose" data-id="${id}" aria-label="Fechar aviso">${icon('x', 'i-sm')}</button>`.s;
  root.appendChild(el);

  while (root.children.length > 3) { const f = root.firstElementChild; toastActions.delete(f.id); f.remove(); }
  setTimeout(() => removeToast(id), action ? Math.max(timeout, 8000) : timeout);
}

/* ---------- menus e popovers ---------- */
let menuState = null;
function placeFloating(el, anchor, align = 'right') {
  const r = anchor.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight;
  const vw = document.documentElement.clientWidth, vh = window.innerHeight;
  let left = align === 'right' ? r.right - w : r.left;
  left = clamp(left, 8, vw - w - 8);
  let top = r.bottom + 6;
  if (top + h > vh - 8 && r.top - h - 6 > 8) top = r.top - h - 6;
  el.style.left = left + 'px';
  el.style.top = Math.max(8, top) + 'px';
}
function openMenu(anchor, items, align = 'right') {
  const same = menuState && menuState.anchor === anchor;
  closeMenu();
  if (same) return;
  const m = document.createElement('div');
  m.className = 'menu';
  m.setAttribute('role', 'menu');
  m.innerHTML = items.map((it, i) => {
    if (it.sep) return '<div class="menu-sep" role="separator"></div>';
    if (it.heading) return html`<div class="menu-label">${it.heading}</div>`.s;
    if (it.href) return html`<a role="menuitem" href="${it.href}" target="_blank" rel="noopener noreferrer" data-mi="${i}" class="${it.danger ? 'danger' : ''}">${it.icon ? icon(it.icon) : ''}${it.label}</a>`.s;
    return html`<button type="button" role="menuitem" data-mi="${i}" class="${it.danger ? 'danger' : ''}"${dis(it.disabled)}>${it.icon ? icon(it.icon) : ''}${it.label}</button>`.s;
  }).join('');
  document.body.appendChild(m);
  placeFloating(m, anchor, align);
  anchor.setAttribute('aria-expanded', 'true');
  menuState = { el: m, items, anchor, align };
  const first = m.querySelector('button:not([disabled]), a');
  if (first) first.focus({ preventScroll: true });
}
function openPopover(anchor, content, align = 'right') {
  const same = menuState && menuState.anchor === anchor;
  closeMenu();
  if (same) return;
  const p = document.createElement('div');
  p.className = 'popover';
  p.innerHTML = content.s;
  document.body.appendChild(p);
  placeFloating(p, anchor, align);
  anchor.setAttribute('aria-expanded', 'true');
  menuState = { el: p, items: [], anchor, align };
}
/* ao rolar, o menu acompanha o botão que o abriu; só fecha se o botão sair da tela */
function followAnchor() {
  const a = menuState.anchor;
  if (!a || !a.isConnected) { closeMenu(); return; }
  const r = a.getBoundingClientRect();
  if (r.bottom < 0 || r.top > window.innerHeight || (!r.width && !r.height)) { closeMenu(); return; }
  placeFloating(menuState.el, a, menuState.align);
}
function closeMenu() {
  if (!menuState) return;
  menuState.el.remove();
  if (menuState.anchor) menuState.anchor.setAttribute('aria-expanded', 'false');
  menuState = null;
}

/* ---------- formulários ---------- */
function formValues(f) {
  const o = {};
  for (const el of f.elements) {
    if (!el.name) continue;
    if (el.type === 'checkbox') o[el.name] = el.checked;
    else if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; }
    else o[el.name] = typeof el.value === 'string' ? el.value.trim() : el.value;
  }
  return o;
}
function clearErrors(f) {
  $$('.field-error', f).forEach((e) => e.remove());
  $$('.is-invalid', f).forEach((e) => { e.classList.remove('is-invalid'); e.removeAttribute('aria-invalid'); });
  const fe = $('.form-error', f); if (fe) fe.remove();
}
/* o erro de um campo some assim que a pessoa começa a corrigir */
function clearFieldError(el) {
  const g = el.name && el.form ? el.form.elements[el.name] : el;
  const list = g && !g.tagName && g.length !== undefined ? [...g] : [g || el];
  for (const x of list) {
    if (!x || !x.classList || !x.classList.contains('is-invalid')) continue;
    x.classList.remove('is-invalid');
    x.removeAttribute('aria-invalid');
    const fld = x.closest('.field') || x.parentElement;
    const fe = fld && [...fld.querySelectorAll('.field-error')].find((p) => !p.dataset.for || p.dataset.for === x.name);
    if (fe) fe.remove();
  }
}
function showErrors(f, errs) {
  clearErrors(f);
  let first = null;
  for (const [name, msg] of Object.entries(errs)) {
    const el = f.elements[name];
    if (!el) continue;
    const input = el.length && !el.tagName ? el[0] : el;
    input.classList.add('is-invalid');
    input.setAttribute('aria-invalid', 'true');
    const field = input.closest('.field') || input.parentElement;
    const p = document.createElement('p');
    p.className = 'field-error';
    p.dataset.for = name;
    p.textContent = msg;
    field.appendChild(p);
    if (!first) first = input;
  }
  if (first) first.focus();
  return !Object.keys(errs).length;
}
function formError(f, msg) {
  clearErrors(f);
  const d = document.createElement('div');
  d.className = 'form-error';
  d.setAttribute('role', 'alert');
  d.textContent = msg;
  f.prepend(d);
}
function setBusy(btn, busy, label) {
  if (!btn) return;
  if (busy) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.innerHTML = esc(label || 'Aguarde…'); }
  else { btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; }
}
