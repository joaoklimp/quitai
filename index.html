/* ---------- bibliotecas externas (carregadas só quando usadas) ---------- */
const libCache = {};
function loadLib(key) {
  const lib = CDN[key];
  if (window[lib.global]) return Promise.resolve(window[lib.global]);
  if (libCache[key]) return libCache[key];
  libCache[key] = (async () => {
    for (const url of lib.urls) {
      try {
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = url; s.async = true; s.onload = res; s.onerror = rej;
          document.head.appendChild(s);
        });
        if (window[lib.global]) return window[lib.global];
      } catch (e) { /* tenta o próximo endereço */ }
    }
    libCache[key] = null;
    throw new Error('Não foi possível carregar ' + key);
  })();
  return libCache[key];
}

/* ---------- downloads ---------- */
let downloadsNs;
function getDownloads() {
  if (downloadsNs !== undefined) return Promise.resolve(downloadsNs);
  if (getDownloads.p) return getDownloads.p;
  const C = window.claude;
  if (!C || typeof C.use !== 'function') { downloadsNs = null; return Promise.resolve(null); }
  getDownloads.p = C.use('downloads').then((d) => (downloadsNs = d || null), () => (downloadsNs = null));
  return getDownloads.p;
}
async function offerFile(filename, data, { fallbackText = null } = {}) {
  const dl = await getDownloads();
  if (dl) {
    try {
      const r = await dl.save({ filename, data });
      if (!r || r.status !== 'delivered') toast(`Download iniciado: ${filename}`);
      return 'saved';
    } catch (e) {
      const code = e && e.code;
      if (code === 'declined') { toast('Download cancelado.', { type: 'info' }); return 'declined'; }
      if (code === 'rate_limited') { toast('Já existe um download esperando sua confirmação.', { type: 'warn' }); return 'busy'; }
      if (code === 'too_large') { toast('O arquivo ficou grande demais. Filtre um período menor e tente de novo.', { type: 'warn' }); return 'failed'; }
      if (code === 'extension_not_enabled' || code === 'rejected_extension') { toast('Este formato de arquivo não está disponível aqui.', { type: 'warn' }); return 'failed'; }
    }
  }
  if (!window.claude && browserDownload(filename, data)) { toast(`Download iniciado: ${filename}`); return 'saved'; }
  if (fallbackText != null) { showTextFallback(filename, fallbackText); return 'fallback'; }
  toast('O download de arquivos não está disponível nesta visualização. Use "Copiar tabela" para levar os dados para o Excel.', { type: 'warn', timeout: 8000 });
  return 'failed';
}
/* fora do Claude (site próprio), o navegador baixa o arquivo direto */
const MIME = { pdf: 'application/pdf', csv: 'text/csv;charset=utf-8', json: 'application/json', txt: 'text/plain;charset=utf-8', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', ofx: 'application/x-ofx' };
function browserDownload(filename, data) {
  try {
    const ext = String(filename).split('.').pop().toLowerCase();
    const blob = data instanceof Blob ? data : new Blob([data], { type: MIME[ext] || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener'; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    return true;
  } catch (e) { return false; }
}
function showTextFallback(filename, text) {
  openModal({
    title: 'Copie o conteúdo do arquivo', size: 'lg',
    sub: `O download não está disponível nesta visualização. Copie o texto abaixo e salve como ${filename}.`,
    body: html`<textarea id="fallback-text" class="textarea json-box" readonly>${text}</textarea>`,
    foot: html`<button type="button" class="btn" data-act="modalCancel">Fechar</button><button type="button" class="btn btn-primary" data-act="copyFallback">${icon('copy')}Copiar tudo</button>`,
  });
}
A.copyFallback = () => { const ta = document.getElementById('fallback-text'); if (ta) copyText(ta.value, 'Conteúdo copiado. Cole em um arquivo e salve.', ta); };

/* ---------- área de transferência ---------- */
function copyText(text, okMsg = 'Copiado.', selectEl = null) {
  let p = null;
  try { p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : null; } catch (e) { p = null; }
  if (p && p.then) { p.then(() => toast(okMsg), () => fallbackCopy(text, okMsg, selectEl)); return; }
  fallbackCopy(text, okMsg, selectEl);
}
function fallbackCopy(text, okMsg, selectEl) {
  let ok = false;
  if (selectEl) { selectEl.focus(); selectEl.select(); try { ok = document.execCommand('copy'); } catch (e) { ok = false; } if (ok) toast(okMsg); else toast('Texto selecionado. Use Ctrl+C (ou Cmd+C) para copiar.', { type: 'info' }); return; }
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.top = '0';
  document.body.appendChild(ta); ta.select();
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  if (ok) toast(okMsg); else showTextFallback('texto', text);
}
A.copy = (el) => copyText(el.dataset.text, el.dataset.ok || 'Copiado.');

/* ---------- eventos globais ---------- */
function bindGlobalEvents() {
  document.addEventListener('click', (e) => {
    const mi = e.target.closest('[data-mi]');
    if (mi && menuState && menuState.el.contains(mi)) {
      const it = menuState.items[+mi.dataset.mi];
      if (!it || it.disabled) return;
      if (it.href) { closeMenu(); if (it.run) it.run(); return; }
      e.preventDefault();
      closeMenu();
      if (it.run) it.run();
      return;
    }
    if (menuState && !e.target.closest('.menu, .popover') && !(menuState.anchor && menuState.anchor.contains(e.target))) closeMenu();
    const sr = document.getElementById('search-results');
    if (sr && !e.target.closest('.top-search')) sr.hidden = true;
    const wa = e.target.closest('a[data-wa]');
    if (wa) { onWaClick(wa); return; }
    const t = e.target.closest('[data-act]');
    if (!t) return;
    if (t.hasAttribute('data-row')) {
      const inner = e.target.closest('button, a, select, input, label, textarea');
      if (inner && inner !== t && t.contains(inner)) return;
    }
    if (t.disabled || t.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
    const fn = A[t.dataset.act];
    if (!fn) return;
    if (t.tagName === 'A') e.preventDefault();
    fn(t, e);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (menuState) { const a = menuState.anchor; closeMenu(); if (a) a.focus(); return; }
      const sr = document.getElementById('search-results');
      if (sr && !sr.hidden) { sr.hidden = true; return; }
      if (modalStack.length && modalStack[modalStack.length - 1].dismissable) { closeModal(false); return; }
      if (ui.navOpen) { ui.navOpen = false; updateShell(); }
      return;
    }
    const row = e.target.closest && e.target.closest('[data-row]');
    if (row && (e.key === 'Enter' || e.key === ' ') && e.target === row) { e.preventDefault(); const fn = A[row.dataset.act]; if (fn) fn(row, e); return; }
    if (e.key === '/' && !e.target.closest('input, textarea, select, [contenteditable]') && !modalStack.length) {
      const s = document.getElementById('gsearch');
      if (s && s.offsetParent) { e.preventDefault(); s.focus(); }
    }
    if (menuState && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      const items = $$('button:not([disabled]), a', menuState.el);
      if (!items.length) return;
      e.preventDefault();
      const i = items.indexOf(document.activeElement);
      const next = e.key === 'ArrowDown' ? (i + 1) % items.length : (i - 1 + items.length) % items.length;
      items[next].focus();
    }
    if (e.key === 'Tab' && modalStack.length) {
      const m = modalStack[modalStack.length - 1].wrap;
      const f = $$('button:not([disabled]), a[href], input:not([disabled]):not([type=hidden]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])', m).filter((x) => x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  document.addEventListener('submit', (e) => {
    const f = e.target.closest('form[data-form]');
    if (!f) return;
    e.preventDefault();
    const fn = F[f.dataset.form];
    if (fn) fn(f, e);
  });
  document.addEventListener('change', (e) => {
    const t = e.target.closest('[data-change]');
    if (t && CH[t.dataset.change]) CH[t.dataset.change](t, e);
  });
  document.addEventListener('input', (e) => {
    if (e.target.form) clearFieldError(e.target);
    const t = e.target.closest('[data-input]');
    if (t && IN[t.dataset.input]) IN[t.dataset.input](t, e);
  });
  /* arrastar e soltar arquivos nas áreas de envio */
  document.addEventListener('dragover', (e) => { const z = e.target.closest && e.target.closest('.file-drop'); if (!z) return; e.preventDefault(); z.classList.add('drag'); });
  document.addEventListener('dragleave', (e) => { const z = e.target.closest && e.target.closest('.file-drop'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('drag'); });
  document.addEventListener('drop', (e) => {
    const z = e.target.closest && e.target.closest('.file-drop');
    if (!z) return;
    e.preventDefault();
    z.classList.remove('drag');
    const input = z.querySelector('input[type=file]');
    if (!input || !e.dataTransfer || !e.dataTransfer.files.length) return;
    try { input.files = e.dataTransfer.files; } catch (err) { return; }
    input.dispatchEvent(new Event('change', { bubbles: true }));
  });
  window.addEventListener('scroll', (e) => { if (menuState && !(e.target instanceof Node && menuState.el.contains(e.target))) followAnchor(); }, { passive: true, capture: true });
  let rz;
  window.addEventListener('resize', () => { if (menuState) closeMenu(); clearTimeout(rz); rz = setTimeout(() => mountCharts(), 120); });
}

function planCard(id) {
  const p = PLANS[id];
  const annual = ui.billCycle === 'anual';
  const pp = priceParts(annual ? p.annualMonthly : p.price);
  const lim = Number.isFinite(p.clients) ? `Até ${p.clients} clientes` : 'Clientes ilimitados';
  const prev = id === 'pro' ? 'Tudo do Básico, e mais:' : id === 'empresa' ? 'Tudo do Pro, e mais:' : '';
  return html`<article class="plan ${p.featured ? 'featured' : ''}">
    ${p.featured ? html`<span class="plan-tag">Mais escolhido</span>` : ''}
    <div class="stack" style="gap:6px"><h3 class="plan-name">${p.name}</h3><p class="plan-aud">${p.audience}</p></div>
    <div class="price-block">
      <div class="price"><span class="price-cur">R$</span><span class="price-val">${pp.int}</span><span class="price-per">/mês</span></div>
      <p class="price-sub">${annual ? `${fmtMoney(p.annualMonthly * 12)} por ano · economia de ${fmtMoney((p.price - p.annualMonthly) * 12)}` : `ou ${fmtMoney(p.annualMonthly)}/mês no plano anual`}</p>
    </div>
    <div class="plan-limits"><div class="plan-limit">${icon('users')}${lim}</div><div class="plan-limit">${icon('ai')}${p.ai} análises com IA por mês</div></div>
    <ul class="plan-list">
      ${prev ? html`<li class="plus">${prev}</li>` : ''}
      ${p.bullets.map((b) => html`<li>${icon('check')}<span>${b}</span></li>`)}
    </ul>
    <button type="button" class="btn ${p.featured ? 'btn-primary' : ''} btn-lg btn-block" data-act="goSignup" data-plan="${id}">Começar com o ${p.name}</button>
    <p class="plan-support">${icon(id === 'basico' ? 'mail' : 'chat', 'i-sm')}${p.support}</p>
  </article>`;
}
A.billCycle = (el) => {
  ui.billCycle = el.dataset.k === 'anual' ? 'anual' : 'mensal';
  $$('[data-act="billCycle"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.k === ui.billCycle ? 'true' : 'false'));
  const g = document.getElementById('pricing-grid');
  if (g) g.innerHTML = html`${PLAN_ORDER.map((id) => planCard(id))}`.s;
};
function compareTable() {
  const Y = html`<span class="yes" aria-label="Incluído">${icon('check')}</span>`;
  const N = html`<span class="no" aria-label="Não incluído">—</span>`;
  const S = html`<span class="tag tag-soon">Em breve</span>`;
  const rows = [
    ['Preço mensal', fmtMoney(PLANS.basico.price), fmtMoney(PLANS.pro.price), fmtMoney(PLANS.empresa.price)],
    ['No plano anual (por mês)', fmtMoney(PLANS.basico.annualMonthly), fmtMoney(PLANS.pro.annualMonthly), fmtMoney(PLANS.empresa.annualMonthly)],
    ['Clientes cadastrados', String(PLANS.basico.clients), String(PLANS.pro.clients), 'Ilimitados'],
    ['Análises com IA por mês', String(PLANS.basico.ai), String(PLANS.pro.ai), String(PLANS.empresa.ai)],
    ['Dashboard: a receber, em atraso e recuperado', Y, Y, Y],
    ['Mensalidades geradas automaticamente', Y, Y, Y],
    ['Atraso, multa e juros automáticos', Y, Y, Y],
    ['Pix copia e cola e QR Code em cada cobrança', Y, Y, Y],
    ['Recibo em PDF com valor por extenso', Y, Y, Y],
    ['Fechamento do dia, da semana e do mês com IA', Y, Y, Y],
    ['Pontualidade de cada cliente', Y, Y, Y],
    ['Importação de clientes por planilha', Y, Y, Y],
    ['Backup e portabilidade em JSON', Y, Y, Y],
    ['Baixa automática pelo extrato do banco', N, Y, Y],
    ['Conferência das taxas da maquininha', N, Y, Y],
    ['Cobrança rápida pelo WhatsApp', N, Y, Y],
    ['Acordos e renegociação de dívidas', N, Y, Y],
    ['Relatórios e fechamento em PDF e Excel', N, Y, Y],
    ['Multiusuários com permissões', N, N, Y],
    ['Régua de cobrança com fila diária', N, N, Y],
    ['WhatsApp e e-mail automáticos', N, N, S],
    ['Pix e boleto com baixa na hora', N, N, S],
    ['Suporte', 'E-mail', 'WhatsApp prioritário', 'WhatsApp prioritário'],
  ];
  return html`<table class="table"><thead><tr><th>Recurso</th><th>Básico</th><th>Pro</th><th>Empresa</th></tr></thead><tbody>
    ${rows.map((r) => html`<tr>${r.map((c) => html`<td>${c}</td>`)}</tr>`)}
  </tbody></table>`;
}

/* ---------- ações do site ---------- */
A.scrollTop = () => { if (ui.route.name !== 'landing' || me()) goPublic('landing'); else window.scrollTo({ top: 0, behavior: 'smooth' }); };
A.scrollTo = (el) => {
  const id = el.dataset.target;
  if (ui.route.name !== 'landing') { goPublic('landing', id); return; }
  const t = document.getElementById(id);
  if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
};
A.goLanding = () => goPublic('landing');

A.startDemo = async (el) => {
  if (el && el.disabled) return;
  if (Cloud.on) { toast('Para abrir a demonstração, saia primeiro da sua conta.', { type: 'info' }); return; }
  const btns = $$('[data-act="startDemo"]');
  btns.forEach((b) => { b.disabled = true; });
  try {
    await ensureCloud();
    let c = DB.meta.demoId ? DB.companies[DB.meta.demoId] : null;
    if (!c || !DB.users[DEMO_OWNER]) c = await createDemo();
    runAutoOverdue(c);
    DB.session = { email: DEMO_OWNER, realEmail: null };
    DB.users[DEMO_OWNER].lastLoginAt = Date.now();
    save();
    go('dashboard');
  } finally { btns.forEach((b) => { if (b.isConnected) b.disabled = false; }); }
};

F.forgot = async (f) => {
  const v = formValues(f);
  if (!showErrors(f, validEmail(v.email) ? {} : { email: 'Digite um e-mail válido.' })) return;
  if (cloudOff()) { formError(f, 'O login está indisponível agora. Tente de novo em instantes.'); return; }
  const btn = $('[form="f-forgot"]');
  setBusy(btn, true, 'Enviando…');
  const { error } = await Cloud.sb.auth.resetPasswordForEmail(v.email.trim().toLowerCase(), { redirectTo: sitePage() });
  setBusy(btn, false);
  if (error && /rate|limit|security purposes/i.test(error.message)) { formError(f, 'Você pediu vários links seguidos. Espere alguns minutos e tente de novo.'); return; }
  closeModal(true);
  toast('Se este e-mail tiver conta no Quitaí, o link chega em alguns minutos. Confira também o spam.', { timeout: 9000 });
};

function authErrorText(e) {
  const m = String((e && e.message) || '');
  if (/invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/email not confirmed/i.test(m)) return 'Confirme seu e-mail pelo link que enviamos antes de entrar.';
  if (/already registered|already been registered|exists/i.test(m)) return 'Já existe uma conta com este e-mail. Entre com sua senha ou use outro e-mail.';
  if (/password/i.test(m) && /weak|short|characters/i.test(m)) return 'Escolha uma senha mais forte, com pelo menos 8 caracteres.';
  if (/rate|too many/i.test(m)) return 'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.';
  return 'Não conseguimos falar com o servidor. Confira a internet e tente de novo.';
}
F.login = async (f) => {
  const v = formValues(f);
  const errs = {};
  if (!validEmail(v.email)) errs.email = 'Digite um e-mail válido.';
  if (!v.pass) errs.pass = 'Digite sua senha.';
  if (!showErrors(f, errs)) return;
  if (cloudOff()) { formError(f, 'O login está indisponível agora. Tente de novo em instantes.'); return; }
  const btn = f.querySelector('[type=submit]');
  const pass = f.elements.pass.value;
  setBusy(btn, true, 'Entrando…');
  const { error } = await Cloud.sb.auth.signInWithPassword({ email: v.email.trim().toLowerCase(), password: pass });
  if (error) { setBusy(btn, false); formError(f, authErrorText(error)); return; }
  const r = await cloudLoad();
  setBusy(btn, false);
  if (r.error) { await Cloud.sb.auth.signOut(); leaveCloud(); formError(f, r.error); return; }
  Cloud.sb.rpc('touch_login');
  runMaintenance();
  go('dashboard');
  if (r.user.mustChange) askNewPassword();
  else toast(`${greeting()}, ${r.user.name.split(' ')[0]}!`);
};
F.signup = async (f) => {
  const v = formValues(f);
  const errs = {};
  if (v.name.length < 2) errs.name = 'Digite seu nome.';
  if (v.company.length < 2) errs.company = 'Digite o nome da empresa.';
  if (!validEmail(v.email)) errs.email = 'Digite um e-mail válido.';
  if ((f.elements.pass.value || '').length < 8) errs.pass = 'A senha precisa ter pelo menos 8 caracteres.';
  if (!v.terms) errs.terms = 'Para criar a conta, aceite os termos de uso e a política de privacidade.';
  if (!showErrors(f, errs)) return;
  if (cloudOff()) { formError(f, 'O cadastro está indisponível agora. Tente de novo em instantes.'); return; }
  const btn = f.querySelector('[type=submit]');
  const pass = f.elements.pass.value;
  setBusy(btn, true, 'Criando sua conta…');
  const meta = { name: v.name.trim(), company: v.company.trim(), plan: PLANS[v.plan] ? v.plan : 'pro', segment: SEGMENTS[v.segment] ? v.segment : 'servicos' };
  const { data, error } = await Cloud.sb.auth.signUp({ email: v.email.trim().toLowerCase(), password: pass, options: { data: meta, emailRedirectTo: sitePage() } });
  if (error) { setBusy(btn, false); showErrors(f, { email: authErrorText(error) }); return; }
  if (!data.session) {
    // o projeto pede confirmação por e-mail: a empresa é criada no primeiro acesso
    setBusy(btn, false);
    if (data.user && Array.isArray(data.user.identities) && !data.user.identities.length) { showErrors(f, { email: authErrorText({ message: 'already registered' }) }); return; }
    openModal({ title: 'Confirme seu e-mail', size: 'sm', body: html`<p class="ink2">Enviamos um link para <strong>${v.email}</strong>. Abra o e-mail e clique no link para ativar sua conta e começar o teste grátis.</p><p class="hint">Não chegou? Confira o spam.</p>`, foot: html`<button type="button" class="btn btn-primary" data-act="modalCancel">Entendi</button>` });
    return;
  }
  const r = await cloudLoad();
  setBusy(btn, false);
  if (r.error) { await Cloud.sb.auth.signOut(); leaveCloud(); formError(f, r.error); return; }
  const c = co();
  logAct(c, 'account', `Criou a conta da empresa no plano ${PLANS[c.plan].name}, com ${TRIAL_DAYS} dias de teste grátis`);
  save();
  go('dashboard');
  toast(`Conta criada. Seu teste do plano ${planOf().name} vai até ${fmtDate(c.billing.trialEndsAt)}.`);
};
function askNewPassword(recovery = false) {
  ui.recovery = recovery;
  openModal({
    title: recovery ? 'Crie uma senha nova' : 'Crie sua senha', size: 'sm', dismissable: false,
    sub: recovery ? 'Você abriu o link de recuperação. Defina agora a sua senha nova.' : 'Você entrou com uma senha temporária. Defina agora uma senha só sua.',
    body: html`<form id="f-newpass" class="stack" data-form="newPass" novalidate>${passField('np-1', 'p1', 'Nova senha (mínimo 8 caracteres)', 'new-password')}${passField('np-2', 'p2', 'Repita a nova senha', 'new-password')}</form>`,
    foot: html`<button type="submit" form="f-newpass" class="btn btn-primary">Salvar senha</button>`,
  });
}
F.newPass = async (f) => {
  const p1 = f.elements.p1.value, p2 = f.elements.p2.value;
  const errs = {};
  if (p1.length < 8) errs.p1 = 'A senha precisa ter pelo menos 8 caracteres.';
  else if (p1 !== p2) errs.p2 = 'As senhas não são iguais.';
  if (!showErrors(f, errs)) return;
  const u = me();
  if (Cloud.on) {
    const btn = $('[form="f-newpass"]');
    setBusy(btn, true, 'Salvando…');
    const { error } = await Cloud.sb.auth.updateUser({ password: p1 });
    if (!error) await Cloud.sb.rpc('clear_must_change');
    setBusy(btn, false);
    if (error) { showErrors(f, { p1: /different|same/i.test(error.message) ? 'Escolha uma senha diferente da anterior.' : authErrorText(error) }); return; }
    u.mustChange = false;
  } else {
    u.salt = uid('s_');
    u.hash = await hashPass(p1, u.salt);
    u.mustChange = false;
    save();
  }
  closeModal(true);
  toast(ui.recovery ? 'Senha nova salva.' : 'Senha criada. Bem-vindo ao Quitaí!');
  ui.recovery = false;
};

          ${icon('search')}

function updateShell() {
  const u = me(), c = co();
  if (!u || !c) return;
  const shell = document.getElementById('shell');
  shell.classList.toggle('nav-open', ui.navOpen);
  document.getElementById('scrim').hidden = !ui.navOpen;
  document.getElementById('sidebar').innerHTML = viewSidebar().s;
  const notes = notifications(c);
  document.getElementById('bell-btn').innerHTML = html`${icon('bell')}${notes.length ? html`<span class="bell-dot">${notes.length}</span>` : ''}`.s;
  const aiBtn = document.getElementById('ai-btn');
  if (aiBtn) aiBtn.hidden = !aiReady();
  document.getElementById('top-new').innerHTML = (can('charges.edit') && c.clients.length ? html`<button type="button" class="btn btn-primary" data-act="newCharge">${icon('plus')}<span class="hide-sm">Nova cobrança</span></button>` : html``).s;
  document.getElementById('banners').innerHTML = viewBanners().s;
}

function viewSidebar() {
  const u = me(), c = co();
  const overdueN = c.charges.filter((x) => x.status === 'atrasado').length;
  const lim = clientLimit(c);
  const used = c.clients.length;
  const ratio = Number.isFinite(lim) ? used / lim : 0;
  const navBtn = (id) => {
    const p = PAGES[id];
    if (p.perm && !canSeePage(id)) return '';
    const locked = p.feature && !planHas(p.feature);
    const cur = ui.route.page === id || (id === 'clientes' && ui.route.page === 'cliente');
    return html`<button type="button" data-act="nav" data-page="${id}"${cur ? raw(' aria-current="page"') : ''}>${icon(p.icon)}<span>${p.title}</span><span class="nav-end">${id === 'cobrancas' && overdueN ? html`<span class="nav-count" title="${plural(overdueN, 'cobrança em atraso', 'cobranças em atraso')}">${overdueN}</span>` : ''}${locked ? html`<span title="Disponível no plano ${PLANS[FEATURE_PLAN[p.feature]].name}">${icon('lock', 'i-lock')}</span>` : ''}</span></button>`;
  };
  const bs = billingState(c);
  const planLabel = c.billing.complimentary ? `Plano ${planOf(c).name} · cortesia` : bs.kind === 'trial' ?`Plano ${planOf(c).name} · teste` : bs.kind === 'trial-ended' ? 'Teste encerrado' : bs.kind.startsWith('canceled') ? `Plano ${planOf(c).name} · cancelado` : `Plano ${planOf(c).name}`;
  return html`<div class="sb-top">
      <button type="button" class="btn btn-ghost" data-act="nav" data-page="dashboard" style="justify-self:start;padding:0 4px" aria-label="Ir para o painel">${logo()}</button>
      <div class="sb-company">
        ${c.logo ? html`<img class="co-logo" src="${c.logo}" alt="">` : html`<span class="avatar" aria-hidden="true">${initials(c.name)}</span>`}
        <div style="min-width:0"><div class="co-name ellipsis" title="${c.name}">${c.name}</div><div class="co-plan">${planLabel}</div></div>
      </div>
    </div>
    <nav class="nav" aria-label="Seções do painel">
      ${NAV_MAIN.map(navBtn)}
      <div class="nav-label">Gestão</div>
      ${NAV_ADMIN.map(navBtn)}
      ${canSeePage('admin') ? html`<div class="nav-label">Quitaí</div>${navBtn('admin')}` : ''}
    </nav>
    <div class="sb-bottom">
      <div class="usage">
        <div class="between"><span>Clientes</span><span class="tnum">${Number.isFinite(lim) ? `${used} de ${lim}` : `${used} · ilimitado`}</span></div>
        ${Number.isFinite(lim) ? html`<div class="meter-track" role="progressbar" aria-label="Clientes usados no plano" aria-valuemin="0" aria-valuemax="${lim}" aria-valuenow="${used}"><div class="meter-fill ${ratio >= 1 ? 'bad' : ratio >= 0.8 ? 'warn' : ''}" style="width:${Math.min(100, ratio * 100)}%"></div></div>` : ''}
      </div>
      ${syncBadge()}
      <button type="button" class="userbtn" data-act="userMenu" aria-haspopup="menu" aria-expanded="false">
        <span class="avatar" aria-hidden="true">${initials(u.name)}</span>
        <span style="min-width:0" class="grow"><span class="u-name ellipsis" style="display:block">${u.name}</span><span class="u-role">${ROLES[u.role].label}</span></span>
        ${icon('chevDown', 'i-sm')}
      </button>
    </div>`;
}
function canSeePage(id) {
  const p = PAGES[id];
  if (!p || !p.perm) return true;
  if (p.perm === 'platform') return !!(Cloud.on && Cloud.isAdmin && !isImpersonating());
  const u = me();
  const role = ROLES[u.role] || ROLES.leitura;
  return role.perms === '*' || role.perms.includes(p.perm);
}

function viewBanners() {
  const c = co();
  const out = [];
  if (isImpersonating()) {
    out.push(html`<div class="banner info">${icon('eye')}<span>Você está vendo o painel como <strong>${me().name}</strong> (${ROLES[me().role].label}).</span><span class="banner-act"><button type="button" class="btn btn-sm" data-act="stopImpersonate">Voltar para a minha conta</button></span></div>`);
  }
  if (c.isDemo && !isImpersonating()) {
    out.push(html`<div class="banner info">${icon('play')}<span><strong>Demonstração</strong> com dados de exemplo de um estúdio fictício. Tudo o que você mudar fica só neste navegador.</span><span class="banner-act"><button type="button" class="btn btn-sm" data-act="resetDemo">Restaurar exemplo</button><button type="button" class="btn btn-sm btn-primary" data-act="demoSignup">Criar minha conta</button></span></div>`);
  }
  const bs = billingState(c);
  const owner = me().role === 'owner';
  if (bs.kind === 'trial') {
    out.push(html`<div class="banner ${bs.left <= 2 ? 'warn' : 'info'}">${icon('clock')}<span>Teste grátis do plano <strong>${planOf(c).name}</strong>: ${bs.left === 0 ? 'termina hoje' : `faltam ${plural(bs.left, 'dia', 'dias')}`}.</span>${owner ? html`<span class="banner-act"><button type="button" class="btn btn-sm btn-primary" data-act="nav" data-page="assinatura">Assinar agora</button></span>` : ''}</div>`);
  } else if (bs.kind === 'trial-ended' || bs.kind === 'canceled-ended') {
    out.push(html`<div class="banner bad">${icon('lock')}<span>${bs.kind === 'trial-ended' ? 'Seu teste terminou.' : 'Sua assinatura foi cancelada.'} O painel está em modo leitura: seus dados estão guardados, mas não dá para editar.</span>${owner ? html`<span class="banner-act"><button type="button" class="btn btn-sm btn-primary" data-act="nav" data-page="assinatura">Escolher um plano</button></span>` : ''}</div>`);
  } else if (bs.kind === 'canceled-active') {
    out.push(html`<div class="banner warn">${icon('info')}<span>Assinatura cancelada. Você pode usar tudo até ${fmtDate(bs.until)}.</span>${owner ? html`<span class="banner-act"><button type="button" class="btn btn-sm" data-act="nav" data-page="assinatura">Reativar</button></span>` : ''}</div>`);
  }
  if (c.billing.pastDue) out.push(html`<div class="banner warn">${icon('alert')}<span>Não conseguimos cobrar a última fatura da assinatura. Atualize o cartão para não perder o acesso.</span>${owner ? html`<span class="banner-act"><button type="button" class="btn btn-sm btn-primary" data-act="billingPortal">Atualizar cartão</button></span>` : ''}</div>`);
  if (Sync.state === 'memory') out.push(html`<div class="banner warn">${icon('alert')}<span>Este navegador não está permitindo salvar dados. Exporte um backup antes de fechar a página.</span><span class="banner-act"><button type="button" class="btn btn-sm" data-act="exportJSON">Baixar backup</button></span></div>`);
  return html`${out}`;
}

function renderPage() {
  const el = document.getElementById('page');
  const id = ui.route.page;
  let p = PAGES[id];
  if (!p || (id === 'cliente' && !clientById(co(), ui.route.id))) { ui.route.page = id === 'cliente' ? 'clientes' : 'dashboard'; p = PAGES[ui.route.page]; }
  let v;
  if (p.perm && !canSeePage(ui.route.page)) v = viewNoAccess(p);
  else if (p.feature && !planHas(p.feature)) v = viewUpsell(p.feature);
  else v = p.view();
  el.innerHTML = v.s;
  mountCharts();
}
function refreshPage(keepFocus = true) {
  const active = document.activeElement;
  const id = active && active.id;
  const pos = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  updateShell();
  renderPage();
  if (keepFocus && id) {
    const n = document.getElementById(id);
    if (n && n !== document.body) { n.focus({ preventScroll: true }); if (pos != null && typeof n.setSelectionRange === 'function') { try { n.setSelectionRange(pos, pos); } catch (e) { /* ignora */ } } }
  }
}

/* ---------- gráfico de colunas: recebido por mês ---------- */
function niceMax(v) {
  if (v <= 0) return 1;
  const exp = Math.pow(10, Math.floor(Math.log10(v)));
  const f = v / exp;
  const nf = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 4 ? 4 : f <= 5 ? 5 : 10;
  return nf * exp;
}
function barPath(x, y, w, h, r) {
  if (h <= 0) return '';
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
const CHARTS = {};
CHARTS.received = (el, data) => {
  const W = Math.max(260, Math.floor(el.clientWidth));
  const H = 240;
  const m = { t: 26, r: 6, b: 30, l: W < 380 ? 52 : 64 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const max = niceMax(Math.max(...data.map((d) => d.total)));
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => f * max);
  const y = (v) => m.t + ih - (v / max) * ih;
  const band = iw / data.length;
  const bw = Math.min(24, band * 0.56);
  const maxIdx = data.reduce((bi, d, i, a) => (d.total > a[bi].total ? i : bi), 0);
  const curIdx = data.length - 1;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Gráfico de colunas: valor recebido em cada um dos últimos 6 meses">`;
  for (const tv of ticks) {
    const yy = Math.round(y(tv)) + 0.5;
    s += `<line class="${tv === 0 ? 'base' : 'gl'}" x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}"/>`;
    s += `<text class="tick" x="${m.l - 8}" y="${yy + 4}" text-anchor="end">${esc(fmtMoneyCompact(tv))}</text>`;
  }
  data.forEach((d, i) => {
    const cx = m.l + band * i + band / 2;
    const x = cx - bw / 2;
    const h = Math.max(0, (d.total / max) * ih);
    const yy = m.t + ih - h;
    if (h > 0) s += `<path id="bar-${i}" class="bar" d="${barPath(x, yy, bw, Math.max(h, 1), 4)}"/>`;
    else s += `<rect id="bar-${i}" x="${x}" y="${m.t + ih - 1}" width="${bw}" height="1" class="bar" opacity=".4"/>`;
    s += `<text class="xl ${i === curIdx ? 'cur' : ''}" x="${cx}" y="${H - 8}" text-anchor="middle">${esc(fmtMonthKey(d.key, true))}</text>`;
    if ((i === curIdx || i === maxIdx) && d.total > 0) s += `<text class="dl" x="${cx}" y="${yy - 8}" text-anchor="middle">${esc(fmtMoneyCompact(d.total))}</text>`;
    const tt = fmtMoney(d.total);
    const sub = `${fmtMonthKey(d.key)}${d.current ? ' (até hoje)' : ''} · ${plural(d.count, 'pagamento', 'pagamentos')}${d.recovered ? ' · ' + fmtMoney(d.recovered) + ' recuperado' : ''}`;
    s += `<rect class="hit" x="${m.l + band * i}" y="${m.t}" width="${band}" height="${ih}" tabindex="0" data-tt="${esc(tt)}" data-tt-sub="${esc(sub)}" data-tt-anchor="bar-${i}" data-bar="bar-${i}" aria-label="${esc(fmtMonthKey(d.key) + ': ' + tt)}"/>`;
  });
  s += '</svg>';
  el.innerHTML = s;
};
function receivedTable(data) {
  return html`<div class="table-wrap"><table class="table"><thead><tr><th>Mês</th><th class="num">Recebido</th><th class="num">Pagamentos</th><th class="num">Recuperado</th></tr></thead><tbody>
    ${data.map((d) => html`<tr><td>${fmtMonthKey(d.key)}${d.current ? html` <span class="muted">(até hoje)</span>` : ''}</td><td class="num">${fmtMoney(d.total)}</td><td class="num">${d.count}</td><td class="num">${fmtMoney(d.recovered)}</td></tr>`)}

function bindTooltips() {
  const tt = document.createElement('div');
  tt.className = 'tooltip';
  tt.id = 'tt';
  tt.setAttribute('role', 'tooltip');
  tt.hidden = true;
  document.body.appendChild(tt);
  let cur = null;
  const show = (el) => {
    cur = el;
    const anchor = (el.dataset.ttAnchor && document.getElementById(el.dataset.ttAnchor)) || el;
    const r = anchor.getBoundingClientRect();
    tt.innerHTML = `<strong>${esc(el.dataset.tt)}</strong>${el.dataset.ttSub ? `<span class="tt-sub">${esc(el.dataset.ttSub)}</span>` : ''}`;
    tt.hidden = false;
    const w = tt.offsetWidth, h = tt.offsetHeight;
    const vw = document.documentElement.clientWidth;
    let left = r.left + r.width / 2;
    left = clamp(left, w / 2 + 8, vw - w / 2 - 8);
    let top = r.top;
    if (top - h - 12 < 8) top = r.bottom + h + 12;
    tt.style.left = left + 'px';
    tt.style.top = top + 'px';
    if (el.dataset.bar) {
      const svg = el.closest('svg');
      if (svg) svg.querySelectorAll('.bar').forEach((b) => b.classList.toggle('dim', b.id !== el.dataset.bar));
    }
  };
  const hide = (el) => {
    if (cur !== el) return;
    cur = null;
    tt.hidden = true;
    const svg = el.closest && el.closest('svg');
    if (svg) svg.querySelectorAll('.bar.dim').forEach((b) => b.classList.remove('dim'));
  };
  document.addEventListener('pointerover', (e) => { const el = e.target.closest && e.target.closest('[data-tt]'); if (el && el !== cur) show(el); });
  document.addEventListener('pointerout', (e) => { const el = e.target.closest && e.target.closest('[data-tt]'); if (el && !(e.relatedTarget && el.contains(e.relatedTarget))) hide(el); });
  document.addEventListener('focusin', (e) => { const el = e.target.closest && e.target.closest('[data-tt]'); if (el) show(el); });
  document.addEventListener('focusout', (e) => { const el = e.target.closest && e.target.closest('[data-tt]'); if (el) hide(el); });
  window.addEventListener('scroll', () => { if (cur) hide(cur); }, { passive: true, capture: true });
}

function filteredClients(c, stats, punct) {
  const q = norm(ui.clients.q), d = onlyDigits(ui.clients.q);

    if (ui.clients.filter !== 'todos' && clientSituation(stats.get(cl.id)) !== ui.clients.filter) return false;
    if (!q) return true;
    return norm(cl.name).includes(q) || norm(cl.email).includes(q) || norm(cl.contact).includes(q) || (d.length >= 3 && (onlyDigits(cl.doc).includes(d) || onlyDigits(cl.phone).includes(d)));
  });
  const s = ui.clients.sort;
  const pv = (id) => { const p = punct && punct.get(id); return p && p.pct != null ? p.pct : 101; };
  list = list.slice().sort((a, b) => {
    if (s === 'atraso') return stats.get(b.id).overdue - stats.get(a.id).overdue || a.name.localeCompare(b.name, 'pt-BR');
    if (s === 'aberto') return stats.get(b.id).open - stats.get(a.id).open || a.name.localeCompare(b.name, 'pt-BR');

function clientTimeline(c, cl, charges) {
  const ids = new Set(charges.map((ch) => ch.id));
  const ev = [];
  for (const ch of charges) {
    for (const l of ch.log || []) {
      const n = '#' + numStr(ch.num);
      if (!l.from) { if (l.by !== 'auto') ev.push({ at: l.at, by: l.by, type: 'charge', text: `${n} lançada: ${ch.desc}, ${fmtMoney(ch.amount)}` }); }
      else ev.push({ at: l.at, by: l.by, type: l.by === 'auto' ? 'auto' : l.to === 'pago' ? 'paid' : 'status', text: `${n} passou de ${(STATUS[l.from] || {}).label || l.from} para ${(STATUS[l.to] || {}).label || l.to}${l.note ? ' · ' + l.note : ''}` });
    }
  }
  for (const a of c.activity) if ((['wa', 'deal', 'rec'].includes(a.type) && ids.has(a.ref)) || (a.type === 'client' && a.ref === cl.id)) ev.push(a);
  return ev.sort((a, b) => b.at - a.at).slice(0, 14);
}

async function confirmDeleteClient(id) {
  const c = co();

  const n = c.charges.filter((x) => x.clientId === id).length;

/* ---------- importação de clientes (CSV) ---------- */
const CSV_FIELDS = {
  name: ['nome', 'cliente', 'razao social', 'razão social', 'nome completo', 'name'],
  email: ['email', 'e-mail', 'e mail'],
  phone: ['whatsapp', 'telefone', 'celular', 'fone', 'phone', 'contato telefone'],
  doc: ['cpf', 'cnpj', 'cpf/cnpj', 'cpf_cnpj', 'documento', 'doc'],
  city: ['cidade', 'municipio', 'município'],
  state: ['uf', 'estado'],
  notes: ['observacoes', 'observações', 'obs', 'notas'],
};
function mapCSV(rows) {
  if (!rows.length) return { map: {}, items: [] };
  const header = rows[0].map((h) => norm(h));
  const map = {};
  for (const [key, names] of Object.entries(CSV_FIELDS)) {
    const idx = header.findIndex((h) => names.map(norm).includes(h));
    if (idx >= 0) map[key] = idx;
  }
  const items = rows.slice(1).map((r) => {
    const o = {};
    for (const [k, i] of Object.entries(map)) o[k] = String(r[i] || '').trim();
    return o;
  }).filter((o) => o.name);
  return { map, items };
}

CH.csvFile = (el) => {
  const file = el.files && el.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let text = String(reader.result || '');
    if (text.includes('\uFFFD')) {
      const r2 = new FileReader();
      r2.onload = () => csvPreview(String(r2.result || ''), file.name);
      r2.readAsText(file, 'windows-1252');
      return;
    }
    csvPreview(text, file.name);
  };
  reader.onerror = () => toast('Não foi possível ler o arquivo.', { type: 'bad' });
  reader.readAsText(file, 'utf-8');
};
function csvPreview(text, name) {
  const c = co();
  const { map, items } = mapCSV(parseCSV(text));
  const box = document.getElementById('csv-preview');
  const btn = document.getElementById('csv-go');
  if (!box) return;
  if (!('name' in map)) {
    box.innerHTML = html`<div class="callout bad">${icon('alert')}<div>Não encontramos a coluna <strong>nome</strong> em ${name}. Confira se a primeira linha tem os títulos das colunas.</div></div>`.s;
    btn.disabled = true; ui.importPreview = null; return;
  }
  const existingDocs = new Set(c.clients.map((x) => onlyDigits(x.doc)).filter(Boolean));
  const existingEmails = new Set(c.clients.map((x) => (x.email || '').toLowerCase()).filter(Boolean));
  const fresh = [], dup = [];
  const seen = new Set();
  for (const it of items) {
    const d = onlyDigits(it.doc), e = (it.email || '').toLowerCase();
    const key = d || e || norm(it.name);
    if ((d && existingDocs.has(d)) || (e && existingEmails.has(e)) || seen.has(key)) dup.push(it); else { fresh.push(it); seen.add(key); }
  }
  const lim = clientLimit(c);
  const room = Number.isFinite(lim) ? Math.max(0, lim - c.clients.length) : Infinity;
  const willImport = Math.min(fresh.length, room);
  ui.importPreview = fresh.slice(0, willImport);
  const labels = { name: 'Nome', email: 'E-mail', phone: 'WhatsApp', doc: 'CPF/CNPJ', city: 'Cidade', state: 'UF', notes: 'Observações' };
  box.innerHTML = html`<div class="stack">
    <div class="summary-line"><span><strong>${items.length}</strong> linhas com nome</span><span><strong>${willImport}</strong> serão importadas</span>${dup.length ? html`<span><strong>${dup.length}</strong> já existem e serão ignoradas</span>` : ''}</div>
    ${fresh.length > room ? html`<div class="callout warn">${icon('alert')}<div>O plano ${planOf(c).name} permite ${lim} clientes. ${fresh.length - room} ${fresh.length - room === 1 ? 'linha ficará' : 'linhas ficarão'} de fora. Mude de plano para importar todos.</div></div>` : ''}
    <p class="hint">Colunas reconhecidas: ${Object.keys(map).map((k) => labels[k]).join(', ')}.</p>
    <div class="table-wrap" style="border:1px solid var(--line);border-radius:10px"><table class="table"><thead><tr>${Object.keys(map).map((k) => html`<th>${labels[k]}</th>`)}</tr></thead><tbody>${fresh.slice(0, 5).map((it) => html`<tr>${Object.keys(map).map((k) => html`<td>${it[k] || ''}</td>`)}</tr>`)}</tbody></table></div>
    ${fresh.length > 5 ? html`<p class="hint">E mais ${fresh.length - 5}…</p>` : ''}
  </div>`.s;
  btn.disabled = willImport === 0;
  btn.textContent = willImport ? `Importar ${plural(willImport, 'cliente', 'clientes')}` : 'Nada para importar';
}
A.csvImport = () => {

/* ---------- WhatsApp ---------- */
function waButton(c, cl, list, { kind = null, label = 'Cobrar', size = 'btn-sm' } = {}) {
  if (!list || !list.length) return '';
  if (planHas('whatsapp') && !can('whatsapp')) return '';
  if (!planHas('whatsapp')) return html`<button type="button" class="btn btn-wa ${size}" data-act="upgrade" data-feature="whatsapp" title="Disponível a partir do plano Pro">${icon('chat')}${label}${icon('lock', 'i-sm badge-lock')}</button>`;
  if (!cl || !waNumber(cl.phone)) return html`<button type="button" class="btn btn-wa ${size}" data-act="waMissing" data-client="${cl ? cl.id : ''}" title="Cliente sem WhatsApp cadastrado">${icon('chat')}${label}</button>`;
  const ids = list.map((x) => x.id).join(',');
  if (c.isDemo) return html`<button type="button" class="btn btn-wa ${size}" data-act="waPreview" data-client="${cl.id}" data-ids="${ids}" data-kind="${kind || ''}">${icon('chat')}${label}</button>`;
  return html`<a class="btn btn-wa ${size}" href="${waLink(c, cl.phone, buildMessage(c, cl, list, kind))}" target="_blank" rel="noopener noreferrer" data-wa="1" data-client="${cl.id}" data-ids="${ids}" aria-label="${label}: abrir o WhatsApp com a mensagem para ${cl.name}">${icon('chat')}${label}</a>`;
}
function onWaClick(a) {
  const c = co();
  const ids = (a.dataset.ids || '').split(',').filter(Boolean);
  recordContact(c, ids, a.dataset.client);
  save();
  const cl = clientById(c, a.dataset.client);
  toast(`Tentativa de cobrança registrada no histórico${cl ? ' de ' + cl.name : ''}. Envie a mensagem no WhatsApp.`, { type: 'info' });
  setTimeout(() => refreshPage(), 400);
}
A.upgrade = (el) => upgradePrompt(el.dataset.feature);
A.waMissing = (el) => {
  const id = el.dataset.client;
  toast('Este cliente não tem WhatsApp cadastrado.', { type: 'warn', action: can('clients.edit') && id ? { label: 'Adicionar número', run: () => openClientModal(id) } : null });
};
A.waPreview = (el) => {
  const c = co();
  const cl = clientById(c, el.dataset.client);
  const list = el.dataset.ids.split(',').map((id) => chargeById(c, id)).filter(Boolean);
  if (!cl || !list.length) return;
  const text = buildMessage(c, cl, list, el.dataset.kind || null);
  recordContact(c, list.map((x) => x.id), cl.id);
  save();
  openModal({
    title: 'Mensagem pronta para o WhatsApp', size: 'sm',
    body: html`<div class="callout">${icon('info')}<div>Na demonstração os contatos são fictícios, então o WhatsApp não é aberto. Na sua conta, este botão abre o WhatsApp de ${cl.name.split(' ')[0]} com esta mensagem.</div></div><p class="preview-msg" id="wa-prev">${text}</p>`,
    foot: html`<button type="button" class="btn" data-act="modalCancel">Fechar</button><button type="button" class="btn btn-primary" data-act="copy" data-text="${text}" data-ok="Mensagem copiada.">${icon('copy')}Copiar mensagem</button>`,
    onClose: () => refreshPage(),
  });
};
function openCustomMessage(clientId, chargeIds) {
  const c = co();
  const cl = clientById(c, clientId);
  const list = chargeIds.map((id) => chargeById(c, id)).filter(Boolean);
  if (!cl) return;
  const text = list.length ? buildMessage(c, cl, list) : `Olá, ${firstName(cl)}! Tudo bem?\n\n${c.name}`;
  const link = c.isDemo ? '' : waLink(c, cl.phone, text);
  openModal({
    title: `Mensagem para ${cl.name}`, size: 'sm', sub: 'Edite o texto antes de abrir o WhatsApp.',
    body: html`<div class="field"><label for="wa-custom">Mensagem</label><textarea id="wa-custom" class="textarea" rows="9" data-input="waCustom" data-client="${cl.id}">${text}</textarea></div>${c.isDemo ? html`<p class="hint">Na demonstração, o WhatsApp não é aberto porque os contatos são fictícios.</p>` : ''}`,
    foot: html`<button type="button" class="btn" data-act="copyCustom">${icon('copy')}Copiar</button>${c.isDemo ? html`<button type="button" class="btn btn-primary" data-act="modalCancel">Fechar</button>` : html`<a id="wa-custom-link" class="btn btn-wa" href="${link}" target="_blank" rel="noopener noreferrer" data-wa="1" data-client="${cl.id}" data-ids="${list.map((x) => x.id).join(',')}">${icon('chat')}Abrir no WhatsApp</a>`}`,
  });
}
IN.waCustom = (el) => {
  const c = co();
  const cl = clientById(c, el.dataset.client);
  const a = document.getElementById('wa-custom-link');
  if (a && cl) a.href = waLink(c, cl.phone, el.value);
};
A.copyCustom = () => { const ta = document.getElementById('wa-custom'); if (ta) copyText(ta.value, 'Mensagem copiada.', ta); };

/* ============================================================
   Cobranças: lista com filtros, status manual, lançamento,
   pagamento, detalhes, ações em lote.
   ============================================================ */
const PERIODS = [
  ['todos', 'Qualquer vencimento'], ['hoje', 'Vencem hoje'], ['proximos-7', 'Próximos 7 dias'], ['este-mes', 'Este mês'],
  ['proximo-mes', 'Próximo mês'], ['mes-passado', 'Mês passado'], ['vencidas', 'Já vencidas'], ['personalizado', 'Período personalizado'],
];
function periodRange(p, from, to) {
  const t = todayISO();
  switch (p) {
    case 'hoje': return [t, t];
    case 'proximos-7': return [t, addDays(t, 7)];
    case 'este-mes': return [monthStart(t), monthEnd(t)];
    case 'proximo-mes': { const s = addMonths(monthStart(t), 1); return [s, monthEnd(s)]; }
    case 'mes-passado': { const s = addMonths(monthStart(t), -1); return [s, monthEnd(s)]; }
    case 'vencidas': return ['0000-01-01', addDays(t, -1)];
    case 'personalizado': return [from || '0000-01-01', to || '9999-12-31'];
    default: return null;
  }
}
function filterCharges(c, f, { ignoreStatus = false } = {}) {
  const r = periodRange(f.period, f.from, f.to);
  const q = norm(f.q);
  const names = new Map(c.clients.map((x) => [x.id, norm(x.name)]));
  const numQ = f.q.trim().replace(/^#/, '');
  return c.charges.filter((ch) => {
    if (!ignoreStatus && f.status !== 'todas' && ch.status !== f.status && !(f.keep && f.keep.has(ch.id))) return false;
    if (f.client && ch.clientId !== f.client) return false;
    if (r && (ch.due < r[0] || ch.due > r[1])) return false;
    if (q && !(norm(ch.desc).includes(q) || (names.get(ch.clientId) || '').includes(q) || (/^\d+$/.test(numQ) && String(ch.num) === String(+numQ)))) return false;
    return true;
  });
}
function sortCharges(list, sort, c) {
  const names = new Map(c.clients.map((x) => [x.id, x.name]));
  const rank = { atrasado: 0, pendente: 1, pago: 2, cancelado: 3 };
  const keep = ui.charges.keep;
  const st = (x) => (keep && keep.has(x.id) ? keep.get(x.id) : x.status);
  const cmp = {
    relevancia: (a, b) => {
      const sa = st(a), sb = st(b);
      if (rank[sa] !== rank[sb]) return rank[sa] - rank[sb];
      if (sa === 'pago' && a.paidAt && b.paidAt) return b.paidAt.localeCompare(a.paidAt) || b.num - a.num;
      if (sa === 'cancelado') return b.due.localeCompare(a.due) || b.num - a.num;
      return a.due < b.due ? -1 : a.due > b.due ? 1 : a.num - b.num;
    },
    'venc-asc': (a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : a.num - b.num),
    'venc-desc': (a, b) => (a.due > b.due ? -1 : a.due < b.due ? 1 : b.num - a.num),
    'valor-desc': (a, b) => b.amount - a.amount,
    'valor-asc': (a, b) => a.amount - b.amount,
    cliente: (a, b) => (names.get(a.clientId) || '').localeCompare(names.get(b.clientId) || '', 'pt-BR') || (a.due < b.due ? -1 : 1),
    recentes: (a, b) => b.createdAt - a.createdAt || b.num - a.num,
  }[sort] || ((a, b) => (a.due < b.due ? -1 : 1));
  return list.slice().sort(cmp);
}

function viewCharges() {
  const c = co();
  const f = ui.charges;
  const base = filterCharges(c, f, { ignoreStatus: true });
  const tabs = [['todas', 'Todas'], ['pendente', 'Pendentes'], ['atrasado', 'Em atraso'], ['pago', 'Pagas'], ['cancelado', 'Canceladas']];
  const count = (k) => (k === 'todas' ? base.length : base.filter((x) => x.status === k).length);
  const clients = c.clients.slice().sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
  return html`
  <div class="page-head">
    <div><h2>Cobranças</h2><p class="page-sub">Mude o status direto na lista. O atraso é marcado sozinho quando o vencimento passa${feeRules(c).on ? ', com multa e juros calculados' : ''}.</p></div>
    <div class="page-actions">${can('charges.status') ? html`<button type="button" class="btn" data-act="goStatement">${icon('bank')}Dar baixa pelo extrato</button>` : ''}</div>
  </div>
  <div class="card">
    <div class="card-body stack" style="gap:14px">
      <div class="tabs" role="tablist" aria-label="Filtrar por status">${tabs.map(([k, l]) => html`<button type="button" role="tab" aria-selected="${f.status === k ? 'true' : 'false'}" data-act="chargeTab" data-k="${k}">${l}<span class="count">${count(k)}</span></button>`)}</div>
      <div class="toolbar">
        <div class="search">${icon('search')}<label for="ch-q" class="sr-only">Buscar cobranças</label><input id="ch-q" class="input" type="search" placeholder="Cliente, descrição ou nº" value="${f.q}" data-input="chargeQ" autocomplete="off"></div>
        <span class="select-wrap"><label for="ch-period" class="sr-only">Vencimento</label><select id="ch-period" class="select" data-change="chargePeriod">${PERIODS.map(([v, l]) => html`<option value="${v}"${sel(f.period === v)}>${l}</option>`)}</select></span>
        <span class="select-wrap"><label for="ch-client" class="sr-only">Cliente</label><select id="ch-client" class="select" data-change="chargeClient"><option value="">Todos os clientes</option>${clients.map((cl) => html`<option value="${cl.id}"${sel(f.client === cl.id)}>${cl.name}</option>`)}</select></span>
        <span class="select-wrap"><label for="ch-sort" class="sr-only">Ordenar</label><select id="ch-sort" class="select" data-change="chargeSort">${[['relevancia', 'Mais relevantes'], ['venc-asc', 'Vencimento: antigo → novo'], ['venc-desc', 'Vencimento: novo → antigo'], ['valor-desc', 'Maior valor'], ['valor-asc', 'Menor valor'], ['cliente', 'Cliente (A–Z)'], ['recentes', 'Lançadas por último']].map(([v, l]) => html`<option value="${v}"${sel(f.sort === v)}>${l}</option>`)}</select></span>
        ${f.period === 'personalizado' ? html`<div class="row"><label for="ch-from" class="sr-only">De</label><input id="ch-from" type="date" class="input" style="width:auto" value="${f.from}" data-change="chargeFrom"><span class="muted">até</span><label for="ch-to" class="sr-only">Até</label><input id="ch-to" type="date" class="input" style="width:auto" value="${f.to}" data-change="chargeTo"></div>` : ''}
        ${f.q || f.period !== 'todos' || f.client || f.status !== 'todas' ? html`<button type="button" class="btn btn-ghost btn-sm" data-act="clearChargeFilters">${icon('x', 'i-sm')}Limpar filtros</button>` : ''}
      </div>
    </div>
    <div id="charge-list">${chargeListHTML(c)}</div>
  </div>`;
}
function chargeListHTML(c) {
  const f = ui.charges;
  const list = sortCharges(filterCharges(c, f), f.sort, c);
  for (const id of Array.from(f.sel)) if (!chargeById(c, id)) f.sel.delete(id);
  if (!c.charges.length) {
    return html`<div class="empty"><span class="empty-ico">${icon('receipt', 'i-lg')}</span><h3>Nenhuma cobrança lançada</h3><p>${c.clients.length ? 'Lance a primeira cobrança: valor, vencimento e pronto. Dá para parcelar ou repetir todo mês.' : 'Primeiro cadastre um cliente. Depois é só lançar as cobranças dele.'}</p>${can('charges.edit') ? (c.clients.length ? html`<button type="button" class="btn btn-primary" data-act="newCharge">${icon('plus')}Lançar cobrança</button>` : html`<button type="button" class="btn btn-primary" data-act="newClient">${icon('userPlus')}Cadastrar cliente</button>`) : ''}</div>`;
  }
  if (!list.length) return html`<div class="empty empty-sm"><span class="empty-ico">${icon('filter')}</span><h3>Nenhuma cobrança com esses filtros</h3><p>Mude o período, o cliente ou o status para ver mais resultados.</p><button type="button" class="btn btn-sm" data-act="clearChargeFilters">Limpar filtros</button></div>`;
  const total = sumBy(list, (x) => (x.status === 'pago' ? x.paidAmount || 0 : x.status === 'cancelado' ? 0 : x.amount));
  const shown = list.slice(0, f.limit);
  const selN = f.sel.size;
  return html`
    ${selN ? html`<div class="card-body" style="padding-bottom:0"><div class="bulkbar" role="region" aria-label="Ações em lote"><span>${plural(selN, 'cobrança selecionada', 'cobranças selecionadas')}</span>
      <span class="row-wrap" style="margin-left:auto">${can('charges.status') ? html`<button type="button" class="btn btn-sm" data-act="bulkPaid">${icon('checkCircle')}Marcar como pagas</button><button type="button" class="btn btn-sm" data-act="bulkStatus" aria-haspopup="menu" aria-expanded="false">Mudar status ${icon('chevDown', 'i-sm')}</button>` : ''}${can('charges.edit') ? html`<button type="button" class="btn btn-sm btn-danger-outline" data-act="bulkDelete">${icon('trash')}Excluir</button>` : ''}<button type="button" class="btn btn-sm btn-ghost" data-act="clearSel">Limpar seleção</button></span></div></div>` : ''}
    <div class="card-body" style="padding-block:10px 12px"><div class="summary-line"><span><strong>${plural(list.length, 'cobrança', 'cobranças')}</strong></span><span>Total: <strong>${fmtMoney(total)}</strong></span>${f.status === 'todas' ? html`<span>Pendente: <strong>${fmtMoney(sumBy(list.filter((x) => x.status === 'pendente'), (x) => x.amount))}</strong></span><span>Em atraso: <strong>${fmtMoney(sumBy(list.filter((x) => x.status === 'atrasado'), (x) => x.amount))}</strong></span>` : ''}</div></div>
    ${chargesTable(c, shown, { selectable: can('charges.status') || can('charges.edit'), showClient: true, allSelected: shown.length > 0 && shown.every((x) => f.sel.has(x.id)) })}
    ${list.length > shown.length ? html`<div class="card-foot"><span class="muted">Mostrando ${shown.length} de ${list.length}</span><button type="button" class="btn btn-sm" data-act="moreCharges">Mostrar mais</button></div>` : ''}`;
}
function chargesTable(c, list, { selectable = false, showClient = true, allSelected = false } = {}) {
  const clMap = new Map(c.clients.map((x) => [x.id, x]));
  const t = todayISO();
  return html`<div class="table-wrap"><table class="table responsive">
    <thead><tr>
      ${selectable ? html`<th class="cb"><input type="checkbox" aria-label="Selecionar todas as cobranças visíveis" data-change="selAll"${chk(allSelected)}></th>` : ''}
      <th>Nº</th><th>Vencimento</th>${showClient ? html`<th>Cliente</th>` : ''}<th>Descrição</th><th class="num">Valor</th><th>Status</th><th class="actions"><span class="sr-only">Ações</span></th>
    </tr></thead>
    <tbody>${list.map((ch) => {
      const cl = clMap.get(ch.clientId);
      const rel = relDue(ch.due, ch.status);
      const late = ch.status === 'atrasado' || (ch.status === 'pendente' && ch.due < t);
      const flash = ui.flashPaid && ui.flashPaid.id === ch.id && Date.now() < ui.flashPaid.until;
      const open = ch.status === 'pendente' || ch.status === 'atrasado';
      const upd = open ? chargeDue(c, ch, t) : null;
      return html`<tr class="${ui.charges.sel.has(ch.id) ? 'is-selected' : ''}">
        ${selectable ? html`<td class="cb"><input type="checkbox" aria-label="Selecionar #${numStr(ch.num)}" data-change="selCharge" data-id="${ch.id}"${chk(ui.charges.sel.has(ch.id))}></td>` : ''}
        <td data-label="Nº"><button type="button" class="link-btn num-id" style="text-decoration:none" data-act="openCharge" data-id="${ch.id}">#${numStr(ch.num)}</button></td>
        <td data-label="Vencimento" class="nowrap"><div><div class="tnum" style="font-weight:600">${fmtDate(ch.due)}</div>${rel ? html`<div class="cell-sub" style="${late ? 'color:var(--bad)' : ''}">${rel}</div>` : ''}</div></td>
        ${showClient ? html`<td class="td-main td-client"><button type="button" class="link-btn cell-main" style="text-decoration:none;color:var(--ink);text-align:left" data-act="openClient" data-id="${ch.clientId}">${cl ? cl.name : 'Cliente removido'}</button></td>` : ''}
        <td data-label="Descrição"><div class="desc-cell"><div class="ellipsis" title="${ch.desc}">${ch.recId ? html`<span class="desc-ico" title="Mensalidade automática">${icon('repeat', 'i-sm')}</span>` : ''}${ch.agreementId && ch.recovery ? html`<span class="desc-ico" title="Parcela de acordo">${icon('fileCheck', 'i-sm')}</span>` : ''}${ch.desc}</div>${ch.contacts ? html`<div class="cell-sub">${icon('chat', 'i-sm')} cobrado ${plural(ch.contacts, 'vez', 'vezes')} · ${timeAgo(ch.lastContactAt)}</div>` : ''}</div></td>
        <td data-label="Valor" class="num"><div><div style="font-weight:650">${fmtMoney(ch.amount)}</div>${ch.status === 'pago' ? html`<div class="cell-sub">pago em ${fmtDateShort(ch.paidAt)}${ch.paidAmount !== ch.amount ? ` · ${fmtMoney(ch.paidAmount)}` : ''}</div>` : upd && upd.total > upd.base ? html`<div class="cell-sub upd" title="Multa ${fmtMoney(upd.fine)} + juros ${fmtMoney(upd.interest)} (${plural(upd.days, 'dia', 'dias')})">atualizado ${fmtMoney(upd.total)}</div>` : ''}</div></td>
        <td data-label="Status" class="status-cell">${statusControl(ch)}${flash ? html`<span class="paid-stamp" aria-hidden="true">PAGO</span>` : ''}</td>
        <td class="actions"><span class="actions-inner">${open ? waButton(c, cl, [ch], { label: late ? 'Cobrar' : 'Lembrar', size: 'btn-xs' }) : ''}<button type="button" class="btn btn-ghost btn-icon btn-xs" data-act="chargeMenu" data-id="${ch.id}" aria-label="Mais ações para #${numStr(ch.num)}" aria-haspopup="menu" aria-expanded="false">${icon('more')}</button></span></td>
      </tr>`;
    })}</tbody>
  </table></div>`;
}
function statusChip(st) { const s = STATUS[st]; return html`<span class="chip ${s.cls}">${icon(s.icon)}${s.label}</span>`; }
function statusControl(ch) {
  if (!can('charges.status')) return statusChip(ch.status);
  const s = STATUS[ch.status];
  return html`<span class="status-pill ${s.cls}">${icon(s.icon)}<select data-change="chargeStatus" data-id="${ch.id}" aria-label="Status da cobrança #${numStr(ch.num)}">${STATUS_ORDER.map((k) => html`<option value="${k}"${sel(k === ch.status)}>${STATUS[k].label}</option>`)}</select>${icon('chevDown', 'chev')}</span>`;
}
function refreshChargeList() { const el = document.getElementById('charge-list'); if (el) el.innerHTML = chargeListHTML(co()).s; else refreshPage(); }
IN.chargeQ = (el) => { ui.charges.q = el.value; ui.charges.limit = 50; refreshChargeList(); };
CH.chargePeriod = (el) => { ui.charges.period = el.value; ui.charges.limit = 50; ui.charges.keep.clear(); refreshPage(); };
CH.chargeClient = (el) => { ui.charges.client = el.value; ui.charges.limit = 50; ui.charges.keep.clear(); refreshPage(); };
CH.chargeSort = (el) => { ui.charges.sort = el.value; refreshChargeList(); };
CH.chargeFrom = (el) => { ui.charges.from = el.value; refreshPage(); };
CH.chargeTo = (el) => { ui.charges.to = el.value; refreshPage(); };
A.chargeTab = (el) => { ui.charges.status = el.dataset.k; ui.charges.limit = 50; ui.charges.sel.clear(); ui.charges.keep.clear(); refreshPage(); };
A.clearChargeFilters = () => { ui.charges = defaultChargeFilters(); refreshPage(); };
A.moreCharges = () => { ui.charges.limit += 50; refreshChargeList(); };
CH.selCharge = (el) => { if (el.checked) ui.charges.sel.add(el.dataset.id); else ui.charges.sel.delete(el.dataset.id); refreshChargeList(); };
CH.selAll = () => {
  const c = co();
  const shown = sortCharges(filterCharges(c, ui.charges), ui.charges.sort, c).slice(0, ui.charges.limit);
  const all = shown.every((x) => ui.charges.sel.has(x.id));
  shown.forEach((x) => (all ? ui.charges.sel.delete(x.id) : ui.charges.sel.add(x.id)));
  refreshChargeList();
};
A.clearSel = () => { ui.charges.sel.clear(); refreshChargeList(); };

/* ---------- status ---------- */
const STATUS_DONE = { pago: 'marcada como paga', atrasado: 'marcada como em atraso', pendente: 'marcada como pendente', cancelado: 'cancelada' };
CH.chargeStatus = (el) => {
  const c = co();
  const ch = chargeById(c, el.dataset.id);
  if (!ch) return;
  if (!can('charges.status')) { el.value = ch.status; readOnlyToast(); return; }
  const to = el.value;
  const snap = setStatus(c, ch, to);
  if (!snap) return;
  if (!ui.charges.keep.has(ch.id)) ui.charges.keep.set(ch.id, snap.prev.status);
  save();
  if (to === 'pago') ui.flashPaid = { id: ch.id, until: Date.now() + 1700 };
  refreshPage();
  const undo = { label: 'Desfazer', run: () => { undoStatus(c, ch, snap); save(); refreshPage(); toast('Alteração desfeita.', { type: 'info' }); } };
  if (to === 'pendente' && ch.due < todayISO()) toast(`#${numStr(ch.num)} voltou para Pendente. Como o vencimento já passou, ela não entra em atraso sozinha até você mudar a data.`, { type: 'info', action: undo, timeout: 9000 });
  else toast(`#${numStr(ch.num)} ${STATUS_DONE[to]}${to === 'pago' ? ` (${fmtMoney(ch.paidAmount)}, hoje)` : ''}.`, { action: undo });
};
A.chargeMenu = (el) => {
  const c = co();
  const ch = chargeById(c, el.dataset.id);
  if (!ch) return;
  const cl = clientById(c, ch.clientId);
  const open = ch.status === 'pendente' || ch.status === 'atrasado';
  const items = [{ label: 'Ver detalhes', icon: 'eye', run: () => openChargeDetail(ch.id) }];
  if (open && can('charges.status')) items.push({ label: 'Registrar pagamento', icon: 'checkCircle', run: () => openPaymentModal(ch.id) });
  const pix = chargePix(c, ch);
  if (pix) items.push({ label: 'Copiar Pix copia e cola', icon: 'qr', run: () => copyText(pix, 'Pix copia e cola copiado.') });
  if (ch.status === 'pago') items.push({ label: 'Baixar recibo (PDF)', icon: 'fileCheck', run: () => downloadReceipt(ch.id) });
  if (open && canWhatsApp() && cl && waNumber(cl.phone)) items.push({ label: 'Mensagem personalizada', icon: 'chat', run: () => openCustomMessage(cl.id, [ch.id]) });

function updateChargePreview() {
  const p = document.getElementById('chg-preview');
  const kindEl = document.getElementById('chg-kind');
  if (!p || !kindEl) return;
  const k = kindEl.value;
  const n = clamp(parseInt(document.getElementById('chg-n').value, 10) || 0, 0, 36);
  const amount = parseMoney(document.getElementById('chg-amount').value);
  const due = document.getElementById('chg-due').value;
  if (k === 'recorrente' && document.getElementById('chg-dur').value === 'auto') {
    if (!amount || !isISODate(due)) { p.textContent = 'Preencha o valor e o vencimento da primeira cobrança.'; return; }
    const lead = recLead(co());
    p.textContent = `${fmtMoney(amount)} todo dia ${+due.slice(8, 10)}${+due.slice(8, 10) > 28 ? ' (ou no último dia do mês)' : ''}. A 1ª cobrança vence em ${fmtDate(due)} e as próximas são geradas sozinhas, ${lead} dias antes de cada vencimento, até você encerrar.`;
    return;
  }
  if (k === 'unica' || n < 2 || !amount || !isISODate(due)) { p.textContent = 'Preencha o valor, o vencimento e a quantidade.'; return; }
  const day = +due.slice(8, 10);
  const all = range(n).map((i) => (i === 0 ? due : addMonths(due, i, day)));
  const when = n <= 3
    ? `Vencimentos: ${all.slice(0, -1).map(fmtDateShort).join(', ')} e ${fmtDate(all[n - 1])}.`
    : `Vencimentos: ${all.slice(0, 2).map(fmtDateShort).join(', ')}… até ${fmtDate(all[n - 1])}.`;
  if (k === 'parcelada') {
    const base = Math.floor(amount / n), first = base + (amount - base * n);
    p.textContent = `${n} parcelas de ${fmtMoney(base)}${first !== base ? ` (a 1ª de ${fmtMoney(first)})` : ''}. ${when}`;
  } else p.textContent = `${n} cobranças mensais de ${fmtMoney(amount)}, total de ${fmtMoney(amount * n)}. ${when}`;
}
F.charge = (f) => {
  const c = co();
  const v = formValues(f);
  const id = f.dataset.id || null;
  const amount = parseMoney(v.amount);
  const errs = {};
  if (!v.clientId) errs.clientId = 'Escolha o cliente.';
  if (v.desc.length < 2) errs.desc = 'Descreva a cobrança.';
  if (!amount || amount <= 0) errs.amount = 'Digite um valor maior que zero.';
  if (!isISODate(v.due)) errs.due = 'Escolha a data de vencimento.';
  const kind = v.kind || 'unica';
  const auto = kind === 'recorrente' && v.dur === 'auto';
  const n = parseInt(v.n, 10);
  if (!id && kind !== 'unica' && !auto && (!(n >= 2) || n > 36)) errs.n = 'Use de 2 a 36.';
  if (!id && kind === 'parcelada' && amount && n >= 2 && amount < n) errs.amount = 'O valor é pequeno demais para essa quantidade de parcelas.';
  let paidAmount = null;
  if (id && f.elements.paidAmount) { paidAmount = parseMoney(v.paidAmount); if (!paidAmount || paidAmount <= 0) errs.paidAmount = 'Digite o valor recebido.'; if (!isISODate(v.paidAt)) errs.paidAt = 'Escolha a data do pagamento.'; }
  if (!showErrors(f, errs)) return;
  if (id) {
    updateCharge(c, chargeById(c, id), { clientId: v.clientId, desc: v.desc, amount, due: v.due, method: v.method, notes: v.notes, paidAmount, paidAt: v.paidAt, noFees: !!v.noFees });
    save();
    closeModal(true);
    refreshPage(false);
    toast('Cobrança atualizada.');
    return;
  }
  const firstAmount = kind === 'parcelada' ? amount - Math.floor(amount / n) * (n - 1) : amount;
  const dup = f.dataset.dupOk === '1' ? null : findDuplicate(c, { clientId: v.clientId, amount: firstAmount, due: v.due, desc: v.desc });
  if (dup) {
    f.dataset.dupOk = '1';
    clearErrors(f);
    const box = document.createElement('div');
    box.className = 'callout warn';
    box.setAttribute('role', 'alert');
    box.innerHTML = html`${icon('alert')}<div><strong>Parece repetida.</strong> Já existe a cobrança #${numStr(dup.num)} (${dup.desc}, ${fmtMoney(dup.amount)}, vence em ${fmtDate(dup.due)}, ${STATUS[dup.status].label.toLowerCase()}) para este cliente. Confira antes de lançar de novo.</div>`.s;
    f.prepend(box);
    const btn = document.querySelector('button[form="f-charge"]');
    if (btn) btn.textContent = 'Lançar mesmo assim';
    box.scrollIntoView({ block: 'nearest' });
    return;
  }
  let created;
  if (auto) {
    const rec = newRecurrence(c, { clientId: v.clientId, desc: v.desc, amount, method: v.method, start: v.due, notes: v.notes });
    created = [genRecCharge(c, rec, me().id)];
    const horizon = addDays(todayISO(), recLead(c));
    let guard = 0;
    while (rec.next <= horizon && guard++ < 24) created.push(genRecCharge(c, rec, me().id));
    if (v.paidNow) setStatus(c, created[0], 'pago', { note: 'Registrada como paga', silent: true });
    const cl = clientById(c, v.clientId);
    logAct(c, 'rec', `Criou a mensalidade automática ${v.desc} de ${fmtMoney(amount)} para ${cl ? cl.name : 'o cliente'}, todo dia ${rec.day}`, created[0].id);
  } else created = addCharges(c, { clientId: v.clientId, desc: v.desc, amount, due: v.due, method: v.method, kind, n, notes: v.notes, paidNow: !!v.paidNow });
  save();
  closeModal(true);
  if (v.paidNow) ui.flashPaid = { id: created[0].id, until: Date.now() + 1700 };
  refreshPage(false);
  const late = created.filter((x) => x.status === 'atrasado').length;
  const goAct = ui.route.page !== 'cobrancas' ? { label: 'Ver cobranças', run: () => go('cobrancas') } : null;
  if (auto) toast(`Mensalidade automática criada. ${created.length === 1 ? `A 1ª cobrança é a #${numStr(created[0].num)}` : `${created.length} cobranças já geradas`}; as próximas saem sozinhas.`, { action: goAct, timeout: 7000 });
  else toast(created.length === 1 ? `Cobrança #${numStr(created[0].num)} lançada${late ? ' (já vencida, entrou como Em atraso)' : ''}.` : `${created.length} cobranças lançadas${late ? `, ${late} já vencidas` : ''}.`, { action: goAct });
};

async function confirmDeleteCharges(ids) {
  if (!can('charges.edit')) return readOnlyToast();
  const c = co();
  const n = ids.length;
  const paid = ids.map((id) => chargeById(c, id)).filter((x) => x && x.status === 'pago').length;
  const ok = await confirmBox({ title: n === 1 ? 'Excluir esta cobrança?' : `Excluir ${n} cobranças?`, text: 'Essa ação não pode ser desfeita. Se a cobrança só não vai mais acontecer, prefira mudar o status para Cancelado.', detail: paid ? `${plural(paid, 'cobrança já paga será excluída', 'cobranças já pagas serão excluídas')} e deixará de contar nos recebimentos.` : '', ok: 'Excluir', danger: true });
  if (!ok) return;

  ids.forEach((id) => ui.charges.sel.delete(id));
  save();
  refreshPage(false);
  toast(n === 1 ? 'Cobrança excluída.' : `${n} cobranças excluídas.`);
}

function bulkSetStatus(to) {
  const c = co();

  for (const id of ui.charges.sel) { const ch = chargeById(c, id); if (!ch) continue; const s = setStatus(c, ch, to); if (s) { snaps.push([ch, s]); if (!ui.charges.keep.has(ch.id)) ui.charges.keep.set(ch.id, s.prev.status); } }
  if (!snaps.length) { toast('As cobranças selecionadas já estavam com esse status.', { type: 'info' }); return; }

}
